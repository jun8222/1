<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>치과기공사 국가시험 퀴즈</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #0a092d;
      --card-bg: #131436;
      --card-hover: #1e204d;
      --card-inner: #1a1a3a;
      --border-color: #2e3856;
      --text-main: #f6f7fb;
      --text-sub: #939bb4;
      --accent-blue: #4255ff;
      --accent-blue-hover: #2e40ea;
      --correct-green: #22c55e;
      --error-orange: #ff7842;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 상단 네비게이션 헤더 */
    .top-header {
      width: 100%;
      height: 64px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-dark);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .brand-title i {
      color: var(--accent-blue);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-profile-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .header-btn {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .header-btn:hover {
      background-color: var(--card-hover);
      border-color: var(--accent-blue);
    }

    .header-btn-logout {
      border-color: rgba(255, 120, 66, 0.4);
      color: var(--error-orange);
    }

    .header-btn-logout:hover {
      background-color: rgba(255, 120, 66, 0.15);
      border-color: var(--error-orange);
    }

    .header-icon-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1.2rem;
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .header-icon-btn:hover {
      background-color: var(--card-inner);
      color: var(--text-main);
    }

    /* 메인 컨테이너 */
    .main-container {
      flex: 1;
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    /* =========================================================
       [화면 0] 사용자 선택 화면 (User Select View)
       ========================================================= */
    #user-select-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      text-align: center;
    }

    .user-select-title {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .user-select-sub {
      color: var(--text-sub);
      font-size: 0.95rem;
      margin-bottom: 36px;
    }

    .user-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 520px;
      margin-bottom: 32px;
    }

    .user-card-btn {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px 16px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      transition: all 0.2s;
      outline: none;
    }

    .user-card-btn:hover {
      background-color: var(--card-hover);
      border-color: var(--accent-blue);
      transform: translateY(-4px);
    }

    .user-avatar-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background-color: var(--card-inner);
      border: 2px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: var(--accent-blue);
    }

    .user-name-text {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .user-role-text {
      font-size: 0.75rem;
      color: var(--text-sub);
      background-color: rgba(255, 255, 255, 0.05);
      padding: 2px 8px;
      border-radius: 10px;
    }

    /* =========================================================
       [화면 1] 메인 과목 목록 화면
       ========================================================= */
    #subject-view {
      display: none;
    }

    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .select-dropdown {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    .search-input-box {
      position: relative;
      width: 280px;
    }

    .search-input-box input {
      width: 100%;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 40px 10px 16px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    .search-input-box input:focus {
      border-color: var(--accent-blue);
    }

    .search-input-box i {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
    }

    .period-section-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 32px 0 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .subject-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .subject-card-wrapper {
      display: flex;
      flex-direction: column;
      background-color: transparent;
      border-radius: 12px;
      transition: all 0.2s ease;
    }

    .subject-card {
      padding: 14px 18px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
    }

    .subject-card:hover {
      background-color: var(--card-bg);
      border-color: var(--border-color);
    }

    .subject-card-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .card-icon-box {
      width: 44px;
      height: 44px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #3b82f6;
      font-size: 1.2rem;
    }

    .subject-info-title {
      font-size: 1.02rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .subject-info-sub {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .subject-card-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .recent-wrong-badge {
      background-color: rgba(255, 120, 66, 0.15);
      border: 1px solid rgba(255, 120, 66, 0.4);
      color: var(--error-orange);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-more-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1.1rem;
      padding: 8px 12px;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .card-more-btn:hover {
      color: var(--text-main);
      background-color: var(--card-inner);
    }

    /* 회차 이력 아코디언 드롭다운 패널 */
    .history-dropdown-panel {
      display: none;
      background-color: #0d0e2e;
      border: 1px solid var(--border-color);
      border-top: none;
      border-radius: 0 0 12px 12px;
      padding: 16px;
      margin-top: -4px;
      flex-direction: column;
      gap: 10px;
    }

    .history-card-item {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .history-meta-text {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 2px;
    }

    .history-action-btns {
      display: flex;
      gap: 8px;
    }

    .btn-action-sm {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
    }

    .btn-retry-wrong {
      background-color: rgba(255, 120, 66, 0.15);
      border-color: var(--error-orange);
      color: var(--error-orange);
    }

    .btn-retry-wrong:hover {
      background-color: var(--error-orange);
      color: #fff;
    }

    .btn-review-expl {
      background-color: var(--card-inner);
      border-color: var(--border-color);
      color: var(--text-main);
    }

    .btn-review-expl:hover {
      border-color: var(--accent-blue);
    }

    /* =========================================================
       [화면 2] 문제 풀이 화면
       ========================================================= */
    #quiz-view {
      display: none;
    }

    .progress-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .progress-count-badge {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .badge-correct {
      background-color: var(--correct-green);
      color: #fff;
    }

    .badge-total {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-sub);
    }

    .segmented-progress-bar {
      flex: 1;
      height: 8px;
      background-color: var(--card-bg);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      gap: 4px;
      padding: 1px;
    }

    .progress-segment {
      flex: 1;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      transition: background-color 0.3s;
    }

    .progress-segment.passed {
      background-color: var(--correct-green);
    }

    .progress-segment.failed {
      background-color: var(--error-orange);
    }

    .quiz-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 36px 40px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .quiz-card-header {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .quiz-question-title {
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.6;
      color: var(--text-main);
      margin-bottom: 20px;
    }

    .status-msg-banner {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--error-orange);
      margin-bottom: 18px;
      display: none;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .option-btn {
      background-color: transparent;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      color: var(--text-main);
      font-size: 0.95rem;
      text-align: left;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
    }

    .option-btn:nth-child(5) {
      grid-column: span 2;
    }

    .option-btn:hover:not(.disabled) {
      background-color: var(--card-inner);
      border-color: var(--accent-blue);
    }

    .option-top-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .option-idx {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-sub);
      min-width: 18px;
    }

    .option-explanation-inline {
      display: none;
      font-size: 0.82rem;
      color: #cbd5e1;
      padding-top: 8px;
      margin-top: 6px;
      border-top: 1px dashed rgba(255, 255, 255, 0.15);
      line-height: 1.45;
    }

    .option-btn.correct-choice {
      border: 2px solid var(--correct-green) !important;
      background-color: rgba(34, 197, 94, 0.08) !important;
    }

    .option-btn.correct-highlight {
      border: 2px dashed var(--correct-green) !important;
      background-color: rgba(34, 197, 94, 0.05) !important;
    }

    .option-btn.wrong-choice {
      border: 2px solid var(--error-orange) !important;
      background-color: rgba(255, 120, 66, 0.08) !important;
    }

    .option-btn.disabled {
      cursor: default;
    }

    .common-explanation-box {
      display: none;
      background-color: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 18px;
      margin-top: 16px;
      margin-bottom: 20px;
    }

    .expl-header {
      font-size: 0.9rem;
      font-weight: 700;
      color: #60a5fa;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .expl-body-text {
      font-size: 0.88rem;
      line-height: 1.55;
      color: #e2e8f0;
    }

    .quiz-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .report-issue-btn {
      background: none;
      border: none;
      color: #70799b;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }

    .report-issue-btn:hover {
      color: var(--text-main);
    }

    .dont-know-btn {
      background-color: var(--card-inner);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .dont-know-btn:hover {
      border-color: var(--accent-blue);
    }

    /* 하단 액션바 */
    .bottom-feedback-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 72px;
      background-color: #0d0f2b;
      border-top: 1px solid var(--border-color);
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 0 48px;
      z-index: 100;
    }

    .continue-btn {
      background-color: var(--accent-blue);
      color: #fff;
      border: none;
      padding: 12px 32px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* =========================================================
       모달 공통 스타일
       ========================================================= */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .modal-box {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 90%;
      max-width: 580px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 28px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .modal-close-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      background-color: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent-blue);
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 0.88rem;
    }

    .admin-table th, .admin-table td {
      border: 1px solid var(--border-color);
      padding: 10px;
      text-align: left;
    }

    .admin-table th {
      background-color: var(--card-inner);
      color: var(--text-sub);
    }
  </style>
</head>
<body>

  <!-- 상단 네비게이션 헤더 -->
  <header class="top-header">
    <div class="header-left">
      <div class="brand-title" id="nav-brand" onclick="goHome()">
        <i class="fa-solid fa-clone"></i>
        <span>학습하기</span>
      </div>
    </div>
    <div class="header-right" id="header-user-controls" style="display:none;">
      <div class="user-profile-badge">
        <i class="fa-solid fa-circle-user"></i>
        <span id="current-username">사용자</span>
      </div>
      <button class="header-btn" onclick="openProfileModal()"><i class="fa-solid fa-key"></i> 이름/PW 변경</button>
      <button class="header-btn" onclick="openReportListModal()"><i class="fa-solid fa-list-check"></i> 오류 검토 리스트</button>
      <button class="header-btn" id="admin-btn" style="display:none;" onclick="openAdminModal()"><i class="fa-solid fa-users-gear"></i> 회원 관리</button>
      <button class="header-btn header-btn-logout" onclick="logout()" title="사용자 선택으로 돌아가기"><i class="fa-solid fa-arrow-right-from-bracket"></i> 로그아웃</button>
      <button class="header-icon-btn" onclick="goHome()" title="나가기"><i class="fa-solid fa-xmark"></i></button>
    </div>
  </header>

  <!-- 메인 뷰 컨테이너 -->
  <main class="main-container">
    
    <!-- [화면 0] 사용자 선택 화면 (복구됨) -->
    <div id="user-select-view">
      <div class="user-select-title">학습할 프로필을 선택하세요</div>
      <div class="user-select-sub">계정을 선택하여 맞춤형 오답 기록과 학습을 시작합니다.</div>
      <div class="user-grid" id="user-grid-container">
        <!-- 동적 사용자 카드 생성 -->
      </div>
    </div>

    <!-- [화면 1] 메인 과목 목록 화면 -->
    <div id="subject-view">
      <div class="filter-bar">
        <select class="select-dropdown" id="period-filter" onchange="filterSubjects()">
          <option value="all">전체 교시</option>
          <option value="1">1교시 과목</option>
          <option value="2">2교시 과목</option>
        </select>
        <div class="search-input-box">
          <input type="text" id="subject-search" placeholder="제목으로 필터링" oninput="filterSubjects()">
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>
      </div>

      <!-- 1교시 섹션 -->
      <div id="section-period-1">
        <div class="period-section-title"><i class="fa-regular fa-clock"></i> 1교시</div>
        <div class="subject-list" id="subject-list-period-1"></div>
      </div>

      <!-- 2교시 섹션 -->
      <div id="section-period-2">
        <div class="period-section-title"><i class="fa-regular fa-clock"></i> 2교시</div>
        <div class="subject-list" id="subject-list-period-2"></div>
      </div>
    </div>

    <!-- [화면 2] 문제 풀이 화면 -->
    <div id="quiz-view">
      <div class="progress-wrapper">
        <div class="progress-count-badge badge-correct" id="quiz-badge-correct">0</div>
        <div class="segmented-progress-bar" id="segmented-bar"></div>
        <div class="progress-count-badge badge-total" id="quiz-badge-total">0</div>
      </div>

      <div class="quiz-card" id="quiz-card-box">
        <div>
          <div class="quiz-card-header">단어 • 문제</div>
          <div class="quiz-question-title" id="quiz-question-text">문제가 여기에 표시됩니다.</div>
          <div class="status-msg-banner" id="status-msg-banner">걱정하지 마세요, 아직 배우고 있잖아요!</div>
        </div>

        <div>
          <div class="options-grid" id="quiz-options-container"></div>

          <!-- 공통 해설 및 핵심 팁 박스 -->
          <div class="common-explanation-box" id="common-explanation-box">
            <div class="expl-header"><i class="fa-solid fa-lightbulb"></i> 핵심 해설 & TIP</div>
            <div class="expl-body-text" id="common-explanation-text"></div>
          </div>

          <div class="quiz-card-footer">
            <button class="report-issue-btn" onclick="openReportModal()" title="오류 검토 요청">
              <i class="fa-regular fa-flag"></i> 오류 검토 요청

              모르시겠어요?

  </main>

  <!-- 하단 정답 피드백 액션바 -->
  <div class="bottom-feedback-bar" id="bottom-feedback-bar">
    <div class="feedback-hint-text">정답을 클릭하거나 아무 키나 눌러 계속하세요</div>
    <button class="continue-btn" id="continue-btn" onclick="nextQuestion()">계속</button>
  </div>

  <!-- [모달 1] 오류 검토 요청 모달 -->
  <div class="modal-overlay" id="report-modal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title">오류 검토 요청</div>
        <button class="modal-close-btn" onclick="closeModal('report-modal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="form-group">
        <label>해당 문제</label>
        <textarea class="form-control" id="report-question-preview" rows="2" readonly></textarea>
      </div>
      <div class="form-group">
        <label>오류 내용 및 수정 건의</label>
        <textarea class="form-control" id="report-content" rows="4" placeholder="오탈자, 정답 오류, 해설 이상 내용 등을 적어주세요."></textarea>
      </div>
      <button class="continue-btn" style="width:100%;" onclick="submitReport()">검토 요청 보내기</button>
    </div>

  <!-- [모달 2] 이름/PW 변경 모달 -->
  <div class="modal-overlay" id="profile-modal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title">이름 / 비밀번호 변경</div>
        <button class="modal-close-btn" onclick="closeModal('profile-modal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="form-group">
        <label>사용자 이름</label>
        <input type="text" class="form-control" id="input-username">
      </div>
      <div class="form-group">
        <label>새 비밀번호</label>
        <input type="password" class="form-control" id="input-password" placeholder="변경할 새 비밀번호">
      </div>
      <button class="continue-btn" style="width:100%;" onclick="saveProfile()">저장하기</button>
    </div>
  </div>

  <!-- [모달 3] 오류 검토 리스트 모달 -->
  <div class="modal-overlay" id="report-list-modal">
    <div class="modal-box" style="max-width:700px;">
      <div class="modal-header">
        <div class="modal-title">접수된 오류 검토 리스트</div>
        <button class="modal-close-btn" onclick="closeModal('report-list-modal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="report-list-container"></div>
    </div>
  </div>

  <!-- [모달 4] 회원 관리 모달 (admin 전용) -->
  <div class="modal-overlay" id="admin-modal">
    <div class="modal-box" style="max-width:700px;">
      <div class="modal-header">
        <div class="modal-title"><i class="fa-solid fa-users-gear"></i> 회원 계정 관리 (Admin)</div>
        <button class="modal-close-btn" onclick="closeModal('admin-modal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="admin-user-list"></div>
    </div>
  </div>

  <!-- [모달 5] 회차 전체 문제 해설 확인 모달 -->
  <div class="modal-overlay" id="explanation-modal">
    <div class="modal-box" style="max-width:750px;">
      <div class="modal-header">
        <div class="modal-title" id="expl-modal-title">전체 문제 및 정답 해설</div>
        <button class="modal-close-btn" onclick="closeModal('explanation-modal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="expl-modal-content"></div>
    </div>
  </div>

  <!-- 11개 기본 과목 + 11개 기출 과목 스크립트 연결 -->
  <script src="./data/anatomy.js"></script>
  <script src="./data/anatomy_past.js"></script>
  <script src="./data/morphology.js"></script>
  <script src="./data/morphology_past.js"></script>
  <script src="./data/hygiene.js"></script>
  <script src="./data/hygiene_past.js"></script>
  <script src="./data/materials.js"></script>
  <script src="./data/materials_past.js"></script>
  <script src="./data/law.js"></script>
  <script src="./data/law_past.js"></script>

  <script src="./data/crown_bridge.js"></script>
  <script src="./data/crown_bridge_past.js"></script>
  <script src="./data/porcelain.js"></script>
  <script src="./data/porcelain_past.js"></script>
  <script src="./data/complete_denture.js"></script>
  <script src="./data/complete_denture_past.js"></script>
  <script src="./data/partial_denture.js"></script>
  <script src="./data/partial_denture_past.js"></script>
  <script src="./data/restorative.js"></script>
  <script src="./data/restorative_past.js"></script>
  <script src="./data/orthodontics.js"></script>
  <script src="./data/orthodontics_past.js"></script>

  <script>
    // 과목 메타데이터
    const subjectMeta = [
      // 1교시
      { key: 'anatomy', name: '구강해부학 (1~12)', period: 1 },
      { key: 'anatomy_past', name: '구강해부학 국시기출 (19~25년)', period: 1 },
      { key: 'morphology', name: '치아형태학 (13~28)', period: 1 },
      { key: 'morphology_past', name: '치아형태학 국시기출 (19~25년)', period: 1 },
      { key: 'hygiene', name: '구강보건학 (29~40)', period: 1 },
      { key: 'hygiene_past', name: '구강보건학 국시기출 (19~25년)', period: 1 },
      { key: 'materials', name: '치과재료학 (41~75)', period: 1 },
      { key: 'materials_past', name: '치과재료학 국시기출 (19~25년)', period: 1 },
      { key: 'law', name: '의료관계법규 (76~95)', period: 1 },
      { key: 'law_past', name: '의료관계법규 국시기출 (19~25년)', period: 1 },

      // 2교시
      { key: 'crown_bridge', name: '관교의치기공학 (1~19)', period: 2 },
      { key: 'crown_bridge_past', name: '관교의치기공학 국시기출 (19~25년)', period: 2 },
      { key: 'porcelain', name: '도재기공학 (20~34)', period: 2 },
      { key: 'porcelain_past', name: '도재기공학 국시기출 (19~25년)', period: 2 },
      { key: 'complete_denture', name: '총의치기공학 (35~58)', period: 2 },
      { key: 'complete_denture_past', name: '총의치기공학 국시기출 (19~25년)', period: 2 },
      { key: 'partial_denture', name: '국소의치기공학 (59~82)', period: 2 },
      { key: 'partial_denture_past', name: '국소의치기공학 국시기출 (19~25년)', period: 2 },
      { key: 'restorative', name: '충전기공학 (83~96)', period: 2 },
      { key: 'restorative_past', name: '충전기공학 국시기출 (19~25년)', period: 2 },
      { key: 'orthodontics', name: '교정기공학 (97~110)', period: 2 },
      { key: 'orthodontics_past', name: '교정기공학 국시기출 (19~25년)', period: 2 }
    ];

    let currentSubjectKey = null;
    let quizQuestions = [];
    let currentIndex = 0;
    let correctCount = 0;
    let currentSessionWrongItems = [];
    let isAnswerChecked = false;

    const STORAGE_KEY_HISTORY = 'quizlet_exam_history_v3';
    const STORAGE_KEY_USER = 'quizlet_current_user_v3';
    const STORAGE_KEY_USERS_DB = 'quizlet_users_db_v3';
    const STORAGE_KEY_REPORTS = 'quizlet_reports_db_v3';

    // 1. 초기 로드
    window.addEventListener('DOMContentLoaded', () => {
      initUserDatabase();
      checkAutoLogin();
      window.addEventListener('keydown', handleGlobalKeydown);
    });

    // 2. 계정 데이터베이스 초기화
    function initUserDatabase() {
      let users = JSON.parse(localStorage.getItem(STORAGE_KEY_USERS_DB) || '[]');
      if (users.length === 0) {
        users = [
          { username: 'admin', password: '123', role: 'admin' },
          { username: '박준영', password: '123', role: 'user' },
          { username: '학생', password: '123', role: 'user' }
        ];
        localStorage.setItem(STORAGE_KEY_USERS_DB, JSON.stringify(users));
      }
    }

    function checkAutoLogin() {
      const currentUser = JSON.parse(localStorage.getItem(STORAGE_KEY_USER) || 'null');
      if (currentUser) {
        // 이미 로그인된 상태
        showMainView(currentUser);
      } else {
        // 사용자 선택 화면 표시
        showUserSelectView();
      }
    }

    // 사용자 선택 화면 렌더링
    function showUserSelectView() {
      document.getElementById('user-select-view').style.display = 'flex';
      document.getElementById('subject-view').style.display = 'none';
      document.getElementById('quiz-view').style.display = 'none';
      document.getElementById('header-user-controls').style.display = 'none';

      const users = JSON.parse(localStorage.getItem(STORAGE_KEY_USERS_DB) || '[]');
      const container = document.getElementById('user-grid-container');
      container.innerHTML = '';

      users.forEach(u => {
        const btn = document.createElement('div');
        btn.className = 'user-card-btn';
        btn.onclick = () => loginUser(u.username);
        btn.innerHTML = `
          <div class="user-avatar-circle">
            <i class="fa-solid ${u.role === 'admin' ? 'fa-user-shield' : 'fa-user-graduate'}"></i>
          </div>
          <div class="user-name-text">${u.username}</div>
          <div class="user-role-text">${u.role === 'admin' ? '관리자' : '학습자'}</div>
        `;
        container.appendChild(btn);
      });
    }

    // 로그인 실행
    function loginUser(username) {
      const users = JSON.parse(localStorage.getItem(STORAGE_KEY_USERS_DB) || '[]');
      const target = users.find(u => u.username === username);
      if (!target) return;

      localStorage.setItem(STORAGE_KEY_USER, JSON.stringify(target));
      showMainView(target);
    }

    // 로그아웃 (사용자 선택 화면 복귀)
    function logout() {
      localStorage.removeItem(STORAGE_KEY_USER);
      showUserSelectView();
    }

    // 메인 화면 활성화
    function showMainView(user) {
      document.getElementById('user-select-view').style.display = 'none';
      document.getElementById('quiz-view').style.display = 'none';
      document.getElementById('subject-view').style.display = 'block';
      document.getElementById('header-user-controls').style.display = 'flex';

      document.getElementById('current-username').innerText = user.username;
      document.getElementById('admin-btn').style.display = (user.role === 'admin') ? 'flex' : 'none';

      renderSubjectList();
    }

    // 3. 프로필 변경 모달
    function openProfileModal() {
      const currentUser = JSON.parse(localStorage.getItem(STORAGE_KEY_USER));
      document.getElementById('input-username').value = currentUser.username;
      document.getElementById('input-password').value = currentUser.password;
      document.getElementById('profile-modal').style.display = 'flex';
    }

    function saveProfile() {
      const newName = document.getElementById('input-username').value.trim();
      const newPw = document.getElementById('input-password').value.trim();
      if (!newName || !newPw) {
        alert('이름과 비밀번호를 모두 입력해주세요.');
        return;
      }

      let users = JSON.parse(localStorage.getItem(STORAGE_KEY_USERS_DB) || '[]');
      let currentUser = JSON.parse(localStorage.getItem(STORAGE_KEY_USER));

      const idx = users.findIndex(u => u.username === currentUser.username);
      if (idx !== -1) {
        users[idx].username = newName;
        users[idx].password = newPw;
        currentUser.username = newName;
        currentUser.password = newPw;
      }

      localStorage.setItem(STORAGE_KEY_USERS_DB, JSON.stringify(users));
      localStorage.setItem(STORAGE_KEY_USER, JSON.stringify(currentUser));

      document.getElementById('current-username').innerText = newName;
      closeModal('profile-modal');
      alert('성공적으로 변경되었습니다.');
    }

    // 4. Admin 관리
    function openAdminModal() {
      const users = JSON.parse(localStorage.getItem(STORAGE_KEY_USERS_DB) || '[]');
      const container = document.getElementById('admin-user-list');
      
      let html = `
        <table class="admin-table">
          <thead>
            <tr>
              <th>사용자명</th>
              <th>역할</th>
              <th>비밀번호</th>
              <th>관리</th>
            </tr>
          </thead>
          <tbody>
      `;

      users.forEach((u, i) => {
        html += `
          <tr>
            <td><strong>${u.username}</strong></td>
            <td>${u.role}</td>
            <td>${u.password}</td>
            <td>
              ${u.role !== 'admin' ? `<button class="btn-action-sm btn-retry-wrong" onclick="resetUserPw(${i})">PW초기화</button>` : '-'}
            </td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      container.innerHTML = html;
      document.getElementById('admin-modal').style.display = 'flex';
    }

    function resetUserPw(index) {
      let users = JSON.parse(localStorage.getItem(STORAGE_KEY_USERS_DB) || '[]');
      users[index].password = '123';
      localStorage.setItem(STORAGE_KEY_USERS_DB, JSON.stringify(users));
      openAdminModal();
      alert(`${users[index].username}의 비밀번호가 123으로 초기화되었습니다.`);
    }

    // 5. 오류 검토 요청
    function openReportModal() {
      const q = quizQuestions[currentIndex];
      document.getElementById('report-question-preview').value = q ? q.question : '';
      document.getElementById('report-content').value = '';
      document.getElementById('report-modal').style.display = 'flex';
    }

    function submitReport() {
      const content = document.getElementById('report-content').value.trim();
      if (!content) {
        alert('내용을 입력해주세요.');
        return;
      }

      const q = quizQuestions[currentIndex];
      const currentUser = JSON.parse(localStorage.getItem(STORAGE_KEY_USER));
      const reports = JSON.parse(localStorage.getItem(STORAGE_KEY_REPORTS) || '[]');

      reports.unshift({
        id: Date.now(),
        user: currentUser ? currentUser.username : '익명',
        question: q.question,
        content: content,
        date: new Date().toLocaleString()
      });

      localStorage.setItem(STORAGE_KEY_REPORTS, JSON.stringify(reports));
      closeModal('report-modal');
      alert('오류 검토 요청이 접수되었습니다.');
    }

    function openReportListModal() {
      const reports = JSON.parse(localStorage.getItem(STORAGE_KEY_REPORTS) || '[]');
      const container = document.getElementById('report-list-container');
      
      if (reports.length === 0) {
        container.innerHTML = '<div style="color:var(--text-sub); text-align:center; padding:32px 0;">접수된 검토 요청이 없습니다.</div>';
      } else {
        let html = '';
        reports.forEach(r => {
          html += `
            <div style="background-color:var(--card-inner); border:1px solid var(--border-color); border-radius:8px; padding:12px; margin-bottom:10px;">
              <div style="font-size:0.8rem; color:var(--text-sub); margin-bottom:4px;">${r.date} • 작성자: ${r.user}</div>
              <div style="font-size:0.9rem; font-weight:600; margin-bottom:6px; color:#93c5fd;">[문제] ${r.question}</div>
              <div style="font-size:0.88rem; color:var(--text-main); white-space:pre-wrap;">${r.content}</div>
            </div>
          `;
        });
        container.innerHTML = html;
      }

      document.getElementById('report-list-modal').style.display = 'flex';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    // 6. 메인 과목 목록 렌더링 (1교시/2교시 분류)
    function renderSubjectList() {
      const p1Container = document.getElementById('subject-list-period-1');
      const p2Container = document.getElementById('subject-list-period-2');
      const periodVal = document.getElementById('period-filter').value;
      const searchVal = document.getElementById('subject-search').value.trim().toLowerCase();
      const db = window.quizDatabase || {};
      const history = getHistory();

      p1Container.innerHTML = '';
      p2Container.innerHTML = '';

      document.getElementById('section-period-1').style.display = (periodVal === 'all' || periodVal === '1') ? 'block' : 'none';
      document.getElementById('section-period-2').style.display = (periodVal === 'all' || periodVal === '2') ? 'block' : 'none';

      subjectMeta.forEach(meta => {
        if (periodVal !== 'all' && meta.period !== parseInt(periodVal)) return;
        if (searchVal && !meta.name.toLowerCase().includes(searchVal)) return;

        const subData = db[meta.key];
        const count = subData && subData.questions ? subData.questions.length : 0;

        const subjectHistories = history.filter(h => h.subjectKey === meta.key);
        const latestRecord = subjectHistories.length > 0 ? subjectHistories[0] : null;

        const wrapper = document.createElement('div');
        wrapper.className = 'subject-card-wrapper';

        let recentWrongBadgeHtml = '';
        if (latestRecord && latestRecord.wrongIds && latestRecord.wrongIds.length > 0) {
          recentWrongBadgeHtml = `
            <div class="recent-wrong-badge" title="최근 회차 오답">
              <i class="fa-solid fa-triangle-exclamation"></i>
              최근 오답 ${latestRecord.wrongIds.length}
            </div>
          `;
        }

        const card = document.createElement('div');
        card.className = 'subject-card';
        card.onclick = () => startQuiz(meta.key);

        card.innerHTML = `
          <div class="subject-card-left">
            <div class="card-icon-box">
              <i class="fa-regular fa-clone"></i>
            </div>
            <div>
              <div class="subject-info-title">${meta.name}</div>
              <div class="subject-info-sub">${count} 문항</div>
            </div>
          </div>
          <div class="subject-card-right">
            ${recentWrongBadgeHtml}
            <button class="card-more-btn" onclick="event.stopPropagation(); toggleSubjectDropdown('${meta.key}')" title="회차별 풀이 이력 열기">
              <i class="fa-solid fa-ellipsis"></i>
            </button>
          </div>
        `;

        // 회차별 풀이 이력 아코디언 드롭다운 패널
        const panel = document.createElement('div');
        panel.className = 'history-dropdown-panel';
        panel.id = `history-panel-${meta.key}`;

        if (subjectHistories.length === 0) {
          panel.innerHTML = '<div style="font-size:0.85rem; color:var(--text-sub); text-align:center; padding:12px;">풀이 이력이 없습니다.</div>';
        } else {
          subjectHistories.forEach(rec => {
            const item = document.createElement('div');
            item.className = 'history-card-item';
            item.innerHTML = `
              <div>
                <div class="history-meta-text">${rec.date}</div>
                <div style="font-size:0.9rem; font-weight:600;">
                  정답: ${rec.correct} / ${rec.total} 
                  ${rec.wrongIds.length > 0 ? `<span style="color:var(--error-orange); font-size:0.82rem;">(오답 ${rec.wrongIds.length})</span>` : '<span style="color:var(--correct-green); font-size:0.82rem;">(만점)</span>'}
                </div>
              </div>
              <div class="history-action-btns">
                <button class="btn-action-sm btn-review-expl" onclick="reviewHistoryExplanation('${meta.key}', ${rec.id})">전체 문제 해설</button>
                ${rec.wrongIds.length > 0 ? `<button class="btn-action-sm btn-retry-wrong" onclick="retryHistoryWrong('${meta.key}', ${rec.id})">오답 다시풀기</button>` : ''}
              </div>
            `;
            panel.appendChild(item);
          });
        }

        wrapper.appendChild(card);
        wrapper.appendChild(panel);

        if (meta.period === 1) {
          p1Container.appendChild(wrapper);
        } else {
          p2Container.appendChild(wrapper);
        }
      });
    }

    function filterSubjects() {
      renderSubjectList();
    }

    function toggleSubjectDropdown(key) {
      const panel = document.getElementById(`history-panel-${key}`);
      if (panel) {
        const isShown = panel.style.display === 'flex';
        panel.style.display = isShown ? 'none' : 'flex';
      }
    }

    // 7. 퀴즈 실행 로직
    function startQuiz(key, specificQuestions = null) {
      const db = window.quizDatabase || {};
      const sub = db[key];
      if (!sub || !sub.questions || sub.questions.length === 0) {
        alert('문항 데이터를 불러올 수 없습니다.');
        return;
      }

      currentSubjectKey = key;
      quizQuestions = specificQuestions ? specificQuestions : [...sub.questions];
      currentIndex = 0;
      correctCount = 0;
      currentSessionWrongItems = [];
      isAnswerChecked = false;

      document.getElementById('subject-view').style.display = 'none';
      document.getElementById('quiz-view').style.display = 'block';
      document.getElementById('bottom-feedback-bar').style.display = 'none';

      initProgressBar();
      renderCurrentQuestion();
    }

    function goHome() {
      document.getElementById('quiz-view').style.display = 'none';
      document.getElementById('bottom-feedback-bar').style.display = 'none';
      document.getElementById('subject-view').style.display = 'block';
      renderSubjectList();
    }

    function initProgressBar() {
      const barContainer = document.getElementById('segmented-bar');
      barContainer.innerHTML = '';
      quizQuestions.forEach((_, idx) => {
        const seg = document.createElement('div');
        seg.className = 'progress-segment';
        seg.id = `seg-${idx}`;
        barContainer.appendChild(seg);
      });
      document.getElementById('quiz-badge-correct').innerText = '0';
      document.getElementById('quiz-badge-total').innerText = quizQuestions.length;
    }

    function renderCurrentQuestion() {
      isAnswerChecked = false;
      document.getElementById('bottom-feedback-bar').style.display = 'none';
      document.getElementById('status-msg-banner').style.display = 'none';
      document.getElementById('common-explanation-box').style.display = 'none';

      const q = quizQuestions[currentIndex];
      document.getElementById('quiz-question-text').innerText = `${currentIndex + 1}. ${q.question}`;

      const optContainer = document.getElementById('quiz-options-container');
      optContainer.innerHTML = '';

      q.options.forEach((optText, idx) => {
        const optNum = idx + 1;
        const btn = document.createElement('div');
        btn.className = 'option-btn';
        btn.onclick = () => selectAnswer(optNum);

        const individualExpl = (q.optionExplanations && q.optionExplanations[optNum]) ? q.optionExplanations[optNum] : '';

        btn.innerHTML = `
          <div class="option-top-row">
            <span class="option-idx" id="opt-icon-${optNum}">${optNum}</span>
            <span>${optText}</span>
          </div>
          <div class="option-explanation-inline" id="opt-expl-${optNum}">${individualExpl}</div>
        `;
        optContainer.appendChild(btn);
      });
    }

    // 답안 선택 및 상세 해설/팁 동시 노출
    function selectAnswer(userPick) {
      if (isAnswerChecked) return;
      isAnswerChecked = true;

      const q = quizQuestions[currentIndex];
      const isCorrect = userPick === q.answer;
      const optButtons = document.querySelectorAll('.option-btn');
      const segment = document.getElementById(`seg-${currentIndex}`);

      optButtons.forEach(btn => btn.classList.add('disabled'));

      // 1) 모든 선택지 박스 내부 개별 해설 펼치기
      q.options.forEach((_, idx) => {
        const optNum = idx + 1;
        const explElem = document.getElementById(`opt-expl-${optNum}`);
        if (explElem && explElem.innerText.trim() !== '') {
          explElem.style.display = 'block';
        }
      });

      // 2) 하단 공통 해설 및 핵심 팁 박스 노출
      const commonExplText = (q.commonExplanations && q.commonExplanations.length > 0) ? q.commonExplanations.join('<br>') : '';
      if (commonExplText) {
        document.getElementById('common-explanation-text').innerHTML = commonExplText;
        document.getElementById('common-explanation-box').style.display = 'block';
      }

      if (isCorrect) {
        correctCount++;
        document.getElementById('quiz-badge-correct').innerText = correctCount;
        if (segment) segment.classList.add('passed');

        optButtons[userPick - 1].classList.add('correct-choice');
        document.getElementById(`opt-icon-${userPick}`).innerHTML = '<i class="fa-solid fa-check"></i>';
      } else {
        currentSessionWrongItems.push(q);
        if (segment) segment.classList.add('failed');

        if (userPick > 0 && userPick <= optButtons.length) {
          optButtons[userPick - 1].classList.add('wrong-choice');
          document.getElementById(`opt-icon-${userPick}`).innerHTML = '<i class="fa-solid fa-xmark"></i>';
        }

        optButtons[q.answer - 1].classList.add('correct-highlight');
        document.getElementById('status-msg-banner').style.display = 'block';
      }

      // 정답이든 오답이든 해설을 꼼꼼히 확인한 후 '계속'을 누를 수 있도록 하단 액션바 팝업
      document.getElementById('bottom-feedback-bar').style.display = 'flex';
    }

    function handleDontKnow() {
      if (isAnswerChecked) return;
      selectAnswer(-1); // 오답 처리
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < quizQuestions.length) {
        renderCurrentQuestion();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        finishQuizSession();
      }
    }

    function finishQuizSession() {
      document.getElementById('bottom-feedback-bar').style.display = 'none';

      const wrongIds = currentSessionWrongItems.map(item => item.id);
      saveSessionHistory(currentSubjectKey, quizQuestions.length, correctCount, wrongIds);

      const cardBox = document.getElementById('quiz-card-box');
      cardBox.innerHTML = `
        <div style="text-align:center; padding:40px 16px;">
          <div style="font-size:3rem; color:var(--correct-green); margin-bottom:16px;"><i class="fa-solid fa-circle-check"></i></div>
          <h2 style="font-size:1.5rem; margin-bottom:12px;">학습을 완료했습니다!</h2>
          <p style="color:var(--text-sub); margin-bottom:28px;">
            총 ${quizQuestions.length}문항 중 <strong style="color:var(--correct-green);">${correctCount}문항</strong> 정답
            ${wrongIds.length > 0 ? `<br><span style="color:var(--error-orange);">오답 ${wrongIds.length}문항</span>` : ''}
          </p>
          <div style="display:flex; gap:12px; justify-content:center;">
            <button class="continue-btn" onclick="goHome()">과목 목록으로</button>
            ${wrongIds.length > 0 ? `
              <button class="btn-action-sm btn-retry-wrong" style="padding:12px 24px; font-size:0.95rem;" onclick="retryWrongQuestions()">
                오답 ${wrongIds.length}문제 다시 풀기
              </button>
            ` : ''}
          </div>
        </div>
      `;
    }

    function retryWrongQuestions() {
      startQuiz(currentSubjectKey, currentSessionWrongItems);
    }

    function handleGlobalKeydown(e) {
      if (document.getElementById('quiz-view').style.display !== 'block') return;

      if (!isAnswerChecked) {
        if (['1', '2', '3', '4', '5'].includes(e.key)) {
          const pick = parseInt(e.key);
          const q = quizQuestions[currentIndex];
          if (q && pick <= q.options.length) {
            selectAnswer(pick);
          }
        }
      } else {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          nextQuestion();
        }
      }
    }

    // 8. 풀이 이력(History) 및 해설 확인
    function getHistory() {
      try {
        const data = localStorage.getItem(STORAGE_KEY_HISTORY);
        return data ? JSON.parse(data) : [];
      } catch (e) {
        return [];
      }
    }

    function saveSessionHistory(subjectKey, total, correct, wrongIds) {
      const history = getHistory();
      const meta = subjectMeta.find(m => m.key === subjectKey);
      const newEntry = {
        id: Date.now(),
        subjectKey: subjectKey,
        subjectName: meta ? meta.name : subjectKey,
        date: new Date().toLocaleString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
        total: total,
        correct: correct,
        wrongIds: wrongIds
      };
      history.unshift(newEntry);
      if (history.length > 40) history.pop();
      localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(history));
    }

    function retryHistoryWrong(subjectKey, historyId) {
      const history = getHistory();
      const rec = history.find(h => h.id === historyId);
      if (!rec || !rec.wrongIds || rec.wrongIds.length === 0) return;

      const db = window.quizDatabase || {};
      const sub = db[subjectKey];
      if (!sub) return;

      const wrongQuestions = sub.questions.filter(q => rec.wrongIds.includes(q.id));
      startQuiz(subjectKey, wrongQuestions);
    }

    function reviewHistoryExplanation(subjectKey, historyId) {
      const db = window.quizDatabase || {};
      const sub = db[subjectKey];
      if (!sub) return;

      document.getElementById('expl-modal-title').innerText = `${sub.title || '과목'} - 전체 문제 및 해설`;
      const container = document.getElementById('expl-modal-content');
      container.innerHTML = '';

      sub.questions.forEach((q, idx) => {
        const itemDiv = document.createElement('div');
        itemDiv.style.cssText = 'background:var(--card-inner); border:1px solid var(--border-color); border-radius:10px; padding:16px; margin-bottom:14px;';

        let optionsHtml = '';
        q.options.forEach((opt, optIdx) => {
          const optNum = optIdx + 1;
          const isAns = (optNum === q.answer);
          const expl = (q.optionExplanations && q.optionExplanations[optNum]) ? q.optionExplanations[optNum] : '';
          optionsHtml += `
            <div style="margin-top:6px; font-size:0.88rem; color:${isAns ? 'var(--correct-green)' : 'var(--text-sub)'}; font-weight:${isAns ? '700' : '400'};">
              ${optNum}. ${opt} ${isAns ? '✓ (정답)' : ''}
              ${expl ? `<div style="font-size:0.8rem; color:#cbd5e1; margin-left:14px; margin-top:2px;">↳ ${expl}</div>` : ''}
            </div>
          `;
        });

        const commonExpl = (q.commonExplanations && q.commonExplanations.length > 0) ? q.commonExplanations.join('<br>') : '';

        itemDiv.innerHTML = `
          <div style="font-weight:700; margin-bottom:8px; font-size:0.95rem;">${idx + 1}. ${q.question}</div>
          <div style="margin-bottom:10px;">${optionsHtml}</div>
          ${commonExpl ? `<div style="background:rgba(96,165,250,0.1); border-left:3px solid #60a5fa; padding:8px 12px; font-size:0.82rem; color:#93c5fd;"><strong>[핵심 TIP]</strong> ${commonExpl}</div>` : ''}
        `;
        container.appendChild(itemDiv);
      });

      document.getElementById('explanation-modal').style.display = 'flex';
    }
  </script>
</body>
</html>
