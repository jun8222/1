<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>국가고시 대비 실전 퀴즈</title>
  <style>
    :root {
      --bg-dark: #1e222b;
      --card-bg: #272c38;
      --opt-bg: #1f232d;
      --opt-hover: #2d3342;
      --border: #3b4252;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      
      --correct-border: #22c55e;
      --correct-text: #4ade80;
      --wrong-border: #ef4444;
      --wrong-text: #f87171;
      --primary: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text);
      line-height: 1.6;
      padding: 24px 16px;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    /* 첫 화면: 과목 선택 카드 */
    #selection-screen {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 30px;
    }

    .select-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 32px 24px;
      text-align: center;
    }

    .select-card h2 {
      font-size: 1.55rem;
      margin-bottom: 10px;
      color: #f8fafc;
    }

    .select-card p {
      color: var(--text-muted);
      font-size: 0.98rem;
      margin-bottom: 28px;
    }

    .subject-btn-group {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    @media (max-width: 650px) {
      .subject-btn-group {
        grid-template-columns: 1fr;
      }
    }

    .subject-select-btn {
      padding: 20px 16px;
      background-color: var(--opt-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: #f8fafc;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
    }

    .subject-select-btn:hover {
      background-color: var(--opt-hover);
      border-color: var(--primary);
      transform: translateY(-3px);
    }

    .badge {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      font-size: 0.85rem;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 500;
    }

    /* 퀴즈 영역 */
    #quiz-view {
      display: none;
    }

    header {
      background: var(--card-bg);
      padding: 18px 24px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.88rem;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: var(--opt-hover);
      color: #fff;
    }

    header h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .score-bar {
      display: flex;
      gap: 16px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #60a5fa;
    }

    .quiz-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }

    .q-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 14px;
      color: #f8fafc;
      line-height: 1.5;
    }

    .q-number {
      color: #60a5fa;
      margin-right: 8px;
    }

    .q-context-box {
      background: rgba(15, 23, 42, 0.45);
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 0.95rem;
      color: #cbd5e1;
      margin-bottom: 18px;
      white-space: pre-line;
      border: 1px solid #475569;
      line-height: 1.7;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-card {
      width: 100%;
      text-align: left;
      padding: 16px 20px;
      background-color: var(--opt-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      color: var(--text);
      transition: all 0.2s ease;
      display: block;
    }

    .option-card:hover:not(:disabled) {
      background-color: var(--opt-hover);
      border-color: #64748b;
    }

    .option-card:disabled {
      cursor: default;
    }

    .option-header {
      font-size: 1.02rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .option-inner-exp {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .status-label {
      display: none;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 6px;
    }

    .status-label.correct {
      color: var(--correct-text);
    }

    .status-label.wrong {
      color: var(--wrong-text);
    }

    .exp-content {
      font-size: 0.92rem;
      color: #cbd5e1;
      line-height: 1.55;
    }

    .option-card.user-correct {
      border: 1.5px solid var(--correct-border) !important;
      background-color: rgba(34, 197, 94, 0.08);
    }

    .option-card.user-wrong {
      border: 1.5px solid var(--wrong-border) !important;
      background-color: rgba(239, 68, 68, 0.08);
    }

    .option-card.target-answer {
      border: 1.5px solid var(--correct-border) !important;
      background-color: rgba(34, 197, 94, 0.05);
    }

    .common-feedback {
      display: none;
      margin-top: 16px;
      padding: 16px;
      border-radius: 10px;
      background-color: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
    }

    .common-title {
      font-weight: 700;
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    .common-item {
      font-size: 0.9rem;
      color: #cbd5e1;
      padding-left: 10px;
      border-left: 3px solid #64748b;
      margin-bottom: 6px;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- 과목 선택 화면 -->
    <div id="selection-screen">
      <div class="select-card">
        <h2>국가고시 과목별 실전 퀴즈</h2>
        <p>풀이하고자 하는 과목을 선택해주세요.</p>
        <div class="subject-btn-group">
          <button type="button" class="subject-select-btn" onclick="startSubject('anatomy')">
            <span>구강해부학</span>
            <span class="badge">1번 ~ 36번 (36문항)</span>
          </button>
          <button type="button" class="subject-select-btn" onclick="startSubject('morphology')">
            <span>치아형태학</span>
            <span class="badge">1번 ~ 48번 (48문항)</span>
          </button>
          <button type="button" class="subject-select-btn" onclick="startSubject('hygiene')">
            <span>구강보건학</span>
            <span class="badge">1번 ~ 36번 (36문항)</span>
          </button>
          <button type="button" class="subject-select-btn" onclick="startSubject('materials')">
            <span>치과재료학</span>
            <span class="badge">1번 ~ 105번 (105문항)</span>
          </button>
          <button type="button" class="subject-select-btn" onclick="startSubject('law')" style="grid-column: span 2;">
            <span>의료관계법규</span>
            <span class="badge">1번 ~ 100번 (100문항)</span>
          </button>
        </div>
      </div>
    </div>

    <!-- 퀴즈 풀이 화면 -->
    <div id="quiz-view">
      <header>
        <div class="header-left">
          <button type="button" class="back-btn" onclick="goHome()">← 과목 선택</button>
          <h1 id="quiz-header-title">실전 퀴즈</h1>
        </div>
        <div class="score-bar">
          <span>진행도: <span id="progress-count">0</span> / <span id="total-count">0</span></span>
          <span>정답수: <span id="score-count">0</span>점</span>
        </div>
      </header>

      <div id="quiz-container"></div>
    </div>

  </div>

  <script>
    // 기존 4개 과목 데이터베이스
    const quizDatabase = {
      anatomy: {
        title: "구강해부학 (1번 ~ 36번)",

          {
            id: 1, question: "이공의 해부학적 위치는?",

          {

          {

    const labels = ["A", "B", "C", "D", "E"];
    let currentSubjectKey = "anatomy";
    let solvedCount = 0;
    let score = 0;

    function startSubject(subjectKey) {
      currentSubjectKey = subjectKey;
      solvedCount = 0;
      score = 0;

      const subData = quizDatabase[subjectKey];
      document.getElementById("quiz-header-title").textContent = subData.title;
      document.getElementById("total-count").textContent = subData.questions.length;
      document.getElementById("progress-count").textContent = "0";
      document.getElementById("score-count").textContent = "0";

      document.getElementById("selection-screen").style.display = "none";
      document.getElementById("quiz-view").style.display = "block";

      renderQuiz(subData.questions);
      window.scrollTo(0, 0);
    }

    function goHome() {
      document.getElementById("quiz-view").style.display = "none";
      document.getElementById("selection-screen").style.display = "flex";
      window.scrollTo(0, 0);
    }

    function renderQuiz(questions) {
      const container = document.getElementById("quiz-container");
      container.innerHTML = "";

      questions.forEach((item, qIdx) => {
        const card = document.createElement("div");
        card.className = "quiz-card";
        card.id = `q-${item.id}`;

        let contextHtml = item.contextBox ? `<div class="q-context-box">${item.contextBox}</div>` : "";

        let optionsHtml = item.options.map((opt, optIdx) => {
          const choiceNum = optIdx + 1;
          const optExp = item.optionExplanations[choiceNum] || "";
          const isCorrectChoice = choiceNum === item.answer;

          return `
            <button type="button" class="option-card" id="btn-${item.id}-${choiceNum}" onclick="checkAnswer(${qIdx}, ${choiceNum})">
              <div class="option-header">
                <span style="color: #94a3b8; font-weight: 700;">${labels[optIdx]}.</span>
                <span>${opt}</span>
              </div>
              <div class="option-inner-exp" id="exp-${item.id}-${choiceNum}">
                <div class="status-label ${isCorrectChoice ? 'correct' : 'wrong'}" id="label-${item.id}-${choiceNum}">
                  ${isCorrectChoice ? '✓ 정답' : '✕ 오답'}
                </div>
                ${optExp ? `<div class="exp-content">${optExp}</div>` : ''}
              </div>
            </button>
          `;
        }).join("");

        const hasCommon = item.commonExplanations && item.commonExplanations.length > 0;
        let commonItemsHtml = hasCommon ? item.commonExplanations.map(exp => `
          <div class="common-item">${exp}</div>
        `).join("") : "";

        card.innerHTML = `
          <div class="q-title">
            <span class="q-number">${item.id}.</span>${item.question}
          </div>
          ${contextHtml}
          <div class="options-list">
            ${optionsHtml}
          </div>
          ${hasCommon ? `
            <div class="common-feedback" id="common-feedback-${item.id}">
              <div class="common-title">공통 오답 해설 및 핵심 포인트:</div>
              ${commonItemsHtml}
            </div>
          ` : ""}
        `;

        container.appendChild(card);
      });
    }

    function checkAnswer(qIdx, selectedChoice) {
      const questions = quizDatabase[currentSubjectKey].questions;
      const item = questions[qIdx];
      const card = document.getElementById(`q-${item.id}`);
      if (card.classList.contains("answered")) return;

      card.classList.add("answered");
      solvedCount++;

      const isCorrect = selectedChoice === item.answer;
      if (isCorrect) score++;

      document.getElementById("progress-count").textContent = solvedCount;
      document.getElementById("score-count").textContent = score;

      const buttons = card.querySelectorAll(".option-card");
      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        const choiceNum = idx + 1;
        const innerExp = document.getElementById(`exp-${item.id}-${choiceNum}`);
        const statusLabel = document.getElementById(`label-${item.id}-${choiceNum}`);

        if (choiceNum === selectedChoice) {
          if (isCorrect) {
            btn.classList.add("user-correct");
            if (statusLabel) statusLabel.style.display = "flex";
          } else {
            btn.classList.add("user-wrong");
            if (statusLabel) statusLabel.style.display = "flex";
          }
          if (innerExp) innerExp.style.display = "block";
        } else if (choiceNum === item.answer) {
          btn.classList.add("target-answer");
          if (statusLabel) statusLabel.style.display = "flex";
          if (innerExp) innerExp.style.display = "block";
        } else if (item.optionExplanations[choiceNum]) {
          if (innerExp) innerExp.style.display = "block";
        }
      });

      const commonFeedback = document.getElementById(`common-feedback-${item.id}`);
      if (commonFeedback) {
        commonFeedback.style.display = "block";
      }
    }
  </script>
