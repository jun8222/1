<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>치기공과 국가고시 실전 퀴즈</title>
  <style>
    :root {
      --bg-dark: #13161c;
      --card-bg: #1e222b;
      --opt-bg: #272c38;
      --opt-hover: #323847;
      --border: #333a48;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      
      --correct-border: #22c55e;
      --correct-text: #4ade80;
      --wrong-border: #ef4444;
      --wrong-text: #f87171;
      --primary: #4f46e5;
      --primary-light: #6366f1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text);
      line-height: 1.6;
      padding: 24px 16px;
    }
    .container { max-width: 820px; margin: 0 auto; }

    /* 데이터 관리 상단 바 (백업 및 초기화) */
    .top-data-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .sm-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .sm-btn:hover { background: var(--opt-hover); color: #fff; }

    /* 과목 선택 화면 */
    #selection-screen {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .select-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 20px;
    }
    .select-card h2 {
      font-size: 1.55rem;
      margin-bottom: 6px;
      color: #f8fafc;
      text-align: center;
    }
    .select-card p {
      color: var(--text-muted);
      font-size: 0.94rem;
      margin-bottom: 18px;
      text-align: center;
    }

    .quiz-options-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      gap: 24px;
      flex-wrap: wrap;
    }
    .shuffle-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #cbd5e1;
      cursor: pointer;
      user-select: none;
    }
    .shuffle-label input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary-light);
      cursor: pointer;
    }

    .period-section-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #818cf8;
      margin: 18px 0 10px 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .subject-list-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .subject-row-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--opt-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      gap: 12px;
      flex-wrap: wrap;
      transition: all 0.2s ease;
    }
    .subject-row-card:hover {
      border-color: #64748b;
    }
    .subj-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .subj-main-title {
      font-size: 1.02rem;
      font-weight: 700;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .subj-user-stats {
      font-size: 0.82rem;
      color: #94a3b8;
      display: flex;
      gap: 14px;
    }
    .stat-highlight { color: #38bdf8; font-weight: 600; }
    .stat-wrong { color: #f87171; font-weight: 600; }

    .subj-btn-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .play-btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--border);
      background-color: var(--card-bg);
      color: #cbd5e1;
      transition: all 0.2s ease;
    }
    .play-btn:hover { background: var(--opt-hover); color: #fff; }
    .play-btn.primary {
      background: var(--primary);
      border-color: var(--primary-light);
      color: #fff;
    }
    .play-btn.primary:hover { background: var(--primary-light); }
    .play-btn.wrong-only {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
    .play-btn.wrong-only:hover {
      background: #ef4444;
      color: #fff;
    }

    /* 퀴즈 풀이 화면 */
    #quiz-view { display: none; }
    .quiz-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 0 4px;
    }
    .back-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.88rem;
    }
    .back-btn:hover { background: var(--opt-hover); color: #fff; }
    .q-step-text { font-size: 0.95rem; font-weight: 600; color: #cbd5e1; }

    .progress-track {
      width: 100%;
      height: 8px;
      background-color: #272c38;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4f46e5, #6366f1);
      width: 0%;
      transition: width 0.3s ease;
    }

    .quiz-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .q-title {
      font-size: 1.18rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: #f8fafc;
      line-height: 1.5;
    }
    .q-context-box {
      background: rgba(15, 23, 42, 0.45);
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 0.95rem;
      color: #cbd5e1;
      margin-bottom: 18px;
      white-space: pre-line;
      border: 1px solid #333a48;
      line-height: 1.7;
    }

    .options-list { display: flex; flex-direction: column; gap: 12px; }
    .option-card {
      width: 100%;
      text-align: left;
      padding: 16px 20px;
      background-color: var(--opt-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      color: var(--text);
      display: block;
      transition: all 0.2s ease;
    }
    .option-card:hover:not(:disabled) {
      background-color: var(--opt-hover);
      border-color: #64748b;
    }
    .option-card:disabled { cursor: default; }

    .option-header {
      font-size: 1.02rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .option-title-wrap { display: flex; align-items: center; gap: 8px; }
    .key-hint {
      font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .option-inner-exp {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .status-label {
      display: none;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 6px;
    }
    .status-label.correct { color: var(--correct-text); }
    .status-label.wrong { color: var(--wrong-text); }
    .exp-content { font-size: 0.92rem; color: #cbd5e1; line-height: 1.55; }

    .option-card.user-correct {
      border: 1.5px solid var(--correct-border) !important;
      background-color: rgba(34, 197, 94, 0.08);
    }
    .option-card.user-wrong {
      border: 1.5px solid var(--wrong-border) !important;
      background-color: rgba(239, 68, 68, 0.08);
    }
    .option-card.target-answer {
      border: 1.5px solid var(--correct-border) !important;
      background-color: rgba(34, 197, 94, 0.05);
    }

    .common-feedback {
      display: none;
      margin-top: 16px;
      padding: 16px;
      border-radius: 10px;
      background-color: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
    }
    .common-title { font-weight: 700; color: #94a3b8; font-size: 0.9rem; margin-bottom: 8px; }
    .common-item {
      font-size: 0.9rem;
      color: #cbd5e1;
      padding-left: 10px;
      border-left: 3px solid #64748b;
      margin-bottom: 6px;
      white-space: pre-line;
    }

    .quiz-bottom-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
    }
    .action-btn {
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background-color: var(--card-bg);
      color: #cbd5e1;
      transition: all 0.2s ease;
    }
    .action-btn:hover:not(:disabled) { background-color: var(--opt-hover); color: #fff; }
    .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .action-btn.primary {
      background-color: var(--primary);
      border-color: var(--primary-light);
      color: #fff;
    }
    .action-btn.primary:hover:not(:disabled) { background-color: var(--primary-light); }
    .action-btn.warning {
      background-color: #dc2626;
      border-color: #ef4444;
      color: #fff;
    }
    .action-btn.warning:hover:not(:disabled) { background-color: #ef4444; }

    /* 결과 요약 화면 */
    #result-view { display: none; }
    .result-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 28px;
      margin-bottom: 20px;
    }
    .result-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .result-header-row h3 { font-size: 1.15rem; color: #94a3b8; font-weight: 500; }
    .review-top-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: #f8fafc;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .review-top-btn:hover { background: rgba(255, 255, 255, 0.12); }

    .score-headline {
      font-size: 2.2rem;
      font-weight: 800;
      color: #f8fafc;
      margin-bottom: 20px;
    }

    .result-stats-bar {
      width: 100%;
      height: 12px;
      background-color: #2b303d;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .result-stats-fill {
      height: 100%;
      background: #4f46e5;
      width: 0%;
    }

    .stats-legend {
      display: flex;
      align-items: center;
      gap: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; font-weight: 500; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot.correct { background: #6366f1; }
    .dot.wrong { background: #ef4444; }
    .dot.skipped { border: 2px solid #64748b; background: transparent; }

    .skipped-list-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 16px;
    }

    .missed-question-card {
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 14px;
      border-left: 4px solid #64748b;
    }
    .missed-question-card.wrong-border { border-left-color: var(--wrong-border); }

    .missed-header {
      font-size: 1.02rem;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 10px;
      line-height: 1.45;
    }
    .missed-details {
      font-size: 0.92rem;
      color: #cbd5e1;
      margin-bottom: 10px;
    }
    .missed-common-box {
      background: rgba(15, 23, 42, 0.5);
      border-radius: 8px;
      padding: 12px 14px;
      margin-top: 10px;
      border: 1px dashed #475569;
    }
    .missed-common-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .retry-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    .retry-card span { font-size: 1.15rem; font-weight: 700; color: #f8fafc; }
    .retry-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- 상단 데이터 관리 바 (백업 및 초기화) -->
    <div class="top-data-bar">
      <button type="button" class="sm-btn" onclick="backupData()">💾 기록 백업</button>
      <button type="button" class="sm-btn" onclick="restoreDataPrompt()">📂 기록 복구</button>
      <button type="button" class="sm-btn" style="color:#f87171;" onclick="resetAllData()">기록 초기화</button>
    </div>

    <!-- 1. 과목 선택 화면 -->
    <div id="selection-screen">
      <div class="select-card">
        <h2>치기공과 국가고시 실전 퀴즈</h2>
        <p>각 과목별 푼 횟수와 누적 오답이 이 기기에 자동으로 저장됩니다.</p>

        <!-- 무작위 섞기 토글 옵션 바 -->
        <div class="quiz-options-bar">
          <label class="shuffle-label">
            <input type="checkbox" id="shuffle-q-toggle" checked>
            <span>🔀 문제 순서 무작위 섞기</span>
          </label>
          <label class="shuffle-label">
            <input type="checkbox" id="shuffle-opt-toggle" checked>
            <span>🔀 선택지(보기 A~E) 무작위 섞기</span>
          </label>
        </div>

        <!-- 1교시 (5과목) -->
        <div class="period-section-title">📘 제1교시 필기 시험 (5과목)</div>
        <div class="subject-list-group" id="group-period-1"></div>

        <!-- 2교시 (6과목) -->
        <div class="period-section-title">📙 제2교시 필기 시험 (6과목)</div>
        <div class="subject-list-group" id="group-period-2"></div>
      </div>
    </div>

    <!-- 2. 퀴즈 풀이 화면 (1문제씩 뷰어) -->
    <div id="quiz-view">
      <div class="quiz-top-bar">
        <button type="button" class="back-btn" onclick="confirmExit()">← 그만두기</button>
        <div class="q-step-text" id="question-progress-text">1 / 10</div>
      </div>

      <div class="progress-track">
        <div class="progress-fill" id="progress-bar-fill"></div>
      </div>

      <div id="single-question-container"></div>

      <div class="quiz-bottom-actions">
        <button type="button" class="action-btn" id="prev-btn" onclick="prevQuestion()">← 이전 문제</button>
        <button type="button" class="action-btn" id="skip-next-btn" onclick="skipOrNextQuestion()">건너뛰기</button>
      </div>
    </div>

    <!-- 3. 결과 요약 화면 -->
    <div id="result-view">
      <div class="result-card">
        <div class="result-header-row">
          <h3>내 점수</h3>
          <button type="button" class="review-top-btn" onclick="enterReviewMode()">전체 검토</button>
        </div>
        <div class="score-headline" id="score-headline-text">0/0 (0%)</div>

        <div class="result-stats-bar">
          <div class="result-stats-fill" id="result-progress-fill"></div>
        </div>

        <div class="stats-legend">
          <div class="legend-item"><div class="dot correct"></div> 정답 (<span id="count-correct">0</span>)</div>
          <div class="legend-item"><div class="dot wrong"></div> 오답 (<span id="count-wrong">0</span>)</div>
          <div class="legend-item"><div class="dot skipped"></div> 건너뛴 문제 (<span id="count-skipped">0</span>)</div>
        </div>

        <div id="missed-questions-section">
          <div class="skipped-list-title" id="missed-summary-title">틀리거나 건너뛴 문제 및 핵심 포인트</div>
          <div id="missed-questions-list"></div>
        </div>
      </div>

      <div class="retry-card">
        <span>다시 시도해 보세요</span>
        <div class="retry-actions">
          <button type="button" class="action-btn" onclick="goHome()">과목 선택</button>
          <button type="button" class="action-btn warning" id="retry-wrong-btn" onclick="retryWrongQuestionsOnly()">✍ 이번 오답만 다시 풀기</button>
          <button type="button" class="action-btn primary" onclick="retryEntireQuiz()">↺ 퀴즈 전체 다시 풀기</button>
        </div>
      </div>
    </div>

  </div>

  <!-- 11개 과목 데이터 스크립트 연결 -->
  <script src="./data/anatomy.js"></script>
  <script src="./data/morphology.js"></script>
  <script src="./data/hygiene.js"></script>
  <script src="./data/materials.js"></script>
  <script src="./data/law.js"></script>
  <script src="./data/crown_bridge.js"></script>
  <script src="./data/porcelain.js"></script>
  <script src="./data/complete_denture.js"></script>
  <script src="./data/partial_denture.js"></script>
  <script src="./data/restorative.js"></script>
  <script src="./data/orthodontics.js"></script>

  <script>
    const labels = ["A", "B", "C", "D", "E"];

    // 11개 과목 메타데이터 정의
    const subjectMeta = [
      { key: 'anatomy', name: '구강해부학 (1교시 1~12)', period: 1 },
      { key: 'morphology', name: '치아형태학 (1교시 13~28)', period: 1 },
      { key: 'hygiene', name: '구강보건학 (1교시 29~40)', period: 1 },
      { key: 'materials', name: '치과재료학 (1교시 41~75)', period: 1 },
      { key: 'law', name: '의료관계법규 (1교시 76~95)', period: 1 },
      { key: 'crown_bridge', name: '관교 (2교시 1~19)', period: 2 },
      { key: 'porcelain', name: '도재기공학 (2교시 20~34)', period: 2 },
      { key: 'complete_denture', name: '총의치기공학 (2교시 35~58)', period: 2 },
      { key: 'partial_denture', name: '국소의치기공학 (2교시 59~82)', period: 2 },
      { key: 'restorative', name: '충전기공학 (2교시 83~96)', period: 2 },
      { key: 'orthodontics', name: '교정기공학 (2교시 97~110)', period: 2 }
    ];

    const STORAGE_KEY = "DENTAL_QUIZ_SINGLE_DEVICE_STATS";
    let deviceStats = {};

    let currentSubjectKey = "anatomy";
    let isWrongOnlyMode = false;
    let questions = [];
    let currentIndex = 0;
    let userAnswers = [];
    let isReviewMode = false;

    function loadStorage() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          deviceStats = JSON.parse(saved);
        } catch(e) {
          deviceStats = {};
        }
      }
    }

    function saveStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(deviceStats));
    }

    window.onload = function() {
      loadStorage();
      renderSubjectList();
    };

    function backupData() {
      const blob = new Blob([JSON.stringify(deviceStats, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `dental_quiz_record_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function restoreDataPrompt() {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = ".json";
      input.onchange = e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          try {
            const data = JSON.parse(ev.target.result);
            deviceStats = data;
            saveStorage();
            renderSubjectList();
            alert("학습 기록이 성공적으로 복원되었습니다!");
          } catch(err) {
            alert("올바른 백업 파일 형식이 아닙니다.");
          }
        };
        reader.readAsText(file);
      };
      input.click();
    }

    function resetAllData() {
      if (confirm("모든 풀이 횟수와 오답 기록을 초기화하시겠습니까?")) {
        deviceStats = {};
        saveStorage();
        renderSubjectList();
      }
    }

    function renderSubjectList() {
      const p1 = document.getElementById("group-period-1");
      const p2 = document.getElementById("group-period-2");
      p1.innerHTML = "";
      p2.innerHTML = "";

      subjectMeta.forEach(meta => {
        const targetContainer = meta.period === 1 ? p1 : p2;
        const qData = window.quizDatabase && window.quizDatabase[meta.key];
        const isReady = qData && qData.questions && qData.questions.length > 0;
        const totalCount = isReady ? qData.questions.length : 0;

        const stat = deviceStats[meta.key] || { attempts: 0, lastScore: "-", wrongIds: [] };
        const wrongCount = stat.wrongIds ? stat.wrongIds.length : 0;

        const row = document.createElement("div");
        row.className = "subject-row-card";

        row.innerHTML = `
          <div class="subj-info">
            <div class="subj-main-title">
              <span>🦷</span>
              <span>${meta.name}</span>
              <span class="badge">${isReady ? `${totalCount}문항` : '준비 중'}</span>
            </div>
            <div class="subj-user-stats">
              <span>풀이: <strong class="stat-highlight">${stat.attempts}회</strong></span>
              <span>최근 점수: <strong>${stat.lastScore}</strong></span>
              <span>누적 오답: <strong class="stat-wrong">${wrongCount}문제</strong></span>
            </div>
          </div>
          <div class="subj-btn-actions">
            ${isReady ? `
              <button type="button" class="play-btn primary" onclick="startSubject('${meta.key}', false)">전체 풀기</button>
              ${wrongCount > 0 ? `
                <button type="button" class="play-btn wrong-only" onclick="startSubject('${meta.key}', true)">누적 오답 풀기 (${wrongCount})</button>
              ` : ''}
            ` : `<span style="color:#64748b; font-size:0.85rem;">데이터 준비 중</span>`}
          </div>
        `;
        targetContainer.appendChild(row);
      });
    }

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // 키보드 단축키
    window.addEventListener("keydown", function(e) {
      const quizView = document.getElementById("quiz-view");
      if (!quizView || quizView.style.display !== "block") return;

      if (['Digit1', 'Numpad1'].includes(e.code)) {
        e.preventDefault();
        handleSelectChoice(1);
      } else if (['Digit2', 'Numpad2'].includes(e.code)) {
        e.preventDefault();
        handleSelectChoice(2);
      } else if (['Digit3', 'Numpad3'].includes(e.code)) {
        e.preventDefault();
        handleSelectChoice(3);
      } else if (['Digit4', 'Numpad4'].includes(e.code)) {
        e.preventDefault();
        handleSelectChoice(4);
      } else if (['Digit5', 'Numpad5'].includes(e.code)) {
        e.preventDefault();
        handleSelectChoice(5);
      } else if (e.code === 'ArrowRight') {
        e.preventDefault();
        skipOrNextQuestion();
      } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      }
    });

    // 퀴즈 시작 (문제 셔플 및 선택지 셔플 지원)
    function startSubject(subjectKey, wrongOnly = false) {
      const qData = window.quizDatabase && window.quizDatabase[subjectKey];
      if (!qData || !qData.questions) {
        alert("해당 과목의 데이터 파일을 불러오지 못했습니다.");
        return;
      }

      currentSubjectKey = subjectKey;
      isWrongOnlyMode = wrongOnly;
      let targetList = [];

      if (wrongOnly) {
        const wrongIds = (deviceStats[subjectKey] && deviceStats[subjectKey].wrongIds) || [];
        targetList = qData.questions.filter(q => wrongIds.includes(q.id));
        if (targetList.length === 0) {
          alert("누적된 오답이 없습니다!");
          return;
        }
      } else {
        targetList = [...qData.questions];
      }

      const shouldShuffleQ = document.getElementById("shuffle-q-toggle").checked;
      const shouldShuffleOpt = document.getElementById("shuffle-opt-toggle").checked;

      // 1. 문제 순서 결정
      let baseQuestions = shouldShuffleQ ? shuffleArray(targetList) : [...targetList];

      // 2. 각 문제의 선택지 셔플 및 매핑 객체 생성
      questions = baseQuestions.map(q => {
        if (!shouldShuffleOpt) {
          // 셔플 안 할 때
          return {
            ...q,
            displayOptions: q.options.map((optText, idx) => ({
              text: optText,
              originalIndex: idx + 1, // 1~5
              explanation: (q.optionExplanations && q.optionExplanations[idx + 1]) || ""
            })),
            isOptionShuffled: false
          };
        }

        // 선택지 셔플 수행
        let optObjects = q.options.map((optText, idx) => ({
          text: optText,
          originalIndex: idx + 1,
          explanation: (q.optionExplanations && q.optionExplanations[idx + 1]) || ""
        }));

        let shuffledOpts = shuffleArray(optObjects);

        return {
          ...q,
          displayOptions: shuffledOpts,
          isOptionShuffled: true
        };
      });

      currentIndex = 0;
      isReviewMode = false;
      userAnswers = questions.map(() => ({
        selectedDisplayIndex: null, // 사용자가 누른 현재 보기 번호 (1~5)
        isCorrect: null,
        isSkipped: false
      }));

      document.getElementById("selection-screen").style.display = "none";
      document.getElementById("result-view").style.display = "none";
      document.getElementById("quiz-view").style.display = "block";

      renderCurrentQuestion();
      window.scrollTo(0, 0);
    }

    function confirmExit() {
      if (isReviewMode) {
        document.getElementById("quiz-view").style.display = "none";
        document.getElementById("result-view").style.display = "block";
        window.scrollTo(0, 0);
        return;
      }
      if (confirm("퀴즈를 중단하고 과목 선택 화면으로 돌아가시겠습니까?")) {
        goHome();
      }
    }

    function goHome() {
      document.getElementById("quiz-view").style.display = "none";
      document.getElementById("result-view").style.display = "none";
      document.getElementById("selection-screen").style.display = "flex";
      renderSubjectList();
      window.scrollTo(0, 0);
    }

    function renderCurrentQuestion() {
      const container = document.getElementById("single-question-container");
      container.innerHTML = "";

      const item = questions[currentIndex];
      const answerState = userAnswers[currentIndex];
      const total = questions.length;

      document.getElementById("question-progress-text").textContent = `${currentIndex + 1} / ${total} ${isWrongOnlyMode ? '(누적 오답 풀이)' : ''}`;
      const percent = ((currentIndex + 1) / total) * 100;
      document.getElementById("progress-bar-fill").style.width = `${percent}%`;

      const prevBtn = document.getElementById("prev-btn");
      prevBtn.disabled = currentIndex === 0;

      const skipBtn = document.getElementById("skip-next-btn");
      if (answerState.selectedDisplayIndex !== null || isReviewMode) {
        skipBtn.textContent = currentIndex === total - 1 ? "결과 보기" : "다음 문제 →";
        skipBtn.className = "action-btn primary";
      } else {
        skipBtn.textContent = "건너뛰기 →";
        skipBtn.className = "action-btn";
      }

      const card = document.createElement("div");
      card.className = "quiz-card";

      let contextHtml = item.contextBox ? `<div class="q-context-box">${item.contextBox}</div>` : "";

      // 셔플된 displayOptions 기준으로 렌더링
      let optionsHtml = item.displayOptions.map((optObj, optIdx) => {
        const displayChoiceNum = optIdx + 1; // 1 ~ 5
        const isTargetCorrect = optObj.originalIndex === item.answer;

        return `
          <button type="button" class="option-card" id="btn-choice-${displayChoiceNum}" onclick="handleSelectChoice(${displayChoiceNum})">
            <div class="option-header">
              <div class="option-title-wrap">
                <span style="color: #94a3b8; font-weight: 700;">${labels[optIdx]}.</span>
                <span>${optObj.text}</span>
              </div>
              <span class="key-hint">${displayChoiceNum}</span>
            </div>
            <div class="option-inner-exp" id="exp-choice-${displayChoiceNum}">
              <div class="status-label ${isTargetCorrect ? 'correct' : 'wrong'}" id="label-choice-${displayChoiceNum}">
                ${isTargetCorrect ? '✓ 정답' : '✕ 오답'}
              </div>
              ${optObj.explanation ? `<div class="exp-content">${optObj.explanation}</div>` : ''}
            </div>
          </button>
        `;
      }).join("");

      const hasCommon = item.commonExplanations && item.commonExplanations.length > 0;
      let commonItemsHtml = hasCommon ? item.commonExplanations.map(exp => `
        <div class="common-item">${exp}</div>
      `).join("") : "";

      card.innerHTML = `
        <div class="q-title">
          <span class="q-number">${currentIndex + 1}.</span>${item.question}
        </div>
        ${contextHtml}
        <div class="options-list">
          ${optionsHtml}
        </div>
        ${hasCommon ? `
          <div class="common-feedback" id="current-common-feedback">
            <div class="common-title">공통 오답 해설 및 핵심 포인트:</div>
            ${commonItemsHtml}
          </div>
        ` : ""}
      `;

      container.appendChild(card);

      if (answerState.selectedDisplayIndex !== null) {
        showQuestionExplanations(answerState.selectedDisplayIndex, answerState.isCorrect);
      }
    }

    function handleSelectChoice(displayChoiceNum) {
      if (isReviewMode) return;
      const answerState = userAnswers[currentIndex];
      if (answerState.selectedDisplayIndex !== null) return;

      const item = questions[currentIndex];
      const selectedOptObj = item.displayOptions[displayChoiceNum - 1];
      const isCorrect = selectedOptObj.originalIndex === item.answer;

      answerState.selectedDisplayIndex = displayChoiceNum;
      answerState.isCorrect = isCorrect;
      answerState.isSkipped = false;

      showQuestionExplanations(displayChoiceNum, isCorrect);

      const skipBtn = document.getElementById("skip-next-btn");
      skipBtn.textContent = currentIndex === questions.length - 1 ? "결과 보기" : "다음 문제 →";
      skipBtn.className = "action-btn primary";
    }

    function showQuestionExplanations(selectedDisplayNum, isCorrect) {
      const item = questions[currentIndex];

      item.displayOptions.forEach((optObj, optIdx) => {
        const displayChoiceNum = optIdx + 1;
        const btn = document.getElementById(`btn-choice-${displayChoiceNum}`);
        const innerExp = document.getElementById(`exp-choice-${displayChoiceNum}`);
        const statusLabel = document.getElementById(`label-choice-${displayChoiceNum}`);

        if (btn) btn.disabled = true;
        if (innerExp) innerExp.style.display = "block";

        const isTargetCorrect = optObj.originalIndex === item.answer;

        if (displayChoiceNum === selectedDisplayNum) {
          if (isCorrect) {
            if (btn) btn.classList.add("user-correct");
            if (statusLabel) statusLabel.style.display = "flex";
          } else {
            if (btn) btn.classList.add("user-wrong");
            if (statusLabel) statusLabel.style.display = "flex";
          }
        } else if (isTargetCorrect) {
          if (btn) btn.classList.add("target-answer");
          if (statusLabel) statusLabel.style.display = "flex";
        } else {
          if (statusLabel) statusLabel.style.display = "none";
        }
      });

      const commonFeedback = document.getElementById("current-common-feedback");
      if (commonFeedback) commonFeedback.style.display = "block";
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        renderCurrentQuestion();
        window.scrollTo(0, 0);
      }
    }

    function skipOrNextQuestion() {
      const answerState = userAnswers[currentIndex];

      if (answerState.selectedDisplayIndex === null && !isReviewMode) {
        answerState.isSkipped = true;
      }

      if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderCurrentQuestion();
        window.scrollTo(0, 0);
      } else {
        finishAndSaveResults();
      }
    }

    function finishAndSaveResults() {
      const total = questions.length;
      let correctCount = 0;
      let wrongCount = 0;
      let skippedCount = 0;

      const currentWrongIds = [];
      const currentCorrectIds = [];

      userAnswers.forEach((ans, idx) => {
        const q = questions[idx];
        if (ans.isCorrect === true) {
          correctCount++;
          currentCorrectIds.push(q.id);
        } else {
          if (ans.isCorrect === false) wrongCount++;
          else skippedCount++;
          currentWrongIds.push(q.id);
        }
      });

      if (!deviceStats[currentSubjectKey]) {
        deviceStats[currentSubjectKey] = { attempts: 0, lastScore: "-", wrongIds: [] };
      }

      const subjStat = deviceStats[currentSubjectKey];
      subjStat.attempts = (subjStat.attempts || 0) + 1;
      subjStat.lastScore = `${correctCount}/${total}`;

      // 누적 오답 갱신 (맞힌 문제는 오답 서랍에서 자동 졸업)
      const existingWrongSet = new Set(subjStat.wrongIds || []);
      currentWrongIds.forEach(id => existingWrongSet.add(id));
      currentCorrectIds.forEach(id => existingWrongSet.delete(id));
      subjStat.wrongIds = Array.from(existingWrongSet);

      saveStorage();

      showResultSummary(correctCount, wrongCount, skippedCount, total);
    }

    function showResultSummary(correctCount, wrongCount, skippedCount, total) {
      document.getElementById("quiz-view").style.display = "none";
      document.getElementById("result-view").style.display = "block";
      window.scrollTo(0, 0);

      const missedListContainer = document.getElementById("missed-questions-list");
      missedListContainer.innerHTML = "";

      userAnswers.forEach((ans, idx) => {
        const q = questions[idx];
        if (ans.isCorrect !== true) {
          const card = document.createElement("div");
          card.className = ans.isCorrect === false ? "missed-question-card wrong-border" : "missed-question-card";

          // 현재 렌더링된 셔플 옵션에서 정답 객체 찾기
          const correctOptObj = q.displayOptions.find(o => o.originalIndex === q.answer);
          const correctLetter = labels[q.displayOptions.indexOf(correctOptObj)];

          let userChoiceText = "건너뜀";
          if (ans.selectedDisplayIndex !== null) {
            const userOptObj = q.displayOptions[ans.selectedDisplayIndex - 1];
            userChoiceText = `${labels[ans.selectedDisplayIndex - 1]}. ${userOptObj.text}`;
          }

          let commonHtml = "";
          if (q.commonExplanations && q.commonExplanations.length > 0) {
            commonHtml = `
              <div class="missed-common-box">
                <div class="missed-common-title">💡 핵심 연계 이론 & 포인트:</div>
                ${q.commonExplanations.map(c => `<div style="font-size:0.88rem; color:#cbd5e1; line-height:1.5;">• ${c}</div>`).join("")}
              </div>
            `;
          }

          card.innerHTML = `
            <div class="missed-header">${idx + 1}. ${q.question}</div>
            <div class="missed-details">
              <div><strong style="color:${ans.isCorrect === false ? '#f87171' : '#94a3b8'};">내 선택:</strong> ${userChoiceText}</div>
              <div style="margin-top:3px;"><strong style="color:#4ade80;">정답:</strong> ${correctLetter}. ${correctOptObj.text}</div>
            </div>
            ${commonHtml}
          `;
          missedListContainer.appendChild(card);
        }
      });

      const scorePercent = Math.round((correctCount / total) * 100);

      document.getElementById("score-headline-text").textContent = `${correctCount}/${total} (${scorePercent}%)`;
      document.getElementById("result-progress-fill").style.width = `${scorePercent}%`;

      document.getElementById("count-correct").textContent = correctCount;
      document.getElementById("count-wrong").textContent = wrongCount;
      document.getElementById("count-skipped").textContent = skippedCount;

      const missedSection = document.getElementById("missed-questions-section");
      const summaryTitle = document.getElementById("missed-summary-title");
      const retryWrongBtn = document.getElementById("retry-wrong-btn");

      if (wrongCount + skippedCount === 0) {
        missedSection.style.display = "none";
        retryWrongBtn.disabled = true;
        retryWrongBtn.style.opacity = "0.5";
      } else {
        missedSection.style.display = "block";
        retryWrongBtn.disabled = false;
        retryWrongBtn.style.opacity = "1";
        if (skippedCount > 0 && wrongCount === 0) {
          summaryTitle.textContent = `건너뛴 문제 및 핵심 포인트 (${skippedCount}개)`;
        } else if (wrongCount > 0 && skippedCount === 0) {
          summaryTitle.textContent = `틀린 문제 및 핵심 포인트 (${wrongCount}개)`;
        } else {
          summaryTitle.textContent = `오답 및 건너뛴 문제 핵심 포인트 (${wrongCount + skippedCount}개)`;
        }
      }
    }

    function retryWrongQuestionsOnly() {
      const wrongQuestions = [];
      userAnswers.forEach((ans, idx) => {
        if (ans.isCorrect === false || ans.isSkipped === true || ans.selectedDisplayIndex === null) {
          wrongQuestions.push(questions[idx]);
        }
      });

      if (wrongQuestions.length === 0) {
        alert("틀린 문제가 없습니다!");
        return;
      }

      isWrongOnlyMode = true;
      questions = [...wrongQuestions];
      currentIndex = 0;
      isReviewMode = false;
      userAnswers = questions.map(() => ({
        selectedDisplayIndex: null,
        isCorrect: null,
        isSkipped: false
      }));

      document.getElementById("result-view").style.display = "none";
      document.getElementById("quiz-view").style.display = "block";
      renderCurrentQuestion();
      window.scrollTo(0, 0);
    }

    function enterReviewMode() {
      isReviewMode = true;
      currentIndex = 0;
      document.getElementById("result-view").style.display = "none";
      document.getElementById("quiz-view").style.display = "block";
      renderCurrentQuestion();
      window.scrollTo(0, 0);
    }

    function retryEntireQuiz() {
      startSubject(currentSubjectKey, false);
    }
  </script>
</body>
</html>
