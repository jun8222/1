<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>치과기공사 국가시험 퀴즈</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./css/proto.css?v=202610302347">
  
  <style>

    :root {
      --bg-dark: #0a092d;
      --card-bg: #131436;
      --card-hover: #1e204d;
      --card-inner: #1a1a3a;
      --border-color: #2e3856;
      --text-main: #f6f7fb;
      --text-sub: #939bb4;
      --accent-blue: #4255ff;
      --accent-blue-hover: #2e40ea;
      --correct-green: #22c55e;
      --error-orange: #ff7842;
    }


    :root { color-scheme: dark; }
    :root[data-theme="light"] { color-scheme: only light; }
    :root[data-theme="light"] {
      --bg-dark: #ffffff;
      --card-bg: #f5f5f7;
      --card-hover: #e8e8eb;
      --card-inner: #f0f0f3;
      --border-color: #d5d5da;
      --text-main: #1a1a1a;
      --text-sub: #666666;
    }
    :root[data-theme="light"] .daily-card { background: linear-gradient(135deg, #e9ecff 0%, #f5f5f7 100%); }

    
    #auth-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 70vh;
      text-align: center;
    }

    .btn-start-badge {
      background-color: var(--accent-blue);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      transition: background-color 0.2s;
    }

    .btn-start-badge:hover {
      background-color: var(--accent-blue-hover);
    }

    .btn-action-sm {
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .btn-retry-wrong {
      background-color: rgba(255, 120, 66, 0.15);
      border-color: var(--error-orange);
      color: var(--error-orange);
    }

    .btn-retry-wrong:hover {
      background-color: var(--error-orange);
      color: #fff;
    }

    .btn-review-expl {
      background-color: var(--card-inner);
      border-color: var(--border-color);
      color: var(--text-main);
    }

    .btn-review-expl:hover {
      border-color: var(--accent-blue);
    }

    .report-issue-btn {
      background: none;
      border: none;
      color: #70799b;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .continue-btn {
      background-color: var(--accent-blue);
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
      justify-content: center;
      max-width: 200px;
    }

    
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .modal-box {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      width: 92%;
      max-width: 540px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .modal-close-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      background-color: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent-blue);
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.82rem;
    }

    .admin-table th, .admin-table td {
      border: 1px solid var(--border-color);
      padding: 8px;
      text-align: left;
    }

    .admin-table th {
      background-color: var(--card-inner);
      color: var(--text-sub);
    }

    
    #auth-view { min-height: 70vh; align-items: center; justify-content: center; text-align: center; }
    .auth-avatar { width: 72px; height: 72px; font-size: 2rem; margin-bottom: 18px; }
    .auth-card {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .auth-icon {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--accent-blue);
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }

    #auth-body {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .google-btn {
      width: 100%;
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 18px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .google-btn:hover { background: var(--card-hover); border-color: var(--accent-blue); }

    .auth-hint {
      color: var(--text-sub);
      font-size: 0.8rem;
      margin-top: 12px;
    }

    .auth-note {
      width: 100%;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px;
      font-size: 0.88rem;
      line-height: 1.6;
      color: var(--text-main);
    }

    .auth-note.is-error { border-color: var(--error-orange); color: var(--error-orange); }

    .sync-chip {
      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-sub);
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 4px 9px;
      border-radius: 14px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .sync-chip.is-error { color: var(--error-orange); border-color: rgba(255, 120, 66, 0.5); }

    .badge-dot {
      background-color: var(--error-orange);
      color: #fff;
      border-radius: 10px;
      padding: 0 6px;
      font-size: 0.7rem;
      line-height: 16px;
      min-width: 16px;
      text-align: center;
    }

    
    .daily-card {
      background: linear-gradient(135deg, #17195a 0%, #131436 100%);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 22px;
    }

    .daily-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .daily-title { font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .daily-title i { color: var(--accent-blue); }
    .daily-date { font-size: 0.75rem; color: var(--text-sub); font-weight: 500; margin-left: 4px; }
    .daily-head-btns { display: flex; gap: 2px; }

    .daily-progress-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .daily-count { font-size: 1.05rem; white-space: nowrap; }
    .daily-count b { font-size: 1.5rem; color: var(--text-main); }

    .daily-bar {
      flex: 1;
      height: 10px;
      background-color: var(--card-inner);
      border-radius: 6px;
      overflow: hidden;
    }

    .daily-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-blue), #22c55e);
      border-radius: 6px;
      transition: width 0.4s;
    }

    .daily-sub { font-size: 0.8rem; color: var(--text-sub); }
    .daily-actions { margin-top: 12px; display: flex; gap: 8px; align-items: center; }
    .daily-actions .btn-start-badge { padding: 9px 16px; font-size: 0.88rem; }

    .daily-history {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
    }

    
    .set-subject-box {
      max-height: 280px;
      overflow-y: auto;
      background-color: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
    }

    .set-period { font-size: 0.78rem; color: var(--text-sub); font-weight: 700; margin: 6px 0; }
    .set-period:first-child { margin-top: 0; }
    .set-subject-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

    @media (max-width: 520px) {
      .set-subject-grid { grid-template-columns: 1fr; }
    }

    .set-subject-item {
      display: flex !important;
      align-items: center;
      gap: 7px;
      font-size: 0.82rem !important;
      color: var(--text-main) !important;
      cursor: pointer;
      margin-bottom: 0 !important;
    }

    
    .report-item {
      background-color: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .report-item.is-resolved { opacity: 0.6; }
    .report-meta { font-size: 0.78rem; color: var(--text-sub); margin-bottom: 4px; }
    .report-q { font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; color: #93c5fd; white-space: pre-wrap; }
    .report-content { font-size: 0.88rem; color: var(--text-main); white-space: pre-wrap; }
    .report-actions { display: flex; gap: 6px; margin-top: 10px; }

    .status-pill {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 10px;
      margin-left: 4px;
      vertical-align: middle;
    }

    .status-pill.ok   { background: rgba(34, 197, 94, 0.15); color: var(--correct-green); }
    .status-pill.open { background: rgba(66, 85, 255, 0.18); color: #93a0ff; }
    .status-pill.bad  { background: rgba(255, 120, 66, 0.15); color: var(--error-orange); }

    
    /* ===== 내 기록 탭 ===== */
    @media (max-width: 480px) { .tab-bar { gap: 0; justify-content: space-between; } .tab-btn { padding: 12px 4px; font-size: 0.82rem; white-space: nowrap; flex: 1; } }
    .rec-card { background: var(--card-bg, var(--card-inner)); border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
    .rec-title { font-weight: 700; font-size: 1rem; margin-bottom: 10px; }
    .rec-sub { color: var(--text-sub); font-size: 0.8rem; font-weight: 400; }
    .rec-hero { display: flex; flex-direction: column; gap: 14px; }
    .rec-streak { display: flex; align-items: center; gap: 12px; }
    .rec-flame { font-size: 2.6rem; line-height: 1; filter: drop-shadow(0 0 10px rgba(255,140,0,.55)); }
    .rec-flame.off { filter: grayscale(1); opacity: .45; }
    .rec-big { font-size: 1.8rem; font-weight: 800; line-height: 1.1; }
    .rec-lv-name { font-weight: 700; margin-bottom: 6px; }
    .rec-bar { height: 10px; border-radius: 6px; background: var(--border-color); overflow: hidden; margin-bottom: 4px; }
    .rec-bar > div { height: 100%; background: linear-gradient(90deg, #4facfe, #7c6cff); border-radius: 6px; }
    .rec-cal { display: flex; gap: 3px; justify-content: center; overflow: hidden; }
    .rec-col { display: flex; flex-direction: column; gap: 3px; }
    .rec-cell { display: inline-block; width: 15px; height: 15px; border-radius: 3px; background: rgba(128, 140, 170, 0.2); }
    .rec-cell.lv1 { background: #9be9a8; } .rec-cell.lv2 { background: #40c463; } .rec-cell.lv3 { background: #30a14e; } .rec-cell.lv4 { background: #216e39; }
    .rec-cell.lv5, .rec-cell.lv6 { position: relative; overflow: hidden; }
    .rec-cell.lv5 { background: linear-gradient(135deg, #fff3b0, #f5c542 45%, #c8961e); }
    .rec-cell.lv6 { background: linear-gradient(90deg, #ff5f6d, #ffc371, #47e891, #3fa9f5, #a66cff, #ff5f6d); background-size: 300% 100%; animation: recFlow 3s linear infinite; }
    .rec-cell.lv5::after, .rec-cell.lv6::after { content: ''; position: absolute; inset: 0; background: linear-gradient(120deg, transparent 30%, rgba(255, 255, 255, .75) 50%, transparent 70%); transform: translateX(-120%); animation: recShine 2.4s infinite; }
    .rec-cell.lv6::after { animation-duration: 1.8s; background: linear-gradient(120deg, transparent 30%, rgba(255, 255, 255, .8) 50%, transparent 70%); }
    .rec-cell.lv7 { position: relative; overflow: hidden; background: radial-gradient(circle at 30% 30%, #7b5cff, #2a0f5c 60%, #0a0420); }
    .rec-cell.lv7::before, .rec-cell.lv7::after { content: ''; position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; box-shadow: 0 0 3px 1px #fff; animation: recTwinkle 1.4s ease-in-out infinite; }
    .rec-cell.lv7::before { top: 25%; left: 30%; }
    .rec-cell.lv7::after { top: 60%; left: 65%; animation-delay: .7s; }
    @keyframes recTwinkle { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
    @keyframes recShine { 60%, 100% { transform: translateX(120%); } }
    @keyframes recFlow { to { background-position: 300% 0; } }
    @media (prefers-reduced-motion: reduce) { .rec-cell.lv6, .rec-cell.lv5::after, .rec-cell.lv6::after, .rec-cell.lv7::before, .rec-cell.lv7::after { animation: none; } }
    .rec-cell.future { opacity: .45; }
    .rec-cell.lv0.future { opacity: .45; background: transparent; box-shadow: inset 0 0 0 1px rgba(128, 140, 170, 0.45); }
    .rec-cell.today { box-shadow: 0 0 0 2px #4f6bff; }
    .rec-cell.exam { opacity: 1 !important; background: #e5484d !important; box-shadow: none; font-size: 10px; line-height: 15px; text-align: center; overflow: hidden; }
    .rec-dday { color: #e5484d; font-weight: 700; }
    .note-source { margin-top: 12px; font-size: .88rem; }
    .note-source summary { cursor: pointer; color: var(--accent-blue); font-weight: 600; list-style: none; user-select: none; }
    .note-source summary::-webkit-details-marker { display: none; }
    .note-source summary::after { content: ' ▼'; font-size: .7em; }
    .note-source[open] summary::after { content: ' ▲'; }
    .note-source-text { margin-top: 8px; padding: 10px 12px; border-radius: 8px; background: rgba(79, 107, 255, 0.08); color: var(--text-main); line-height: 1.6; }
    .rec-reset { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border-color); text-align: right; }
    .rec-reset-btn { background: none; border: none; color: var(--text-sub); font-size: .75rem; cursor: pointer; padding: 4px 2px; opacity: .8; }
    .rec-reset-btn:hover { opacity: 1; text-decoration: underline; }
    .rec-reset-btn.armed { color: #fff; background: #e5484d; border-radius: 6px; padding: 5px 10px; opacity: 1; font-weight: 600; text-decoration: none; }
    .rec-reset-warn { display: none; font-size: .72rem; color: #e5484d; margin-bottom: 6px; }
    .rec-reset-warn.show { display: block; }
    .rec-legend { display: flex; align-items: center; gap: 4px; justify-content: flex-end; margin-top: 8px; font-size: 0.7rem; color: var(--text-sub); }
    .rec-legend .rec-cell { width: 11px; height: 11px; }
    .rec-radar { width: 100%; max-width: 340px; display: block; margin: 0 auto; }
    .rec-weak { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.85rem; margin-top: 8px; }
    .rec-weak b:first-child { width: 100%; }
    .rec-badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
    .rec-badge { text-align: center; padding: 10px 4px; border-radius: 12px; border: 1px solid var(--border-color); opacity: .5; }
    .rec-badge.got { opacity: 1; border-color: #f59e0b; background: rgba(245,158,11,.1); }
    .rec-badge .bi { font-size: 1.6rem; } .rec-badge .bn { font-size: 0.74rem; font-weight: 600; margin-top: 2px; } .rec-badge .bp { font-size: 0.66rem; color: var(--text-sub); }
    .rec-toggle { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; margin-bottom: 10px; }
    .rec-rank-row { display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
    .rec-rank-row.me { background: rgba(79,172,254,.12); border-radius: 8px; }
    .rec-rank-row .rk { width: 28px; text-align: center; font-weight: 700; }
    .rec-rank-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rec-feed { padding: 6px 0; font-size: 0.85rem; color: var(--text-main); border-bottom: 1px solid var(--border-color); }
    .rec-duel-new { margin-top: 12px; padding: 12px; border-radius: 12px; background: rgba(79,172,254,.1); }
    .rec-link { width: 100%; margin-top: 8px; padding: 8px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-inner); color: var(--text-main); font-size: 0.78rem; box-sizing: border-box; }
    .rec-duel-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--border-color); font-size: 0.85rem; color: var(--text-main); }
    /* ===== 랭킹: 캐릭터 레이스 ===== */
    .rec-awards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .rec-award { text-align: center; padding: 10px 4px; border-radius: 12px; border: 1px dashed var(--border-color); opacity: .65; }
    .rec-award.on { opacity: 1; border: 1px solid #f59e0b; background: rgba(245,158,11,.1); }
    .rec-award .ai { font-size: 1.5rem; } .rec-award .an { font-size: .74rem; font-weight: 700; }
    .rec-award .aw { font-size: .8rem; font-weight: 700; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rec-award .av { font-size: .68rem; color: var(--text-sub); }
    .rec-lane { padding: 10px 8px 8px; border-bottom: 1px solid var(--border-color); border-radius: 10px; }
    .rec-lane.me { background: rgba(79,172,254,.12); }
    .lane-head { display: flex; align-items: center; gap: 6px; font-size: .9rem; }
    .lane-head .rk { width: 26px; text-align: center; font-weight: 700; }
    .lane-head .nm { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lane-head .ttl { margin-left: auto; font-size: .7rem; color: var(--text-sub); white-space: nowrap; }
    .lane-chip { font-size: .85rem; }
    .lane-track { position: relative; height: 46px; margin: 6px 0 2px; border-radius: 20px;
      background: repeating-linear-gradient(90deg, transparent 0 14px, rgba(148,163,184,.25) 14px 16px), var(--card-inner); }
    .lane-run { position: absolute; top: 3px; left: calc((100% - 66px) * var(--f)); width: 34px; height: 40px;
      display: flex; align-items: center; justify-content: center; animation: laneRun .9s cubic-bezier(.2,.8,.3,1) both; }
    .lane-ch { font-size: 1.5rem; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
    .lane-run.lead::before { content: '👑'; position: absolute; top: -14px; font-size: .9rem; }
    .lane-flag { position: absolute; right: 8px; top: 12px; font-size: 1.05rem; opacity: .8; }
    @keyframes laneRun { from { left: 0; } }
    .lane-foot { display: flex; justify-content: space-between; align-items: center; font-size: .78rem; color: var(--text-sub); }
    .cheer-btn { border: 1px solid var(--border-color); background: transparent; color: var(--text-main); border-radius: 14px; padding: 4px 10px; font-size: .8rem; cursor: pointer; }
    .cheer-btn.on { background: rgba(245,158,11,.18); border-color: #f59e0b; }
    .rec-me { display: flex; align-items: center; gap: 12px; }
    .rec-me-ch { width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(180deg, rgba(79,172,254,.2), rgba(124,108,255,.2)); border: 2px solid var(--border-color); display: flex; align-items: center; justify-content: center; font-size: 2rem; overflow: hidden; flex-shrink: 0; }
    .rec-me-ch img { height: 100%; width: auto; max-width: 100%; image-rendering: pixelated; padding: 3px; box-sizing: border-box; }
    .avatar-panel { margin-top: 4px; }
    .avatar-tabs { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
    .avatar-tabs button { border: 1px solid var(--border-color); background: transparent; color: var(--text-main); border-radius: 16px; padding: 5px 12px; font-size: .8rem; cursor: pointer; }
    .avatar-tabs button.on { background: #4f6bff; border-color: #4f6bff; color: #fff; }

    .st-name { font-weight: 700; font-size: .86rem; }
    .st-meta { font-size: .7rem; color: var(--text-sub); }

    .st-bar > div { height: 100%; background: #4facfe; }
    .st-foot { display: flex; justify-content: space-between; font-size: .76rem; color: var(--text-sub); }
    .st-tag { font-size: .68rem; color: var(--text-sub); margin-top: 3px; }
    @media (max-width: 640px) { #subjectGrid { grid-template-columns: 1fr; } }
    .radar-legend { display: flex; gap: 14px; justify-content: center; font-size: .72rem; color: var(--text-sub); margin: 4px 0 -4px; }
    .radar-legend i { display: inline-block; width: 14px; border-top: 2px solid #4facfe; margin-right: 5px; vertical-align: 3px; }
    .radar-legend i.prv { border-top: 2px dashed #9aa3c0; }
    .rec-rounds { margin: 6px 0 10px; font-size: .82rem; }
    .rec-rounds > b { display: block; margin-bottom: 4px; }
    .rec-rounds .rr { display: flex; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--border-color); flex-wrap: wrap; }
    .rec-rounds .rr-n { font-weight: 600; min-width: 72px; }
    .rec-rounds .rr-v { color: var(--text-sub); }
    .rec-rounds em { font-style: normal; font-weight: 700; }
    .rec-rounds em.up { color: #22c55e; } .rec-rounds em.dn { color: #ef4444; }
    .round-badge { display: inline-block; vertical-align: middle; font-size: .68rem; font-weight: 700; border-radius: 10px; padding: 1px 7px; margin-left: 4px; white-space: nowrap; }
    .round-badge.r1 { color: #b8891a; background: rgba(245, 197, 66, .15); border: 1px solid #e0b030; }
    .round-badge.r2 { color: #7a5cff; background: rgba(169, 139, 255, .15); border: 1px solid #a98bff; }
    .round-badge.r3 { color: #e0457b; background: rgba(255, 120, 170, .15); border: 1px solid #ff78aa; }
    .round-prev { font-size: .68rem; color: var(--text-sub); margin-top: 4px; }
    .rank-seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: rgba(128, 140, 170, 0.15); border-radius: 10px; padding: 3px; margin: 8px 0 4px; }
    .rank-seg button { background: transparent; border: none; color: var(--text-sub); padding: 7px 0; border-radius: 8px; font-size: .85rem; cursor: pointer; }
    .rank-seg button.on { background: #4f6bff; color: #fff; font-weight: 600; }
    .rank-desc { text-align: center; font-size: .72rem; margin-bottom: 8px; }
    .rec-pod { display: flex; align-items: flex-end; justify-content: center; gap: 8px; margin-top: 26px; }
    .pod-slot { flex: 1; max-width: 110px; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .pod-slot.empty { opacity: .35; }
    .pod-ch { position: relative; height: 44px; display: flex; align-items: flex-end; margin-bottom: 4px; }
    .pod-ch .lane-img { height: 44px; }

    .pod-nm { font-size: .8rem; font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pod-slot.me .pod-nm { color: #6f86ff; }
    .pod-n { font-size: .7rem; color: var(--text-sub); margin-bottom: 6px; }
    .pod-blk { width: 100%; border-radius: 8px 8px 0 0; display: flex; justify-content: center; padding-top: 6px; font-size: 1.2rem; font-weight: 700; transform-origin: bottom; animation: podUp .7s cubic-bezier(.2,.9,.3,1.2) both; }
    .pod-blk.p1 { height: 84px; background: linear-gradient(#f5c542, #b8891a); color: #4a3500; }
    .pod-blk.p2 { height: 62px; background: linear-gradient(#cfd6e4, #8a94a8); color: #2c3240; }
    .pod-blk.p3 { height: 46px; background: linear-gradient(#e0a070, #9c5a2c); color: #3d1f08; }
    .pod-base { height: 4px; background: var(--border-color); border-radius: 2px; margin: 0 6px 12px; }
    .rec-sec { font-size: .75rem; color: var(--text-sub); margin: 4px 2px 6px; }
    @keyframes podUp { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { .pod-blk { animation: none; } }
    .lane-img { height: 40px; width: auto; image-rendering: pixelated; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
    .cheer-got { font-size: .8rem; }
    .rec-board { padding-left: 4px; }
    .rec-duel-btns { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; max-width: 55%; }
    .admin-cards { display: none; }
    @media (max-width: 700px) {
      #admin-modal .modal-box { max-width: 100% !important; width: calc(100% - 16px); padding: 16px 12px; }

      .admin-cards { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
      .admin-card { border: 1px solid var(--border-color); background: var(--card-inner); border-radius: 12px; padding: 12px; }
      .admin-card.pending { border-color: #f59e0b; box-shadow: 0 0 0 1px #f59e0b inset; }
      .ac-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .ac-name { font-size: 1rem; min-width: 0; }
      .ac-me { color: var(--text-sub); font-size: 0.8rem; }
      .ac-email { color: var(--text-sub); font-size: 0.78rem; margin-top: 2px; word-break: break-all; }
      .ac-stat { font-size: 0.85rem; margin-top: 8px; }
      .ac-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
      .ac-btns .btn-action-sm { min-height: 36px; padding: 6px 12px; font-size: 0.85rem; }
    }
    .admin-table-wrap { overflow-x: auto; }
    .admin-table td { vertical-align: middle; }
    .admin-btn-col { display: flex; flex-wrap: wrap; gap: 4px; }

    
    .context-box {
      margin-top: 12px;
      padding: 12px 14px;
      background-color: var(--card-inner);
      border: 1px solid var(--border-color);
      border-left: 3px solid var(--accent-blue);

      white-space: pre-wrap;
      word-break: keep-all;
    }

    .toast-box {
      position: fixed;
      left: 50%;
      bottom: 90px;

      padding: 10px 16px;
      border-radius: 10px;

      z-index: 2000;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
    }

    /* 이력 패널 */
    .card-more-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1rem;
      padding: 6px 8px;
      cursor: pointer;
      border-radius: 6px;
    }
    .history-dropdown-panel {
      display: none;
      background-color: #0d0e2e;

      flex-shrink: 0;
    }
    /* [보기] 박스: ㄱ·ㄴ 2칸, 하나라도 길면 전체 1칸 */
    .ctx-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 16px; white-space: normal; }
    .ctx-grid.one { grid-template-columns: minmax(0, 1fr); }
    .ctx-grid.nowrap .ctx-item { white-space: nowrap; overflow: hidden; }

    .ctx-head { grid-column: 1 / -1; }
    .mobile-controls-sticky { transition: transform .25s ease; }
    @media (max-width: 768px) {
      .wrong-item-header { flex-direction: column-reverse; align-items: stretch; gap: 8px; }

    .option-btn.correct-highlight .option-idx { background-color: var(--correct-green); color: #fff; }
    /* ---- 프로토타입 위에 얹는 추가 요소 ---- */

      border: 1px solid var(--border-color); border-radius: 12px; padding: 6px; z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
    .user-menu button { display: flex; width: 100%; align-items: center; gap: 8px; text-align: left; background: none; border: none;

      border-radius: 8px; padding: 7px 10px; font-size: 0.85rem; width: 130px; font-family: inherit; }

      font-size: 0.8rem; cursor: pointer; font-family: inherit; }

<body>
  <!-- 헤더 -->
  <div class="top-header">
    <div class="header-left">
      <div class="brand-title" onclick="goHome()">🦷 치과기공사 퀴즈</div>
    </div>
    <div class="header-right">
      <span class="sync-chip" id="sync-chip" style="display:none;"></span>
      <button class="header-btn" onclick="toggleTheme()" title="테마 전환"><span id="themeIcon">🌙</span></button>
      <span id="header-user-controls">
        <button class="header-btn" id="wrongNoteBtn" onclick="openNotesTab()" title="오답노트">🔖</button>
        <div class="user-menu-wrap">
          <button class="user-badge" id="user-badge" onclick="toggleUserMenu(event)"><span class="nm" id="current-username"></span> ▾</button>
          <div class="user-menu" id="user-menu">
            <button onclick="closeUserMenu(); openSettingsModal()">⚙️ 내 설정</button>
            <button onclick="closeUserMenu(); openReportListModal()">📋 오류 검토</button>
            <button id="admin-btn" style="display:none;" onclick="closeUserMenu(); openAdminModal()">👥 회원 관리 <span class="menu-badge" id="admin-pending-badge" style="display:none;"></span></button>
            <button class="danger" onclick="closeUserMenu(); logout()">↩ 로그아웃</button>
          </div>
        </div>
      </span>
    </div>
  </div>

  <!-- 메인 컨테이너 -->
  <div class="main-container">

    <!-- [화면 0] 로그인 / 승인 대기 화면 -->
    <div id="auth-view">
      <div class="auth-card">
        <div class="user-avatar auth-avatar">🦷</div>
        <div class="user-select-title">학습을 시작해보세요</div>
        <div class="user-select-sub" id="auth-sub"></div>
        <div id="auth-body"><div class="auth-hint"><i class="fa-solid fa-rotate fa-spin"></i> 불러오는 중...</div></div>
      </div>
    </div>

    <!-- ===== 과목 선택 ===== -->
    <div id="subject-view">

      <div class="daily-card" id="daily-card"></div>

      <div class="tab-bar">
        <button class="tab-btn active" id="tabbtn-study" onclick="switchTab('study')">📚 학습</button>
        <button class="tab-btn" id="tabbtn-notes" onclick="switchTab('notes')">📝 오답노트<span class="tab-count" id="wrong-count" style="display:none;"></span></button>
        <button class="tab-btn" id="tabbtn-completed" onclick="switchTab('completed')">✓ 복습완료</button>
        <button class="tab-btn" id="tabbtn-records" onclick="switchTab('records')">🏆 기록</button>
      </div>

      <div id="study-tab" class="tab-content active">
        <div class="sub-filter-row">
          <select class="select-dropdown" id="period-filter" onchange="filterSubjects()">
            <option value="all">전체 교시</option>
            <option value="1">1교시</option>
            <option value="2">2교시</option>
          </select>
          <label title="문제 출제 순서를 무작위로 섞습니다"><input type="checkbox" id="toggle-shuffle-questions"> 문제 섞기</label>
          <label title="1~5번 선택지 순서를 무작위로 섞습니다"><input type="checkbox" id="toggle-shuffle-options"> 선택지 섞기</label>
          <input type="text" id="subject-search" placeholder="과목 검색" oninput="filterSubjects()">
        </div>
        <div class="subject-grid" id="subjectGrid"></div>
      </div>

      <div id="notes-tab" class="tab-content">
        <div class="mobile-controls-sticky">
          <select class="select-dropdown" id="wrong-filter" onchange="renderNotes()"></select>
          <select class="select-dropdown" id="wrong-sort" onchange="renderNotes()">
            <option value="recent">최근 순</option>
            <option value="most">많이 틀린 순</option>
            <option value="random">랜덤</option>
          </select>
          <select class="select-dropdown" id="wrong-count-sel">
            <option value="5">5개</option><option value="10">10개</option><option value="all">전체</option>
          </select>
          <button class="btn-result btn-review" style="cursor: pointer; padding: 8px 16px; font-size: 0.85rem; white-space: nowrap;" onclick="startWrongFromNote()">풀기</button>
          <button class="btn-result" style="cursor: pointer; padding: 8px 16px; font-size: 0.85rem; background-color: #4facfe; border-color: #4facfe; white-space: nowrap;" onclick="copyWrongForAnalysis()">📋 복사</button>
        </div>
        <div id="notesContent"></div>
      </div>

      <div id="completed-tab" class="tab-content">
        <div id="completedContent"></div>
      </div>

      <div id="records-tab" class="tab-content">
        <div id="recordsContent"></div>
      </div>
    </div>

    <!-- ===== 퀴즈 풀이 ===== -->
    <div id="quiz-view">
      <div class="quiz-card">
        <div style="text-align:right; margin-bottom:6px;"><button type="button" class="note-del-btn" id="quit-btn" onclick="quitQuiz()">✕ 그만두기</button></div>
        <div class="question-header">
          <div class="question-num" id="questionNum"></div>
          <div class="question-progress" id="questionProgress"></div>
          <div class="question-flags" id="flagsContainer"></div>
        </div>
        <div class="quiz-sub" id="quizSub"></div>

        <div class="question-text" id="questionText"></div>
        <div class="context-box" id="quiz-context-box" style="display:none;"></div>
        <div class="options-container" id="optionsContainer"></div>

        <div class="quiz-tools">
          <button class="tool-link" id="reportBtn" onclick="openReportModal()" title="오류 검토 요청">🚩</button>
          <button class="tool-link" id="dont-know-btn" onclick="handleDontKnow()">모르시겠어요?</button>
        </div>

        <div class="explanation-auto" id="explanationAuto">
          <div class="explanation-box" id="commonBox">
            <div class="explanation-label">💡 해설</div>
            <div class="explanation-text" id="commonText"></div>
          </div>
          <div class="tip-box" id="tipBox">
            <div class="tip-label">🎯 팁</div>
            <div id="tipText"></div>
          </div>
        </div>

        <div class="source-toggle" id="sourceToggle">
          <button class="source-button" onclick="toggleSource()">
            <span id="sourceIcon">▼</span> 근거 보기
          </button>
          <div class="source-box" id="sourceBox">
            <div class="source-label">📚 근거</div>
            <div class="source-text" id="sourceText"></div>
          </div>
        </div>

        <div class="quiz-nav">
          <button class="btn" id="prevBtn" onclick="prevQuestion()">← 이전</button>
          <button class="btn" id="finishBtn" onclick="finishQuizSession()" style="display:none;">완료</button>
          <button class="btn" id="nextBtn" onclick="nextQuestion()">다음 →</button>
        </div>
      </div>
    </div>

    <!-- ===== 결과 ===== -->
    <div id="quiz-result-view">
      <div class="result-container">
        <div class="result-title">풀이 완료!</div>
        <div class="result-extra" id="result-extra"></div>

        <div class="result-score">
          <div class="score-circle">
            <div class="score-inner">
              <div class="score-percent" id="resultPercent">0%</div>
              <div class="score-label">정답률</div>
            </div>
          </div>
        </div>

        <div class="result-stats">
          <div class="stat-item"><div class="stat-value" id="resultTotal">0</div><div class="stat-label">총 문항</div></div>
          <div class="stat-item"><div class="stat-value" id="resultCorrect">0</div><div class="stat-label">정답</div></div>
          <div class="stat-item"><div class="stat-value" id="resultWrong">0</div><div class="stat-label">오답</div></div>
        </div>

        <div class="subject-breakdown">
          <div class="breakdown-title">📊 과목별 정답률</div>
          <div id="breakdownItems"></div>
        </div>

        <div class="result-buttons">
          <button class="btn-result" id="result-continue-daily-btn" style="display:none;" onclick="continueDailyFromResult()">오늘의 문제 이어서</button>
          <button class="btn-result btn-review" onclick="openNotesTab()">🔍 오답 검토</button>
          <button class="btn-result" id="result-retry-wrong-btn" style="display:none;" onclick="retryWrongQuestions()">오답 다시 풀기</button>
          <button class="btn-result" onclick="goHome()">과목 선택</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 퀴즈 시작 선택 모달 -->
  <div class="modal-overlay" id="resume-modal">
    <div style="background-color: var(--card-bg); border-radius: 16px; padding: 32px; max-width: 320px; width: 90%; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.2);">
      <div id="resume-title" style="font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; color: var(--text-main);"></div>
      <div id="resume-info" style="font-size: 0.9rem; color: var(--text-sub); margin-bottom: 24px;"></div>
      <div class="modal-btn-col" style="display:flex; gap:12px; flex-direction:column;">
        <button id="resume-continue-btn" class="btn" style="background-color: #4facfe; border-color: #4facfe; cursor: pointer;">📖 이어서 풀기</button>
        <button id="resume-restart-btn" class="btn" style="background-color: var(--card-inner); border-color: var(--border-color); cursor: pointer; color: var(--text-main);">🔄 처음부터 풀기</button>
        <button class="btn" style="background-color: var(--card-inner); border-color: var(--border-color); cursor: pointer; color: var(--text-main);" onclick="closeModal('resume-modal')">✕ 취소</button>
      </div>
    </div>
  </div>

  <!-- [모달 1] 오류 검토 요청 모달 -->
  <div class="modal-overlay" id="report-modal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title">오류 검토 요청</div>
        <button class="modal-close-btn" onclick="closeModal('report-modal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="form-group">
        <label>해당 문제</label>
        <textarea class="form-control" id="report-question-preview" rows="2" readonly></textarea>
      </div>
      <div class="form-group">
        <label>오류 내용 및 수정 건의</label>
        <textarea class="form-control" id="report-content" rows="4" placeholder="오탈자, 정답 오류, 해설 이상 내용 등을 적어주세요."></textarea>
      </div>
      <button class="continue-btn" style="width:100%; max-width:none;" onclick="submitReport()">검토 요청 보내기</button>
    </div>
  </div>

  <!-- [모달 2] 내 설정 모달 -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal-box" style="max-width:560px;">
      <div class="modal-header">
        <div class="modal-title"><i class="fa-solid fa-sliders"></i> 내 설정</div>
        <button class="modal-close-btn" onclick="closeModal('settings-modal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="form-group">
        <label>이름</label>
        <input type="text" class="form-control" id="set-name" maxlength="20">
      </div>
      <div class="form-group">
        <label>하루 목표 문항 수 (5~200)</label>
        <input type="number" class="form-control" id="set-goal" min="5" max="200" step="1">
      </div>
      <div class="form-group">
        <label>오늘의 문제에 포함할 과목</label>
        <label class="set-subject-item" style="margin-bottom:8px;">
          <input type="checkbox" id="set-all-subjects" onchange="toggleAllSubjects(this.checked)"> <span><b>전체 선택/해제</b></span>
        </label>
        <div id="set-subject-list" class="set-subject-box"></div>
      </div>
      <button class="continue-btn" style="width:100%; max-width:none;" onclick="saveSettings()">저장하기</button>
    </div>
  </div>

  <!-- [모달 3] 오류 검토 리스트 모달 -->
  <div class="modal-overlay" id="report-list-modal">
    <div class="modal-box" style="max-width:680px;">
      <div class="modal-header">
        <div class="modal-title" id="report-modal-title">접수된 오류 검토 리스트</div>
        <button class="modal-close-btn" onclick="closeModal('report-list-modal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="report-list-container"></div>
    </div>
  </div>

  <!-- [모달 4] 회원 관리 모달 (admin 전용) -->
  <div class="modal-overlay" id="admin-modal">
    <div class="modal-box" style="max-width:820px;">
      <div class="modal-header">
        <div class="modal-title"><i class="fa-solid fa-users-gear"></i> 회원 관리 (관리자)</div>
        <button class="modal-close-btn" onclick="closeModal('admin-modal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="admin-user-list"></div>
    </div>
  </div>

  <!-- [모달 5] 오답 문제 해설 확인 모달 (전체 해설에서 오답 해설로 변경) -->
  <div class="modal-overlay" id="explanation-modal">
    <div class="modal-box" style="max-width:750px;">
      <div class="modal-header">
        <div class="modal-title" id="expl-modal-title">오답 문제 해설</div>
        <button class="modal-close-btn" onclick="closeModal('explanation-modal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="expl-modal-content"></div>
    </div>
  </div>

  <div class="toast-box" id="toast-box" style="display:none;"></div>
