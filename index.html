<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>치과기공사 국가시험 퀴즈</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #0a092d;
      --card-bg: #131436;
      --card-hover: #1e204d;
      --card-inner: #1a1a3a;
      --border-color: #2e3856;
      --text-main: #f6f7fb;
      --text-sub: #939bb4;
      --accent-blue: #4255ff;
      --accent-blue-hover: #2e40ea;
      --correct-green: #22c55e;
      --error-orange: #ff7842;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 상단 네비게이션 헤더 */
    .top-header {
      width: 100%;
      height: 60px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-dark);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      white-space: nowrap;
    }

    .brand-title i {
      color: var(--accent-blue);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      max-width: 70%;
      padding-bottom: 2px;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .header-right::-webkit-scrollbar {
      display: none;
    }

    .user-profile-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 5px 10px;
      border-radius: 16px;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .header-btn {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .header-btn:hover {
      background-color: var(--card-hover);
      border-color: var(--accent-blue);
    }

    .header-btn-logout {
      border-color: rgba(255, 120, 66, 0.4);
      color: var(--error-orange);
    }

    .header-btn-logout:hover {
      background-color: rgba(255, 120, 66, 0.15);
      border-color: var(--error-orange);
    }

    .header-icon-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1.1rem;
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* 메인 컨테이너 */
    .main-container {
      flex: 1;
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 16px 80px;
    }

    /* [화면 0] 로그인 화면 */
    #auth-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 70vh;
      text-align: center;
    }

    .user-select-title {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .user-select-sub {
      color: var(--text-sub);
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    .user-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 760px;
      margin-bottom: 24px;
    }

    @media (max-width: 600px) {
      .user-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .user-card-btn {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 20px 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: all 0.2s;
    }

    .user-avatar-circle {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background-color: var(--card-inner);
      border: 2px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: var(--accent-blue);
    }

    .user-name-text {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .user-role-text {
      font-size: 0.72rem;
      color: var(--text-sub);
      background-color: rgba(255, 255, 255, 0.05);
      padding: 2px 8px;
      border-radius: 10px;
    }

    /* [화면 1] 메인 과목 목록 화면 */
    #subject-view {
      display: none;
    }

    .filter-bar {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 20px;
    }

    @media (min-width: 680px) {
      .filter-bar {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .filter-bar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .select-dropdown {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    .shuffle-toggle-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .shuffle-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
    }

    .shuffle-label input[type="checkbox"] {
      accent-color: var(--accent-blue);
      width: 15px;
      height: 15px;
    }

    .search-input-box {
      position: relative;
      width: 100%;
    }

    @media (min-width: 680px) {
      .search-input-box {
        width: 250px;
      }
    }

    .search-input-box input {
      width: 100%;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 36px 8px 14px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
    }

    .search-input-box i {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
    }

    .period-section-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 24px 0 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .subject-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .subject-card-wrapper {
      display: flex;
      flex-direction: column;
      border-radius: 12px;
    }

    .subject-card {
      padding: 12px 14px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      transition: all 0.2s;
      gap: 8px;
    }

    .subject-card:hover {
      background-color: var(--card-hover);
    }

    .subject-card-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .card-icon-box {
      width: 38px;
      height: 38px;
      background-color: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #3b82f6;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .subject-title-area {
      min-width: 0;
    }

    .subject-info-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .subject-info-sub {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    .subject-card-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-start-badge {
      background-color: var(--accent-blue);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      transition: background-color 0.2s;
    }

    .btn-start-badge:hover {
      background-color: var(--accent-blue-hover);
    }

    .recent-wrong-badge {
      background-color: rgba(255, 120, 66, 0.15);
      border: 1px solid rgba(255, 120, 66, 0.4);
      color: var(--error-orange);
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.72rem;
      font-weight: 600;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .card-more-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1rem;
      padding: 6px 8px;
      cursor: pointer;
      border-radius: 6px;
    }

    /* 회차 이력 아코디언 드롭다운 패널 */
    .history-dropdown-panel {
      display: none;
      background-color: #0d0e2e;
      border: 1px solid var(--border-color);
      border-top: none;
      border-radius: 0 0 12px 12px;
      padding: 12px;
      margin-top: -2px;
      flex-direction: column;
      gap: 8px;
    }

    .history-card-item {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .history-meta-text {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-bottom: 2px;
    }

    .history-action-btns {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-action-sm {
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .btn-retry-wrong {
      background-color: rgba(255, 120, 66, 0.15);
      border-color: var(--error-orange);
      color: var(--error-orange);
    }

    .btn-retry-wrong:hover {
      background-color: var(--error-orange);
      color: #fff;
    }

    .btn-review-expl {
      background-color: var(--card-inner);
      border-color: var(--border-color);
      color: var(--text-main);
    }

    .btn-review-expl:hover {
      border-color: var(--accent-blue);
    }

    /* =========================================================
       [화면 2] 문제 풀이 화면
       ========================================================= */
    #quiz-view {
      display: none;
    }

    .progress-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .progress-count-badge {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .badge-correct {
      background-color: var(--correct-green);
      color: #fff;
    }

    .badge-total {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-sub);
    }

    .segmented-progress-bar {
      flex: 1;
      height: 8px;
      background-color: var(--card-bg);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      gap: 2px;
      padding: 1px;
    }

    .progress-segment {
      flex: 1;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.08);
      border-radius: 1px;
    }

    .progress-segment.passed {
      background-color: var(--correct-green);
    }

    .progress-segment.failed {
      background-color: var(--error-orange);
    }

    .quiz-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px 18px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
    }

    @media (min-width: 680px) {
      .quiz-card {
        padding: 36px 40px;
      }
    }

    .quiz-card-header {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-sub);
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .quiz-question-title {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.55;
      color: var(--text-main);
      margin-bottom: 16px;
    }

    .status-msg-banner {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: none;
    }

    .status-msg-banner.correct {
      color: var(--correct-green);
      display: block;
    }

    .status-msg-banner.wrong {
      color: var(--error-orange);
      display: block;
    }

    /* 선택지 레이아웃 (PC: 2열 / 모바일: 무조건 1행 1선택지) */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    @media (min-width: 680px) {
      .options-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .option-btn:nth-child(5) {
        grid-column: span 2;
      }
    }

    .option-btn {
      background-color: transparent;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      color: var(--text-main);
      font-size: 0.92rem;
      text-align: left;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
      width: 100%;
    }

    .option-btn:hover:not(.disabled) {
      background-color: var(--card-inner);
      border-color: var(--accent-blue);
    }

    .option-top-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.4;
    }

    .option-idx {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-sub);
      min-width: 18px;
    }

    .option-explanation-inline {
      display: none;
      font-size: 0.8rem;
      color: #cbd5e1;
      padding-top: 8px;
      margin-top: 4px;
      border-top: 1px dashed rgba(255, 255, 255, 0.15);
      line-height: 1.45;
    }

    .option-btn.correct-choice {
      border: 2px solid var(--correct-green) !important;
      background-color: rgba(34, 197, 94, 0.08) !important;
    }

    .option-btn.correct-highlight {
      border: 2px dashed var(--correct-green) !important;
      background-color: rgba(34, 197, 94, 0.05) !important;
    }

    .option-btn.wrong-choice {
      border: 2px solid var(--error-orange) !important;
      background-color: rgba(255, 120, 66, 0.08) !important;
    }

    .option-btn.disabled {
      cursor: default;
    }

    .common-explanation-box {
      display: none;
      background-color: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px;
      margin-top: 14px;
      margin-bottom: 16px;
    }

    .expl-header {
      font-size: 0.85rem;
      font-weight: 700;
      color: #60a5fa;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .expl-body-text {
      font-size: 0.85rem;
      line-height: 1.5;
      color: #e2e8f0;
    }

    .quiz-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .report-issue-btn {
      background: none;
      border: none;
      color: #70799b;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dont-know-btn {
      background-color: var(--card-inner);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* 하단 피드백 액션바 */
    .bottom-feedback-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      min-height: 64px;
      background-color: #0d0f2b;
      border-top: 1px solid var(--border-color);
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      z-index: 100;
      gap: 8px;
    }

    .feedback-hint-text {
      color: var(--text-sub);
      font-size: 0.8rem;
      display: none;
    }

    @media (min-width: 680px) {
      .feedback-hint-text {
        display: block;
      }
      .bottom-feedback-bar {
        padding: 0 40px;
        height: 72px;
      }
    }

    .nav-btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      justify-content: flex-end;
    }

    @media (min-width: 680px) {
      .nav-btn-group {
        width: auto;
      }
    }

    .prev-nav-btn {
      background-color: var(--card-inner);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .prev-nav-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .continue-btn {
      background-color: var(--accent-blue);
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
      justify-content: center;
      max-width: 200px;
    }

    /* [화면 3] 학습 완료 화면 */
    #quiz-result-view {
      display: none;
      flex-direction: column;
      gap: 20px;
    }

    .result-summary-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 32px 16px;
      text-align: center;
    }

    .result-summary-icon {
      font-size: 2.5rem;
      color: var(--correct-green);
      margin-bottom: 12px;
    }

    .result-summary-title {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .result-summary-stats {
      color: var(--text-sub);
      font-size: 0.95rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .result-btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .wrong-review-section {
      margin-top: 4px;
    }

    .wrong-review-header {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .wrong-item-box {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .wrong-item-qtitle {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .wrong-item-optlist {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 10px;
    }

    .wrong-item-optline {
      font-size: 0.85rem;
      color: var(--text-sub);
      padding: 5px 8px;
      border-radius: 6px;
    }

    .wrong-item-optline.is-answer {
      background-color: rgba(34, 197, 94, 0.12);
      color: #4ade80;
      font-weight: 600;
    }

    .wrong-item-expl {
      background-color: var(--card-inner);
      border-left: 3px solid #60a5fa;
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 0.8rem;
      color: #cbd5e1;
      line-height: 1.45;
    }

    /* 모달 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .modal-box {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      width: 92%;
      max-width: 540px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .modal-close-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      background-color: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent-blue);
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.82rem;
    }

    .admin-table th, .admin-table td {
      border: 1px solid var(--border-color);
      padding: 8px;
      text-align: left;
    }

    .admin-table th {
      background-color: var(--card-inner);
      color: var(--text-sub);
    }

    /* =========================================================
       v2: 로그인 / 오늘의 문제 / 설정 / 관리자
       ========================================================= */
    .auth-card {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .auth-icon {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--accent-blue);
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }

    #auth-body {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .google-btn {
      width: 100%;
      background: #fff;
      color: #1f1f1f;
      border: none;
      border-radius: 10px;
      padding: 13px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .google-btn:hover { background: #e9ecf5; }

    .auth-hint {
      color: var(--text-sub);
      font-size: 0.8rem;
      margin-top: 12px;
    }

    .auth-note {
      width: 100%;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px;
      font-size: 0.88rem;
      line-height: 1.6;
      color: var(--text-main);
    }

    .auth-note.is-error { border-color: var(--error-orange); color: var(--error-orange); }

    .sync-chip {
      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-sub);
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 4px 9px;
      border-radius: 14px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .sync-chip.is-error { color: var(--error-orange); border-color: rgba(255, 120, 66, 0.5); }

    .badge-dot {
      background-color: var(--error-orange);
      color: #fff;
      border-radius: 10px;
      padding: 0 6px;
      font-size: 0.7rem;
      line-height: 16px;
      min-width: 16px;
      text-align: center;
    }

    /* 오늘의 문제 카드 */
    .daily-card {
      background: linear-gradient(135deg, #17195a 0%, #131436 100%);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 22px;
    }

    .daily-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .daily-title { font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .daily-title i { color: var(--accent-blue); }
    .daily-date { font-size: 0.75rem; color: var(--text-sub); font-weight: 500; margin-left: 4px; }
    .daily-head-btns { display: flex; gap: 2px; }

    .daily-progress-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .daily-count { font-size: 1.05rem; white-space: nowrap; }
    .daily-count b { font-size: 1.5rem; color: var(--text-main); }

    .daily-bar {
      flex: 1;
      height: 10px;
      background-color: var(--card-inner);
      border-radius: 6px;
      overflow: hidden;
    }

    .daily-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-blue), #22c55e);
      border-radius: 6px;
      transition: width 0.4s;
    }

    .daily-sub { font-size: 0.8rem; color: var(--text-sub); }
    .daily-actions { margin-top: 12px; display: flex; gap: 8px; align-items: center; }
    .daily-actions .btn-start-badge { padding: 9px 16px; font-size: 0.88rem; }

    .daily-history {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
    }

    /* 내 설정 */
    .set-subject-box {
      max-height: 280px;
      overflow-y: auto;
      background-color: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
    }

    .set-period { font-size: 0.78rem; color: var(--text-sub); font-weight: 700; margin: 6px 0; }
    .set-period:first-child { margin-top: 0; }
    .set-subject-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

    @media (max-width: 520px) {
      .set-subject-grid { grid-template-columns: 1fr; }
    }

    .set-subject-item {
      display: flex !important;
      align-items: center;
      gap: 7px;
      font-size: 0.82rem !important;
      color: var(--text-main) !important;
      cursor: pointer;
      margin-bottom: 0 !important;
    }

    /* 오류 신고 목록 */
    .report-item {
      background-color: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .report-item.is-resolved { opacity: 0.6; }
    .report-meta { font-size: 0.78rem; color: var(--text-sub); margin-bottom: 4px; }
    .report-q { font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; color: #93c5fd; white-space: pre-wrap; }
    .report-content { font-size: 0.88rem; color: var(--text-main); white-space: pre-wrap; }
    .report-actions { display: flex; gap: 6px; margin-top: 10px; }

    .status-pill {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 10px;
      margin-left: 4px;
      vertical-align: middle;
    }

    .status-pill.ok   { background: rgba(34, 197, 94, 0.15); color: var(--correct-green); }
    .status-pill.open { background: rgba(66, 85, 255, 0.18); color: #93a0ff; }
    .status-pill.bad  { background: rgba(255, 120, 66, 0.15); color: var(--error-orange); }

    /* 회원 관리 */
    .admin-table-wrap { overflow-x: auto; }
    .admin-table td { vertical-align: middle; }
    .admin-btn-col { display: flex; flex-wrap: wrap; gap: 4px; }

    /* 문제에 딸린 <보기> 박스 (ㄱ, ㄴ, ㄷ ... 목록) */
    .context-box {
      margin-top: 12px;
      padding: 12px 14px;
      background-color: var(--card-inner);
      border: 1px solid var(--border-color);
      border-left: 3px solid var(--accent-blue);
      border-radius: 8px;
      font-size: 0.92rem;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: keep-all;
    }

    /* 폰: 헤더가 넘치지 않도록 이름 배지를 숨기고 버튼을 줄임 */
    @media (max-width: 600px) {
      .header-right { max-width: none; flex: 1; justify-content: flex-end; gap: 5px; }
      .header-right .user-profile-badge { display: none; }
      .header-right .header-btn { padding: 5px 7px; font-size: 0.74rem; }
      .header-right .sync-chip { font-size: 0.66rem; padding: 3px 6px; }
    }

    .toast-box {
      position: fixed;
      left: 50%;
      bottom: 90px;
      transform: translateX(-50%);
      background-color: #232654;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      max-width: 90vw;
      z-index: 2000;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body>

  <!-- 상단 네비게이션 헤더 -->
  <header class="top-header">
    <div class="header-left">
      <div class="brand-title" id="nav-brand" onclick="goHome()">
        <i class="fa-solid fa-clone"></i>
        <span>학습하기</span>
      </div>
    </div>
    <div class="header-right" id="header-user-controls" style="display:none;">
      <span class="sync-chip" id="sync-chip" style="display:none;"></span>
      <div class="user-profile-badge">
        <i class="fa-solid fa-circle-user"></i>
        <span id="current-username"></span>
      </div>
      <button class="header-btn" onclick="openSettingsModal()"><i class="fa-solid fa-sliders"></i> 내 설정</button>
      <button class="header-btn" onclick="openReportListModal()"><i class="fa-solid fa-list-check"></i> 오류 검토</button>
      <button class="header-btn" id="admin-btn" style="display:none;" onclick="openAdminModal()"><i class="fa-solid fa-users-gear"></i> 회원 관리 <span class="badge-dot" id="admin-pending-badge" style="display:none;"></span></button>
      <button class="header-btn header-btn-logout" onclick="logout()" title="로그아웃"><i class="fa-solid fa-arrow-right-from-bracket"></i> 로그아웃</button>
      <button class="header-icon-btn" onclick="goHome()" title="나가기"><i class="fa-solid fa-xmark"></i></button>
    </div>
  </header>

  <!-- 메인 뷰 컨테이너 -->
  <main class="main-container">
    
    <!-- [화면 0] 로그인 / 승인 대기 화면 -->
    <div id="auth-view">
      <div class="auth-card">
        <div class="auth-icon"><i class="fa-solid fa-tooth"></i></div>
        <div class="user-select-title">치과기공사 국가시험 퀴즈</div>
        <div class="user-select-sub" id="auth-sub"></div>
        <div id="auth-body"><div class="auth-hint"><i class="fa-solid fa-rotate fa-spin"></i> 불러오는 중...</div></div>
      </div>
    </div>

    <!-- [화면 1] 메인 과목 목록 화면 -->
    <div id="subject-view">
      <!-- 오늘의 문제 -->
      <div class="daily-card" id="daily-card"></div>

      <div class="filter-bar">
        <div class="filter-bar-left">
          <select class="select-dropdown" id="period-filter" onchange="filterSubjects()">
            <option value="all">전체 교시</option>
            <option value="1">1교시 과목</option>
            <option value="2">2교시 과목</option>
          </select>
          <div class="shuffle-toggle-group">
            <label class="shuffle-label" title="문제 출제 순서를 무작위로 섞습니다">
              <input type="checkbox" id="toggle-shuffle-questions">
              <span><i class="fa-solid fa-shuffle"></i> 문제 섞기</span>
            </label>
            <label class="shuffle-label" title="1~5번 보기 순서를 무작위로 섞습니다">
              <input type="checkbox" id="toggle-shuffle-options">
              <span><i class="fa-solid fa-arrows-split-up-and-left"></i> 보기 섞기</span>
            </label>
          </div>
        </div>

        <div class="search-input-box">
          <input type="text" id="subject-search" placeholder="제목으로 필터링" oninput="filterSubjects()">
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>
      </div>

      <!-- 1교시 섹션 -->
      <div id="section-period-1">
        <div class="period-section-title"><i class="fa-regular fa-clock"></i> 1교시</div>
        <div class="subject-list" id="subject-list-period-1"></div>
      </div>

      <!-- 2교시 섹션 -->
      <div id="section-period-2">
        <div class="period-section-title"><i class="fa-regular fa-clock"></i> 2교시</div>
        <div class="subject-list" id="subject-list-period-2"></div>
      </div>
    </div>

    <!-- [화면 2] 문제 풀이 화면 -->
    <div id="quiz-view">
      <div class="progress-wrapper">
        <div class="progress-count-badge badge-correct" id="quiz-badge-correct">0</div>
        <div class="segmented-progress-bar" id="segmented-bar"></div>
        <div class="progress-count-badge badge-total" id="quiz-badge-total">0</div>
      </div>

      <div class="quiz-card" id="quiz-card-box">
        <div>
          <div class="quiz-card-header" id="quiz-card-header"></div>
          <div class="quiz-question-title" id="quiz-question-text">문제가 여기에 표시됩니다.</div>
          <div class="context-box" id="quiz-context-box" style="display:none;"></div>
          <div class="status-msg-banner" id="status-msg-banner"></div>
        </div>

        <div>
          <div class="options-grid" id="quiz-options-container"></div>

          <!-- 공통 해설 및 핵심 팁 박스 -->
          <div class="common-explanation-box" id="common-explanation-box">
            <div class="expl-header"><i class="fa-solid fa-lightbulb"></i> 핵심 해설 & TIP</div>
            <div class="expl-body-text" id="common-explanation-text"></div>
          </div>

          <div class="quiz-card-footer">
            <button class="report-issue-btn" onclick="openReportModal()" title="오류 검토 요청">
              <i class="fa-regular fa-flag"></i> 오류 검토 요청
            </button>
            <button class="dont-know-btn" id="dont-know-btn" onclick="handleDontKnow()">
              모르시겠어요?
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- [화면 3] 학습 완료 및 오답 리스트 화면 -->
    <div id="quiz-result-view">
      <div class="result-summary-card">
        <div class="result-summary-icon"><i class="fa-solid fa-circle-check"></i></div>
        <div class="result-summary-title">학습을 완료했습니다!</div>
        <div class="result-summary-stats" id="result-summary-stats-text"></div>
        <div class="result-btn-group">
          <button class="continue-btn" id="result-continue-daily-btn" style="display:none;" onclick="continueDailyFromResult()">오늘의 문제 이어서 풀기</button>
          <button class="continue-btn" onclick="goHome()">홈으로</button>
          <button class="btn-action-sm btn-retry-wrong" id="result-retry-wrong-btn" style="padding:10px 20px; font-size:0.9rem; display:none;" onclick="retryWrongQuestions()">
            오답 다시 풀기
          </button>
        </div>
      </div>

      <!-- 틀린 문항 리스트 -->
      <div class="wrong-review-section" id="wrong-review-section" style="display:none;">
        <div class="wrong-review-header">
          <i class="fa-solid fa-triangle-exclamation" style="color:var(--error-orange);"></i>
          <span>틀린 문제 모아보기</span>
        </div>
        <div id="wrong-items-container"></div>
      </div>
    </div>

  </main>

  <!-- 하단 정답 피드백 액션바 -->
  <div class="bottom-feedback-bar" id="bottom-feedback-bar">
    <div class="feedback-hint-text">키보드 방향키(← 이전, → 다음) 또는 계속을 누르세요</div>
    <div class="nav-btn-group">
      <button class="prev-nav-btn" id="prev-btn" onclick="prevQuestion()"><i class="fa-solid fa-chevron-left"></i> 이전</button>
      <button class="continue-btn" id="continue-btn" onclick="nextQuestion()">계속 <i class="fa-solid fa-chevron-right"></i></button>
    </div>
  </div>

  <!-- [모달 1] 오류 검토 요청 모달 -->
  <div class="modal-overlay" id="report-modal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title">오류 검토 요청</div>
        <button class="modal-close-btn" onclick="closeModal('report-modal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="form-group">
        <label>해당 문제</label>
        <textarea class="form-control" id="report-question-preview" rows="2" readonly></textarea>
      </div>
      <div class="form-group">
        <label>오류 내용 및 수정 건의</label>
        <textarea class="form-control" id="report-content" rows="4" placeholder="오탈자, 정답 오류, 해설 이상 내용 등을 적어주세요."></textarea>
      </div>
      <button class="continue-btn" style="width:100%; max-width:none;" onclick="submitReport()">검토 요청 보내기</button>
    </div>
  </div>

  <!-- [모달 2] 내 설정 모달 -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal-box" style="max-width:560px;">
      <div class="modal-header">
        <div class="modal-title"><i class="fa-solid fa-sliders"></i> 내 설정</div>
        <button class="modal-close-btn" onclick="closeModal('settings-modal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="form-group">
        <label>이름</label>
        <input type="text" class="form-control" id="set-name" maxlength="20">
      </div>
      <div class="form-group">
        <label>하루 목표 문항 수 (5~200)</label>
        <input type="number" class="form-control" id="set-goal" min="5" max="200" step="1">
      </div>
      <div class="form-group">
        <label>오늘의 문제에 포함할 과목</label>
        <label class="set-subject-item" style="margin-bottom:8px;">
          <input type="checkbox" id="set-all-subjects" onchange="toggleAllSubjects(this.checked)"> <span><b>전체 선택/해제</b></span>
        </label>
        <div id="set-subject-list" class="set-subject-box"></div>
      </div>
      <button class="continue-btn" style="width:100%; max-width:none;" onclick="saveSettings()">저장하기</button>
    </div>
  </div>

  <!-- [모달 3] 오류 검토 리스트 모달 -->
  <div class="modal-overlay" id="report-list-modal">
    <div class="modal-box" style="max-width:680px;">
      <div class="modal-header">
        <div class="modal-title" id="report-modal-title">접수된 오류 검토 리스트</div>
        <button class="modal-close-btn" onclick="closeModal('report-list-modal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="report-list-container"></div>
    </div>
  </div>

  <!-- [모달 4] 회원 관리 모달 (admin 전용) -->
  <div class="modal-overlay" id="admin-modal">
    <div class="modal-box" style="max-width:820px;">
      <div class="modal-header">
        <div class="modal-title"><i class="fa-solid fa-users-gear"></i> 회원 관리 (관리자)</div>
        <button class="modal-close-btn" onclick="closeModal('admin-modal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="admin-user-list"></div>
    </div>
  </div>

  <!-- [모달 5] 오답 문제 해설 확인 모달 (전체 해설에서 오답 해설로 변경) -->
  <div class="modal-overlay" id="explanation-modal">
    <div class="modal-box" style="max-width:750px;">
      <div class="modal-header">
        <div class="modal-title" id="expl-modal-title">오답 문제 해설</div>
        <button class="modal-close-btn" onclick="closeModal('explanation-modal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="expl-modal-content"></div>
    </div>
  </div>

  <div class="toast-box" id="toast-box" style="display:none;"></div>

  <!-- Supabase (구글 로그인 + 클라우드 DB) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="./js/config.js"></script>

  <!-- 11개 기본 과목 + 11개 기출 과목 스크립트 연결 -->
  <script src="./data/anatomy.js"></script>
  <script src="./data/anatomy_past.js"></script>
