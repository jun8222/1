<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>치과기공사 국가시험 퀴즈</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #0a092d;
      --card-bg: #131436;
      --card-hover: #1e204d;
      --card-inner: #1a1a3a;
      --border-color: #2e3856;
      --text-main: #f6f7fb;
      --text-sub: #939bb4;
      --accent-blue: #4255ff;
      --accent-blue-hover: #2e40ea;
      --correct-green: #22c55e;
      --error-orange: #ff7842;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 상단 네비게이션 헤더 */
    .top-header {
      width: 100%;
      height: 60px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-dark);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      white-space: nowrap;
    }

    .brand-title i {
      color: var(--accent-blue);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      max-width: 70%;
      padding-bottom: 2px;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .header-right::-webkit-scrollbar {
      display: none;
    }

    .user-profile-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 5px 10px;
      border-radius: 16px;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .header-btn {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .header-btn:hover {
      background-color: var(--card-hover);
      border-color: var(--accent-blue);
    }

    .header-btn-logout {
      border-color: rgba(255, 120, 66, 0.4);
      color: var(--error-orange);
    }

    .header-btn-logout:hover {
      background-color: rgba(255, 120, 66, 0.15);
      border-color: var(--error-orange);
    }

    .header-icon-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1.1rem;
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* 메인 컨테이너 */
    .main-container {
      flex: 1;
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 16px 80px;
    }

    /* [화면 0] 사용자 선택 화면 */
    #user-select-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 70vh;
      text-align: center;
    }

    .user-select-title {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .user-select-sub {
      color: var(--text-sub);
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    .user-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 760px;
      margin-bottom: 24px;
    }

    @media (max-width: 600px) {
      .user-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .user-card-btn {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 20px 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: all 0.2s;
    }

    .user-avatar-circle {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background-color: var(--card-inner);
      border: 2px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: var(--accent-blue);
    }

    .user-name-text {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .user-role-text {
      font-size: 0.72rem;
      color: var(--text-sub);
      background-color: rgba(255, 255, 255, 0.05);
      padding: 2px 8px;
      border-radius: 10px;
    }

    /* [화면 1] 메인 과목 목록 화면 */
    #subject-view {
      display: none;
    }

    .filter-bar {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 20px;
    }

    @media (min-width: 680px) {
      .filter-bar {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .filter-bar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .select-dropdown {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    .shuffle-toggle-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .shuffle-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
    }

    .shuffle-label input[type="checkbox"] {
      accent-color: var(--accent-blue);
      width: 15px;
      height: 15px;
    }

    .search-input-box {
      position: relative;
      width: 100%;
    }

    @media (min-width: 680px) {
      .search-input-box {
        width: 250px;
      }
    }

    .search-input-box input {
      width: 100%;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 36px 8px 14px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
    }

    .search-input-box i {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
    }

    .period-section-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 24px 0 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .subject-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .subject-card-wrapper {
      display: flex;
      flex-direction: column;
      border-radius: 12px;
    }

    .subject-card {
      padding: 12px 14px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      transition: all 0.2s;
      gap: 8px;
    }

    .subject-card:hover {
      background-color: var(--card-hover);
    }

    .subject-card-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .card-icon-box {
      width: 38px;
      height: 38px;
      background-color: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #3b82f6;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .subject-title-area {
      min-width: 0;
    }

    .subject-info-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .subject-info-sub {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    .subject-card-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-start-badge {
      background-color: var(--accent-blue);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      transition: background-color 0.2s;
    }

    .btn-start-badge:hover {
      background-color: var(--accent-blue-hover);
    }

    .recent-wrong-badge {
      background-color: rgba(255, 120, 66, 0.15);
      border: 1px solid rgba(255, 120, 66, 0.4);
      color: var(--error-orange);
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.72rem;
      font-weight: 600;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .card-more-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1rem;
      padding: 6px 8px;
      cursor: pointer;
      border-radius: 6px;
    }

    /* 회차 이력 아코디언 드롭다운 패널 */
    .history-dropdown-panel {
      display: none;
      background-color: #0d0e2e;
      border: 1px solid var(--border-color);
      border-top: none;
      border-radius: 0 0 12px 12px;
      padding: 12px;
      margin-top: -2px;
      flex-direction: column;
      gap: 8px;
    }

    .history-card-item {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .history-meta-text {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-bottom: 2px;
    }

    .history-action-btns {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-action-sm {
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .btn-retry-wrong {
      background-color: rgba(255, 120, 66, 0.15);
      border-color: var(--error-orange);
      color: var(--error-orange);
    }

    .btn-retry-wrong:hover {
      background-color: var(--error-orange);
      color: #fff;
    }

    .btn-review-expl {
      background-color: var(--card-inner);
      border-color: var(--border-color);
      color: var(--text-main);
    }

    .btn-review-expl:hover {
      border-color: var(--accent-blue);
    }

    /* =========================================================
       [화면 2] 문제 풀이 화면
       ========================================================= */
    #quiz-view {
      display: none;
    }

    .progress-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .progress-count-badge {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .badge-correct {
      background-color: var(--correct-green);
      color: #fff;
    }

    .badge-total {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-sub);
    }

    .segmented-progress-bar {
      flex: 1;
      height: 8px;
      background-color: var(--card-bg);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      gap: 2px;
      padding: 1px;
    }

    .progress-segment {
      flex: 1;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.08);
      border-radius: 1px;
    }

    .progress-segment.passed {
      background-color: var(--correct-green);
    }

    .progress-segment.failed {
      background-color: var(--error-orange);
    }

    .quiz-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px 18px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
    }

    @media (min-width: 680px) {
      .quiz-card {
        padding: 36px 40px;
      }
    }

    .quiz-card-header {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-sub);
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .quiz-question-title {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.55;
      color: var(--text-main);
      margin-bottom: 16px;
    }

    .status-msg-banner {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: none;
    }

    .status-msg-banner.correct {
      color: var(--correct-green);
      display: block;
    }

    .status-msg-banner.wrong {
      color: var(--error-orange);
      display: block;
    }

    /* 선택지 레이아웃 (PC: 2열 / 모바일: 무조건 1행 1선택지) */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    @media (min-width: 680px) {
      .options-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .option-btn:nth-child(5) {
        grid-column: span 2;
      }
    }

    .option-btn {
      background-color: transparent;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      color: var(--text-main);
      font-size: 0.92rem;
      text-align: left;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
      width: 100%;
    }

    .option-btn:hover:not(.disabled) {
      background-color: var(--card-inner);
      border-color: var(--accent-blue);
    }

    .option-top-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.4;
    }

    .option-idx {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-sub);
      min-width: 18px;
    }

    .option-explanation-inline {
      display: none;
      font-size: 0.8rem;
      color: #cbd5e1;
      padding-top: 8px;
      margin-top: 4px;
      border-top: 1px dashed rgba(255, 255, 255, 0.15);
      line-height: 1.45;
    }

    .option-btn.correct-choice {
      border: 2px solid var(--correct-green) !important;
      background-color: rgba(34, 197, 94, 0.08) !important;
    }

    .option-btn.correct-highlight {
      border: 2px dashed var(--correct-green) !important;
      background-color: rgba(34, 197, 94, 0.05) !important;
    }

    .option-btn.wrong-choice {
      border: 2px solid var(--error-orange) !important;
      background-color: rgba(255, 120, 66, 0.08) !important;
    }

    .option-btn.disabled {
      cursor: default;
    }

    .common-explanation-box {
      display: none;
      background-color: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px;
      margin-top: 14px;
      margin-bottom: 16px;
    }

    .expl-header {
      font-size: 0.85rem;
      font-weight: 700;
      color: #60a5fa;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .expl-body-text {
      font-size: 0.85rem;
      line-height: 1.5;
      color: #e2e8f0;
    }

    .quiz-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .report-issue-btn {
      background: none;
      border: none;
      color: #70799b;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dont-know-btn {
      background-color: var(--card-inner);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* 하단 피드백 액션바 */
    .bottom-feedback-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      min-height: 64px;
      background-color: #0d0f2b;
      border-top: 1px solid var(--border-color);
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      z-index: 100;
      gap: 8px;
    }

    .feedback-hint-text {
      color: var(--text-sub);
      font-size: 0.8rem;
      display: none;
    }

    @media (min-width: 680px) {
      .feedback-hint-text {
        display: block;
      }
      .bottom-feedback-bar {
        padding: 0 40px;
        height: 72px;
      }
    }

    .nav-btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      justify-content: flex-end;
    }

    @media (min-width: 680px) {
      .nav-btn-group {
        width: auto;
      }
    }

    .prev-nav-btn {
      background-color: var(--card-inner);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .prev-nav-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .continue-btn {
      background-color: var(--accent-blue);
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
      justify-content: center;
      max-width: 200px;
    }

    /* [화면 3] 학습 완료 화면 */
    #quiz-result-view {
      display: none;
      flex-direction: column;
      gap: 20px;
    }

    .result-summary-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 32px 16px;
      text-align: center;
    }

    .result-summary-icon {
      font-size: 2.5rem;
      color: var(--correct-green);
      margin-bottom: 12px;
    }

    .result-summary-title {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .result-summary-stats {
      color: var(--text-sub);
      font-size: 0.95rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .result-btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .wrong-review-section {
      margin-top: 4px;
    }

    .wrong-review-header {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .wrong-item-box {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .wrong-item-qtitle {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .wrong-item-optlist {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 10px;
    }

    .wrong-item-optline {
      font-size: 0.85rem;
      color: var(--text-sub);
      padding: 5px 8px;
      border-radius: 6px;
    }

    .wrong-item-optline.is-answer {
      background-color: rgba(34, 197, 94, 0.12);
      color: #4ade80;
      font-weight: 600;
    }

    .wrong-item-expl {
      background-color: var(--card-inner);
      border-left: 3px solid #60a5fa;
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 0.8rem;
      color: #cbd5e1;
      line-height: 1.45;
    }

    /* 모달 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .modal-box {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      width: 92%;
      max-width: 540px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .modal-close-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      background-color: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent-blue);
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.82rem;
    }

    .admin-table th, .admin-table td {
      border: 1px solid var(--border-color);
      padding: 8px;
      text-align: left;
    }

    .admin-table th {
      background-color: var(--card-inner);
      color: var(--text-sub);
    }
  </style>
</head>
<body>

  <!-- 상단 네비게이션 헤더 -->
  <header class="top-header">
    <div class="header-left">
      <div class="brand-title" id="nav-brand" onclick="goHome()">
        <i class="fa-solid fa-clone"></i>
        <span>학습하기</span>
      </div>
    </div>
    <div class="header-right" id="header-user-controls" style="display:none;">
      <div class="user-profile-badge">
        <i class="fa-solid fa-circle-user"></i>
        <span id="current-username">준영</span>
      </div>
      <button class="header-btn" onclick="openProfileModal()"><i class="fa-solid fa-key"></i> 이름/PW 변경</button>
      <button class="header-btn" onclick="openReportListModal()"><i class="fa-solid fa-list-check"></i> 오류 검토 리스트</button>
      <button class="header-btn" id="admin-btn" style="display:none;" onclick="openAdminModal()"><i class="fa-solid fa-users-gear"></i> 회원 관리</button>
      <button class="header-btn header-btn-logout" onclick="logout()" title="프로필 선택으로 돌아가기"><i class="fa-solid fa-arrow-right-from-bracket"></i> 로그아웃</button>
      <button class="header-icon-btn" onclick="goHome()" title="나가기"><i class="fa-solid fa-xmark"></i></button>
    </div>
  </header>

  <!-- 메인 뷰 컨테이너 -->
  <main class="main-container">
    
    <!-- [화면 0] 사용자 선택 화면 -->
    <div id="user-select-view">
      <div class="user-select-title">학습할 프로필을 선택하세요</div>
      <div class="user-select-sub">계정을 선택하거나 신규 등록하여 맞춤형 오답 학습을 시작합니다.</div>
      <div class="user-grid" id="user-grid-container"></div>
    </div>

    <!-- [화면 1] 메인 과목 목록 화면 -->
    <div id="subject-view">
      <div class="filter-bar">
        <div class="filter-bar-left">
          <select class="select-dropdown" id="period-filter" onchange="filterSubjects()">
            <option value="all">전체 교시</option>
            <option value="1">1교시 과목</option>
            <option value="2">2교시 과목</option>
          </select>
          <div class="shuffle-toggle-group">
            <label class="shuffle-label" title="문제 출제 순서를 무작위로 섞습니다">
              <input type="checkbox" id="toggle-shuffle-questions">
              <span><i class="fa-solid fa-shuffle"></i> 문제 섞기</span>
            </label>
            <label class="shuffle-label" title="1~5번 보기 순서를 무작위로 섞습니다">
              <input type="checkbox" id="toggle-shuffle-options">
              <span><i class="fa-solid fa-arrows-split-up-and-left"></i> 보기 섞기</span>
            </label>
          </div>
        </div>

        <div class="search-input-box">
          <input type="text" id="subject-search" placeholder="제목으로 필터링" oninput="filterSubjects()">
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>
      </div>

      <!-- 1교시 섹션 -->
      <div id="section-period-1">
        <div class="period-section-title"><i class="fa-regular fa-clock"></i> 1교시</div>
        <div class="subject-list" id="subject-list-period-1"></div>
      </div>

      <!-- 2교시 섹션 -->
      <div id="section-period-2">
        <div class="period-section-title"><i class="fa-regular fa-clock"></i> 2교시</div>
        <div class="subject-list" id="subject-list-period-2"></div>
      </div>
    </div>

    <!-- [화면 2] 문제 풀이 화면 -->
    <div id="quiz-view">
      <div class="progress-wrapper">
        <div class="progress-count-badge badge-correct" id="quiz-badge-correct">0</div>
        <div class="segmented-progress-bar" id="segmented-bar"></div>
        <div class="progress-count-badge badge-total" id="quiz-badge-total">0</div>
      </div>

      <div class="quiz-card" id="quiz-card-box">
        <div>
          <div class="quiz-card-header">단어 • 문제</div>
          <div class="quiz-question-title" id="quiz-question-text">문제가 여기에 표시됩니다.</div>
          <div class="status-msg-banner" id="status-msg-banner"></div>
        </div>

        <div>
          <div class="options-grid" id="quiz-options-container"></div>

          <!-- 공통 해설 및 핵심 팁 박스 -->
          <div class="common-explanation-box" id="common-explanation-box">
            <div class="expl-header"><i class="fa-solid fa-lightbulb"></i> 핵심 해설 & TIP</div>
            <div class="expl-body-text" id="common-explanation-text"></div>
          </div>

          <div class="quiz-card-footer">
            <button class="report-issue-btn" onclick="openReportModal()" title="오류 검토 요청">
              <i class="fa-regular fa-flag"></i> 오류 검토 요청
            </button>
            <button class="dont-know-btn" id="dont-know-btn" onclick="handleDontKnow()">
              모르시겠어요?
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- [화면 3] 학습 완료 및 오답 리스트 화면 -->
    <div id="quiz-result-view">
      <div class="result-summary-card">
        <div class="result-summary-icon"><i class="fa-solid fa-circle-check"></i></div>
        <div class="result-summary-title">학습을 완료했습니다!</div>
        <div class="result-summary-stats" id="result-summary-stats-text"></div>
        <div class="result-btn-group">
          <button class="continue-btn" onclick="goHome()">과목 목록으로</button>
          <button class="btn-action-sm btn-retry-wrong" id="result-retry-wrong-btn" style="padding:10px 20px; font-size:0.9rem; display:none;" onclick="retryWrongQuestions()">
            오답 다시 풀기
          </button>
        </div>
      </div>

      <!-- 틀린 문항 리스트 -->
      <div class="wrong-review-section" id="wrong-review-section" style="display:none;">
        <div class="wrong-review-header">
          <i class="fa-solid fa-triangle-exclamation" style="color:var(--error-orange);"></i>
          <span>틀린 문제 모아보기</span>
        </div>
        <div id="wrong-items-container"></div>
      </div>
    </div>

  </main>

  <!-- 하단 정답 피드백 액션바 -->
  <div class="bottom-feedback-bar" id="bottom-feedback-bar">
    <div class="feedback-hint-text">키보드 방향키(← 이전, → 다음) 또는 계속을 누르세요</div>
    <div class="nav-btn-group">
      <button class="prev-nav-btn" id="prev-btn" onclick="prevQuestion()"><i class="fa-solid fa-chevron-left"></i> 이전</button>
      <button class="continue-btn" id="continue-btn" onclick="nextQuestion()">계속 <i class="fa-solid fa-chevron-right"></i></button>
    </div>
  </div>

  <!-- [모달: 신규 게스트 등록 모달] -->
  <div class="modal-overlay" id="register-guest-modal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title" id="register-modal-title">새 사용자 등록</div>
        <button class="modal-close-btn" onclick="closeModal('register-guest-modal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="form-group">
        <label>사용자 이름 (게스트 이름을 대체합니다)</label>
        <input type="text" class="form-control" id="reg-username" placeholder="예: 홍길동">
      </div>
      <div class="form-group">
        <label>비밀번호 설정</label>
        <input type="password" class="form-control" id="reg-password" placeholder="비밀번호 입력">
      </div>
      <button class="continue-btn" style="width:100%; max-width:none;" onclick="submitGuestRegister()">등록하고 학습 시작</button>
    </div>
  </div>

  <!-- [모달: 기존 프로필 로그인 비밀번호 입력 모달] -->
  <div class="modal-overlay" id="login-password-modal">
    <div class="modal-box" style="max-width:400px;">
      <div class="modal-header">
        <div class="modal-title" id="login-modal-title">비밀번호 입력</div>
        <button class="modal-close-btn" onclick="closeModal('login-password-modal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="form-group">
        <label id="login-modal-sublabel">계정 비밀번호</label>
        <input type="password" class="form-control" id="login-input-password" placeholder="비밀번호 입력" onkeyup="if(event.key==='Enter') submitProfileLogin()">
      </div>
      <button class="continue-btn" style="width:100%; max-width:none;" onclick="submitProfileLogin()">확인</button>
    </div>
  </div>

  <!-- [모달 1] 오류 검토 요청 모달 -->
  <div class="modal-overlay" id="report-modal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title">오류 검토 요청</div>
        <button class="modal-close-btn" onclick="closeModal('report-modal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="form-group">
        <label>해당 문제</label>
        <textarea class="form-control" id="report-question-preview" rows="2" readonly></textarea>
      </div>
      <div class="form-group">
        <label>오류 내용 및 수정 건의</label>
        <textarea class="form-control" id="report-content" rows="4" placeholder="오탈자, 정답 오류, 해설 이상 내용 등을 적어주세요."></textarea>
      </div>
      <button class="continue-btn" style="width:100%; max-width:none;" onclick="submitReport()">검토 요청 보내기</button>
    </div>
  </div>

  <!-- [모달 2] 이름/PW 변경 모달 -->
  <div class="modal-overlay" id="profile-modal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title">이름 / 비밀번호 변경</div>
        <button class="modal-close-btn" onclick="closeModal('profile-modal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="form-group">
        <label>사용자 이름</label>
        <input type="text" class="form-control" id="input-username">
      </div>
      <div class="form-group">
        <label>새 비밀번호</label>
        <input type="password" class="form-control" id="input-password" placeholder="변경할 새 비밀번호">
      </div>
      <button class="continue-btn" style="width:100%; max-width:none;" onclick="saveProfile()">저장하기</button>
    </div>
  </div>

  <!-- [모달 3] 오류 검토 리스트 모달 -->
  <div class="modal-overlay" id="report-list-modal">
    <div class="modal-box" style="max-width:680px;">
      <div class="modal-header">
        <div class="modal-title">접수된 오류 검토 리스트</div>
        <button class="modal-close-btn" onclick="closeModal('report-list-modal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="report-list-container"></div>
    </div>
  </div>

  <!-- [모달 4] 회원 관리 모달 (admin 전용) -->
  <div class="modal-overlay" id="admin-modal">
    <div class="modal-box" style="max-width:680px;">
      <div class="modal-header">
        <div class="modal-title"><i class="fa-solid fa-users-gear"></i> 슬롯 및 회원 관리 (Admin)</div>
        <button class="modal-close-btn" onclick="closeModal('admin-modal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="admin-user-list"></div>
    </div>
  </div>

  <!-- [모달 5] 오답 문제 해설 확인 모달 (전체 해설에서 오답 해설로 변경) -->
  <div class="modal-overlay" id="explanation-modal">
    <div class="modal-box" style="max-width:750px;">
      <div class="modal-header">
        <div class="modal-title" id="expl-modal-title">오답 문제 해설</div>
        <button class="modal-close-btn" onclick="closeModal('explanation-modal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="expl-modal-content"></div>
    </div>
  </div>

  <!-- 11개 기본 과목 + 11개 기출 과목 스크립트 연결 -->
  <script src="./data/anatomy.js"></script>
  <script src="./data/anatomy_past.js"></script>
  <script src="./data/morphology.js"></script>
  <script src="./data/morphology_past.js"></script>
  <script src="./data/hygiene.js"></script>
  <script src="./data/hygiene_past.js"></script>
  <script src="./data/materials.js"></script>
  <script src="./data/materials_past.js"></script>
  <script src="./data/law.js"></script>
  <script src="./data/law_past.js"></script>

  <script src="./data/crown_bridge.js"></script>
  <script src="./data/crown_bridge_past.js"></script>
  <script src="./data/porcelain.js"></script>
  <script src="./data/porcelain_past.js"></script>
  <script src="./data/complete_denture.js"></script>
  <script src="./data/complete_denture_past.js"></script>
  <script src="./data/partial_denture.js"></script>
  <script src="./data/partial_denture_past.js"></script>
  <script src="./data/restorative.js"></script>
  <script src="./data/restorative_past.js"></script>
  <script src="./data/orthodontics.js"></script>
  <script src="./data/orthodontics_past.js"></script>

  <script>
    const subjectMeta = [
      // 1교시
      { key: 'anatomy', name: '구강해부학 (1~12)', period: 1 },
      { key: 'anatomy_past', name: '구강해부학 국시기출 (19~25년)', period: 1 },
      { key: 'morphology', name: '치아형태학 (13~28)', period: 1 },
      { key: 'morphology_past', name: '치아형태학 국시기출 (19~25년)', period: 1 },
      { key: 'hygiene', name: '구강보건학 (29~40)', period: 1 },
      { key: 'hygiene_past', name: '구강보건학 국시기출 (19~25년)', period: 1 },
      { key: 'materials', name: '치과재료학 (41~75)', period: 1 },
      { key: 'materials_past', name: '치과재료학 국시기출 (19~25년)', period: 1 },
      { key: 'law', name: '의료관계법규 (76~95)', period: 1 },
      { key: 'law_past', name: '의료관계법규 국시기출 (19~25년)', period: 1 },

      // 2교시
      { key: 'crown_bridge', name: '관교의치기공학 (1~19)', period: 2 },
      { key: 'crown_bridge_past', name: '관교의치기공학 국시기출 (19~25년)', period: 2 },
      { key: 'porcelain', name: '도재기공학 (20~34)', period: 2 },
      { key: 'porcelain_past', name: '도재기공학 국시기출 (19~25년)', period: 2 },
      { key: 'complete_denture', name: '총의치기공학 (35~58)', period: 2 },
      { key: 'complete_denture_past', name: '총의치기공학 국시기출 (19~25년)', period: 2 },
      { key: 'partial_denture', name: '국소의치기공학 (59~82)', period: 2 },
      { key: 'partial_denture_past', name: '국소의치기공학 국시기출 (19~25년)', period: 2 },
      { key: 'restorative', name: '충전기공학 (83~96)', period: 2 },
      { key: 'restorative_past', name: '충전기공학 국시기출 (19~25년)', period: 2 },
      { key: 'orthodontics', name: '교정기공학 (97~110)', period: 2 },
      { key: 'orthodontics_past', name: '교정기공학 국시기출 (19~25년)', period: 2 }
    ];

    let currentSubjectKey = null;
    let quizQuestions = [];
    let currentIndex = 0;
    let userAnswersRecord = [];
    let isAnswerChecked = false;
    let pendingLoginUserIndex = null;
    let registeringSlotIndex = null;

    const STORAGE_KEY_HISTORY = 'quizlet_exam_history_per_user_v5';
    const STORAGE_KEY_USER = 'quizlet_current_user_v5';
    const STORAGE_KEY_USERS_DB = 'quizlet_users_db_v5';
    const STORAGE_KEY_REPORTS = 'quizlet_reports_db_v5';

    window.addEventListener('DOMContentLoaded', () => {
      initUserDatabase();
      checkAutoLogin();
      window.addEventListener('keydown', handleGlobalKeydown);
    });

    function initUserDatabase() {
      let users = JSON.parse(localStorage.getItem(STORAGE_KEY_USERS_DB) || 'null');
      if (!users || users.length !== 6) {
        users = [
          { id: 'admin', slotName: '준영', username: '준영', password: '123', role: 'admin', isRegistered: true },
          { id: 'guestA', slotName: '게스트A', username: '게스트A', password: '', role: 'user', isRegistered: false },
          { id: 'guestB', slotName: '게스트B', username: '게스트B', password: '', role: 'user', isRegistered: false },
          { id: 'guestC', slotName: '게스트C', username: '게스트C', password: '', role: 'user', isRegistered: false },
          { id: 'guestD', slotName: '게스트D', username: '게스트D', password: '', role: 'user', isRegistered: false },
          { id: 'guestE', slotName: '게스트E', username: '게스트E', password: '', role: 'user', isRegistered: false }
        ];
        localStorage.setItem(STORAGE_KEY_USERS_DB, JSON.stringify(users));
      }
    }

    function checkAutoLogin() {
      const currentUser = JSON.parse(localStorage.getItem(STORAGE_KEY_USER) || 'null');
      if (currentUser) {
        showMainView(currentUser);
      } else {
        showUserSelectView();
      }
    }

    // 프로필 선택 화면 표시
    function showUserSelectView() {
      document.getElementById('user-select-view').style.display = 'flex';
      document.getElementById('subject-view').style.display = 'none';
      document.getElementById('quiz-view').style.display = 'none';
      document.getElementById('quiz-result-view').style.display = 'none';
      document.getElementById('bottom-feedback-bar').style.display = 'none';
      document.getElementById('header-user-controls').style.display = 'none';

      const users = JSON.parse(localStorage.getItem(STORAGE_KEY_USERS_DB));
      const container = document.getElementById('user-grid-container');
      container.innerHTML = '';

      users.forEach((u, idx) => {
        const btn = document.createElement('div');
        btn.className = `user-card-btn ${!u.isRegistered ? 'is-empty' : ''}`;
        btn.onclick = () => handleProfileClick(idx);

        let iconClass = 'fa-user-graduate';
        if (u.role === 'admin') iconClass = 'fa-user-shield';
        else if (!u.isRegistered) iconClass = 'fa-user-plus';

        btn.innerHTML = `
          <div class="user-avatar-circle">
            <i class="fa-solid ${iconClass}"></i>
          </div>
          <div class="user-name-text">${u.username}</div>
          <div class="user-role-text">${u.role === 'admin' ? '관리자' : (u.isRegistered ? '학습자' : '신규 등록')}</div>
        `;
        container.appendChild(btn);
      });
    }

    function handleProfileClick(userIndex) {
      const users = JSON.parse(localStorage.getItem(STORAGE_KEY_USERS_DB));
      const target = users[userIndex];

      if (!target.isRegistered) {
        registeringSlotIndex = userIndex;

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // 7. 문제 풀이 세션 시작
    function startQuiz(key, specificQuestions = null) {
      const db = window.quizDatabase || {};
      const sub = db[key];
      if (!sub || !sub.questions || sub.questions.length === 0) {
        alert('문항 데이터를 불러올 수 없습니다.');
        return;
      }

      currentSubjectKey = key;
      const shuffleQuestions = document.getElementById('toggle-shuffle-questions').checked;
      const shuffleOptions = document.getElementById('toggle-shuffle-options').checked;

      let baseQuestions = specificQuestions 
        ? specificQuestions.map(item => JSON.parse(JSON.stringify(item))) 
        : sub.questions.map(item => JSON.parse(JSON.stringify(item)));

      if (shuffleQuestions) {
        baseQuestions = shuffleArray(baseQuestions);
      }

      if (shuffleOptions) {
        baseQuestions.forEach(q => {
          const originalAnswerIndex = q.answer;
          const mappedOptions = q.options.map((optText, idx) => {
            const optNum = idx + 1;
            return {
              text: optText,
              originalNum: optNum,
              expl: (q.optionExplanations && q.optionExplanations[optNum]) ? q.optionExplanations[optNum] : ''
            };
          });

          const shuffledMapped = shuffleArray(mappedOptions);

          const newOptions = [];
          const newExplMap = {};
          let newAnswer = 1;

          shuffledMapped.forEach((item, newIdx) => {
            const newNum = newIdx + 1;
            newOptions.push(item.text);
            if (item.expl) {
              newExplMap[newNum] = item.expl;
            }
            if (item.originalNum === originalAnswerIndex) {
              newAnswer = newNum;
            }
          });

          q.options = newOptions;
          q.answer = newAnswer;
          q.optionExplanations = newExplMap;
        });
      }

      quizQuestions = baseQuestions;
      currentIndex = 0;
      userAnswersRecord = new Array(quizQuestions.length).fill(null);
      isAnswerChecked = false;

      document.getElementById('subject-view').style.display = 'none';
      document.getElementById('quiz-result-view').style.display = 'none';
      document.getElementById('quiz-view').style.display = 'block';
      document.getElementById('bottom-feedback-bar').style.display = 'none';

      initProgressBar();
      renderCurrentQuestion();
    }

    function goHome() {
      document.getElementById('quiz-view').style.display = 'none';
      document.getElementById('quiz-result-view').style.display = 'none';
      document.getElementById('bottom-feedback-bar').style.display = 'none';
      document.getElementById('subject-view').style.display = 'block';
      renderSubjectList();

    function initProgressBar() {
      const barContainer = document.getElementById('segmented-bar');
      barContainer.innerHTML = '';
      quizQuestions.forEach((_, idx) => {
        const seg = document.createElement('div');
        seg.className = 'progress-segment';
        seg.id = `seg-${idx}`;
        barContainer.appendChild(seg);
      });
      document.getElementById('quiz-badge-correct').innerText = '0';
      document.getElementById('quiz-badge-total').innerText = quizQuestions.length;
    }

    function renderCurrentQuestion() {
      const q = quizQuestions[currentIndex];
      document.getElementById('quiz-question-text').innerText = `${currentIndex + 1}. ${q.question}`;

      const optContainer = document.getElementById('quiz-options-container');
      optContainer.innerHTML = '';

      q.options.forEach((optText, idx) => {
        const optNum = idx + 1;
        const btn = document.createElement('div');
        btn.className = 'option-btn';
        btn.onclick = () => selectAnswer(optNum);

        const individualExpl = (q.optionExplanations && q.optionExplanations[optNum]) ? q.optionExplanations[optNum] : '';

        btn.innerHTML = `
          <div class="option-top-row">
            <span class="option-idx" id="opt-icon-${optNum}">${optNum}</span>
            <span>${optText}</span>
          </div>
          <div class="option-explanation-inline" id="opt-expl-${optNum}">${individualExpl}</div>
        `;
        optContainer.appendChild(btn);
      });

      document.getElementById('prev-btn').disabled = (currentIndex === 0);

      const previousAnswer = userAnswersRecord[currentIndex];
      if (previousAnswer !== null) {
        restoreQuestionState(previousAnswer);
      } else {
        isAnswerChecked = false;
        document.getElementById('bottom-feedback-bar').style.display = 'none';
        const banner = document.getElementById('status-msg-banner');
        banner.className = 'status-msg-banner';
        banner.style.display = 'none';
        document.getElementById('common-explanation-box').style.display = 'none';
      }
    }

    function selectAnswer(userPick) {
      if (isAnswerChecked) return;
      isAnswerChecked = true;

      userAnswersRecord[currentIndex] = userPick;
      restoreQuestionState(userPick);
      updateProgressStats();

      document.getElementById('bottom-feedback-bar').style.display = 'flex';
    }

    function restoreQuestionState(userPick) {
      isAnswerChecked = true;
      const q = quizQuestions[currentIndex];
      const isCorrect = (userPick === q.answer);
      const optButtons = document.querySelectorAll('.option-btn');
      const segment = document.getElementById(`seg-${currentIndex}`);
      const banner = document.getElementById('status-msg-banner');

      optButtons.forEach(btn => btn.classList.add('disabled'));

      q.options.forEach((_, idx) => {
        const optNum = idx + 1;
        const explElem = document.getElementById(`opt-expl-${optNum}`);
        if (explElem && explElem.innerText.trim() !== '') {
          explElem.style.display = 'block';
        }
      });

      const commonExplText = (q.commonExplanations && q.commonExplanations.length > 0) ? q.commonExplanations.join('<br>') : '';
      if (commonExplText) {
        document.getElementById('common-explanation-text').innerHTML = commonExplText;
        document.getElementById('common-explanation-box').style.display = 'block';
      }

      if (isCorrect) {
        if (segment) {
          segment.classList.remove('failed');
          segment.classList.add('passed');
        }

        optButtons[userPick - 1].classList.add('correct-choice');
        document.getElementById(`opt-icon-${userPick}`).innerHTML = '<i class="fa-solid fa-check"></i>';

        banner.innerText = '잘하고 있어요!';
        banner.className = 'status-msg-banner correct';
      } else {
        if (segment) {
          segment.classList.remove('passed');
          segment.classList.add('failed');
        }

        if (userPick > 0 && userPick <= optButtons.length) {
          optButtons[userPick - 1].classList.add('wrong-choice');
          document.getElementById(`opt-icon-${userPick}`).innerHTML = '<i class="fa-solid fa-xmark"></i>';
        }

        optButtons[q.answer - 1].classList.add('correct-highlight');

        banner.innerText = '걱정하지 마세요, 아직 배우고 있잖아요!';
        banner.className = 'status-msg-banner wrong';
      }

      document.getElementById('bottom-feedback-bar').style.display = 'flex';
    }

    function updateProgressStats() {
      let count = 0;
      userAnswersRecord.forEach((ans, idx) => {
        if (ans !== null && ans === quizQuestions[idx].answer) {
          count++;
        }
      });
      correctCount = count;
      document.getElementById('quiz-badge-correct').innerText = correctCount;
    }

    function handleDontKnow() {
      if (isAnswerChecked) return;
      selectAnswer(-1);
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        renderCurrentQuestion();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function nextQuestion() {
      if (currentIndex < quizQuestions.length - 1) {
        currentIndex++;
        renderCurrentQuestion();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        finishQuizSession();
      }
    }

    function finishQuizSession() {
      document.getElementById('bottom-feedback-bar').style.display = 'none';
      document.getElementById('quiz-view').style.display = 'none';

      currentSessionWrongItems = [];
      quizQuestions.forEach((q, idx) => {
        const userAns = userAnswersRecord[idx];
        if (userAns === null || userAns !== q.answer) {
          currentSessionWrongItems.push({ ...q });
        }
      });

      const wrongIds = currentSessionWrongItems.map(item => item.id);
      saveSessionHistory(currentSubjectKey, quizQuestions.length, correctCount, wrongIds);

      document.getElementById('result-summary-stats-text').innerHTML = `
        총 ${quizQuestions.length}문항 중 <strong style="color:var(--correct-green);">${correctCount}문항</strong> 정답<br>
        <span style="color:var(--error-orange); font-weight:600;">오답 ${currentSessionWrongItems.length}문항</span>
      `;

      const retryBtn = document.getElementById('result-retry-wrong-btn');
      if (currentSessionWrongItems.length > 0) {
        retryBtn.innerText = `오답 ${currentSessionWrongItems.length}문제 다시 풀기`;
        retryBtn.style.display = 'inline-block';
      } else {
        retryBtn.style.display = 'none';
      }

      const wrongSection = document.getElementById('wrong-review-section');
      const wrongContainer = document.getElementById('wrong-items-container');

      if (currentSessionWrongItems.length > 0) {
        wrongSection.style.display = 'block';
        wrongContainer.innerHTML = '';

        currentSessionWrongItems.forEach((q, idx) => {
          const itemBox = document.createElement('div');
          itemBox.className = 'wrong-item-box';

          let optionsHtml = '';
          q.options.forEach((opt, optIdx) => {
            const optNum = optIdx + 1;
            const isAns = (optNum === q.answer);
            const expl = (q.optionExplanations && q.optionExplanations[optNum]) ? q.optionExplanations[optNum] : '';
            optionsHtml += `
              <div class="wrong-item-optline ${isAns ? 'is-answer' : ''}">
                ${optNum}. ${opt} ${isAns ? '<i class="fa-solid fa-check" style="margin-left:4px;"></i>' : ''}
                ${expl ? `<div style="font-size:0.75rem; color:#94a3b8; margin-top:2px; margin-left:14px;">↳ ${expl}</div>` : ''}
              </div>
            `;
          });

          const commonExpl = (q.commonExplanations && q.commonExplanations.length > 0) ? q.commonExplanations.join('<br>') : '';

          itemBox.innerHTML = `
            <div class="wrong-item-qtitle">[오답 ${idx + 1}] ${q.question}</div>
            <div class="wrong-item-optlist">${optionsHtml}</div>
            ${commonExpl ? `<div class="wrong-item-expl"><strong>[핵심 TIP]</strong> ${commonExpl}</div>` : ''}
          `;
          wrongContainer.appendChild(itemBox);
        });
      } else {
        wrongSection.style.display = 'none';
      }

      document.getElementById('quiz-result-view').style.display = 'flex';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function retryWrongQuestions() {
      if (!currentSessionWrongItems || currentSessionWrongItems.length === 0) return;
      const wrongListToRetry = currentSessionWrongItems.map(item => ({ ...item }));
      startQuiz(currentSubjectKey, wrongListToRetry);
    }

    function handleGlobalKeydown(e) {
      if (document.getElementById('quiz-view').style.display !== 'block') return;

      if (!isAnswerChecked) {
        if (['1', '2', '3', '4', '5'].includes(e.key)) {
          const pick = parseInt(e.key);
          const q = quizQuestions[currentIndex];
          if (q && pick <= q.options.length) {
            selectAnswer(pick);
          }
        }
      } else {
        if (e.key === 'ArrowRight' || e.key === 'Enter') {
          e.preventDefault();
          nextQuestion();
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          prevQuestion();
        }
      }
    }

    function getUserSpecificHistory() {
      try {
        const currentUser = JSON.parse(localStorage.getItem(STORAGE_KEY_USER));
        if (!currentUser || !currentUser.id) return [];

        const allHistories = JSON.parse(localStorage.getItem(STORAGE_KEY_HISTORY) || '[]');
        return allHistories.filter(h => h.userId === currentUser.id);
      } catch (e) {
        return [];
      }
    }

    function saveSessionHistory(subjectKey, total, correct, wrongIds) {
      const currentUser = JSON.parse(localStorage.getItem(STORAGE_KEY_USER));
      if (!currentUser) return;

      const allHistories = JSON.parse(localStorage.getItem(STORAGE_KEY_HISTORY) || '[]');
      const meta = subjectMeta.find(m => m.key === subjectKey);

      const newEntry = {
        id: Date.now(),
        userId: currentUser.id,
        subjectKey: subjectKey,
        subjectName: meta ? meta.name : subjectKey,
        date: new Date().toLocaleString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
        total: total,
        correct: correct,
        wrongIds: wrongIds
      };

      allHistories.unshift(newEntry);
      if (allHistories.length > 100) allHistories.pop();
      localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(allHistories));
    }

    function retryHistoryWrong(subjectKey, historyId) {
      const history = getUserSpecificHistory();
      const rec = history.find(h => h.id === historyId);
      if (!rec || !rec.wrongIds || rec.wrongIds.length === 0) return;

      const db = window.quizDatabase || {};
      const sub = db[subjectKey];
      if (!sub) return;

      const wrongQuestions = sub.questions.filter(q => rec.wrongIds.includes(q.id));
      startQuiz(subjectKey, wrongQuestions);
    }

    // ★ 오답 문제들에 대한 해설 모달 열기 (틀린 문제만 추출)
    function reviewHistoryExplanation(subjectKey, historyId) {
      const history = getUserSpecificHistory();
      const rec = history.find(h => h.id === historyId);
      if (!rec || !rec.wrongIds || rec.wrongIds.length === 0) {
        alert('이 회차에는 오답 문제가 없습니다.');
        return;
      }

      const db = window.quizDatabase || {};
      const sub = db[subjectKey];
      if (!sub) return;

      // 해당 회차에서 틀렸던 문제만 필터링
      const wrongQuestions = sub.questions.filter(q => rec.wrongIds.includes(q.id));

      document.getElementById('expl-modal-title').innerText = `${sub.title || '과목'} - 오답 문제 해설 (${wrongQuestions.length}문항)`;
      const container = document.getElementById('expl-modal-content');
      container.innerHTML = '';

      wrongQuestions.forEach((q, idx) => {
        const itemDiv = document.createElement('div');
        itemDiv.style.cssText = 'background:var(--card-inner); border:1px solid var(--border-color); border-radius:10px; padding:14px; margin-bottom:12px;';

        let optionsHtml = '';
        q.options.forEach((opt, optIdx) => {
          const optNum = optIdx + 1;
          const isAns = (optNum === q.answer);
          const expl = (q.optionExplanations && q.optionExplanations[optNum]) ? q.optionExplanations[optNum] : '';
          optionsHtml += `
            <div style="margin-top:5px; font-size:0.85rem; color:${isAns ? 'var(--correct-green)' : 'var(--text-sub)'}; font-weight:${isAns ? '700' : '400'};">
              ${optNum}. ${opt} ${isAns ? '✓ (정답)' : ''}
              ${expl ? `<div style="font-size:0.75rem; color:#cbd5e1; margin-left:12px; margin-top:2px;">↳ ${expl}</div>` : ''}
            </div>
          `;
        });

        const commonExpl = (q.commonExplanations && q.commonExplanations.length > 0) ? q.commonExplanations.join('<br>') : '';

        itemDiv.innerHTML = `
          <div style="font-weight:700; margin-bottom:6px; font-size:0.92rem; color:#f87171;">[오답 ${idx + 1}] ${q.question}</div>
          <div style="margin-bottom:8px;">${optionsHtml}</div>
          ${commonExpl ? `<div style="background:rgba(96,165,250,0.1); border-left:3px solid #60a5fa; padding:6px 10px; font-size:0.78rem; color:#93c5fd;"><strong>[핵심 TIP]</strong> ${commonExpl}</div>` : ''}
        `;
        container.appendChild(itemDiv);
      });

      document.getElementById('explanation-modal').style.display = 'flex';
    }
  </script>
</body>
</html>
