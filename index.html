<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>치과기공사 국가시험 퀴즈</title>
  
  <!-- 스타일시트 & 아이콘 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #0a092d;
      --card-bg: #131436;
      --card-hover: #1e204d;
      --card-inner: #1a1a3a;
      --border-color: #2e3856;
      --text-main: #f6f7fb;
      --text-sub: #939bb4;
      --accent-blue: #4255ff;
      --accent-blue-hover: #2e40ea;
      --correct-green: #22c55e;
      --error-orange: #ff7842;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 상단 네비게이션 헤더 */
    .top-header {
      width: 100%;
      height: 64px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-dark);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .brand-title i {
      color: var(--accent-blue);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-icon-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1.2rem;
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .header-icon-btn:hover {
      background-color: var(--card-inner);
      color: var(--text-main);
    }

    /* 공통 컨테이너 */
    .main-container {
      flex: 1;
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 24px 64px;
    }

    /* =========================================================
       [화면 1] 퀴즐렛 스타일 과목 목록 화면 (Subject View)
       ========================================================= */
    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .select-dropdown {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: all 0.2s;
    }

    .select-dropdown:hover {
      background-color: var(--card-hover);
    }

    .search-input-box {
      position: relative;
      width: 280px;
    }

    .search-input-box input {
      width: 100%;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 40px 10px 16px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }

    .search-input-box input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 2px rgba(66, 85, 255, 0.2);
    }

    .search-input-box i {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
    }

    .section-label {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 28px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .subject-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .subject-card {
      background-color: transparent;
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .subject-card:hover {
      background-color: var(--card-bg);
      border-color: var(--border-color);
    }

    .subject-card-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .card-icon-box {
      width: 44px;
      height: 44px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #3b82f6;
      font-size: 1.2rem;
    }

    .subject-card:hover .card-icon-box {
      background-color: var(--card-hover);
    }

    .subject-info-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .subject-info-sub {
      font-size: 0.82rem;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .subject-info-sub span::after {
      content: "•";
      margin-left: 8px;
    }

    .subject-info-sub span:last-child::after {
      content: "";
    }

    .subject-card-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .recent-wrong-badge {
      background-color: rgba(255, 120, 66, 0.15);
      border: 1px solid rgba(255, 120, 66, 0.4);
      color: var(--error-orange);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-more-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1.1rem;
      padding: 8px;
      cursor: pointer;
      border-radius: 50%;
      transition: all 0.2s;
    }

    .card-more-btn:hover {
      color: var(--text-main);
      background-color: var(--card-inner);
    }

    /* =========================================================
       [화면 2] 퀴즐렛 스타일 문제 풀이 화면 (Quiz View)
       ========================================================= */
    #quiz-view {
      display: none;
    }

    /* 상단 구간형 진행 바 */
    .progress-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .progress-count-badge {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .badge-correct {
      background-color: var(--correct-green);
      color: #fff;
    }

    .badge-total {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-sub);
    }

    .segmented-progress-bar {
      flex: 1;
      height: 8px;
      background-color: var(--card-bg);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      gap: 4px;
      padding: 1px;
    }

    .progress-segment {
      flex: 1;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      transition: background-color 0.3s;
    }

    .progress-segment.passed {
      background-color: var(--correct-green);
    }

    .progress-segment.failed {
      background-color: var(--error-orange);
    }

    /* 문제 풀이 단일 카드 */
    .quiz-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 36px 40px;
      min-height: 440px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .quiz-card-header {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .quiz-question-title {
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.6;
      color: var(--text-main);
      margin-bottom: 24px;
    }

    .status-msg-banner {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--error-orange);
      margin-bottom: 16px;
      display: none;
    }

    /* 선택지 그리드 (2열 레이아웃) */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .option-btn {
      background-color: transparent;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px 18px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      color: var(--text-main);
      font-size: 0.95rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
      line-height: 1.4;
    }

    /* 5번째 보기는 전폭 채움 */
    .option-btn:nth-child(5) {
      grid-column: span 2;
    }

    .option-btn:hover:not(.disabled) {
      background-color: var(--card-inner);
      border-color: var(--accent-blue);
    }

    .option-idx {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-sub);
      min-width: 18px;
    }

    /* 정답 / 오답 클래스 */
    .option-btn.correct-choice {
      border: 2px solid var(--correct-green) !important;
      background-color: rgba(34, 197, 94, 0.08) !important;
      color: var(--text-main);
    }

    .option-btn.correct-highlight {
      border: 2px dashed var(--correct-green) !important;
      background-color: rgba(34, 197, 94, 0.05) !important;
      color: var(--text-main);
    }

    .option-btn.wrong-choice {
      border: 2px solid var(--error-orange) !important;
      background-color: rgba(255, 120, 66, 0.08) !important;
      color: var(--text-main);
    }

    .option-btn.disabled {
      cursor: default;
      opacity: 0.6;
    }

    .option-btn.correct-choice.disabled,
    .option-btn.correct-highlight.disabled,
    .option-btn.wrong-choice.disabled {
      opacity: 1;
    }

    .quiz-card-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding-top: 12px;
    }

    .dont-know-btn {
      background: none;
      border: none;
      color: #70799b;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }

    .dont-know-btn:hover {
      color: var(--text-main);
    }

    /* 하단 정답 피드백 액션바 */
    .bottom-feedback-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 72px;
      background-color: #0d0f2b;
      border-top: 1px solid var(--border-color);
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 0 48px;
      z-index: 100;
    }

    .feedback-hint-text {
      color: var(--text-sub);
      font-size: 0.95rem;
    }

    .continue-btn {
      background-color: var(--accent-blue);
      color: #fff;
      border: none;
      padding: 12px 32px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .continue-btn:hover {
      background-color: var(--accent-blue-hover);
    }

    /* =========================================================
       [화면 3] 회차별 풀이 이력 모달 (History Modal)
       ========================================================= */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .modal-box {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 90%;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 28px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .modal-close-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .history-item {
      background-color: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .history-item-info {
      font-size: 0.9rem;
    }

    .history-item-date {
      color: var(--text-sub);
      font-size: 0.8rem;
      margin-bottom: 4px;
    }

    .history-retry-btn {
      background-color: var(--card-bg);
      border: 1px solid var(--error-orange);
      color: var(--error-orange);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .history-retry-btn:hover {
      background-color: var(--error-orange);
      color: #fff;
    }

    /* 세션 완료 화면 */
    .complete-card {
      text-align: center;
      padding: 48px 24px;
    }

    .complete-icon {
      font-size: 3rem;
      color: var(--correct-green);
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <!-- 상단 네비게이션 헤더 -->
  <header class="top-header">
    <div class="header-left">
      <div class="brand-title" id="nav-brand" onclick="goHome()">
        <i class="fa-solid fa-clone"></i>
        <span>학습하기</span>
      </div>
    </div>
    <div class="header-right">
      <button class="header-icon-btn" onclick="toggleHistoryModal()" title="회차별 풀이 이력"><i class="fa-solid fa-clock-rotate-left"></i></button>
      <button class="header-icon-btn" onclick="goHome()" title="나가기"><i class="fa-solid fa-xmark"></i></button>
    </div>
  </header>

  <!-- 메인 뷰 컨테이너 -->
  <main class="main-container">
    
    <!-- [화면 1] 퀴즐렛 스타일 과목 목록 화면 -->
    <div id="subject-view">
      <div class="filter-bar">
        <select class="select-dropdown" id="period-filter" onchange="filterSubjects()">
          <option value="all">전체 교시</option>
          <option value="1">1교시 과목</option>
          <option value="2">2교시 과목</option>
        </select>
        <div class="search-input-box">
          <input type="text" id="subject-search" placeholder="제목으로 필터링" oninput="filterSubjects()">
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>
      </div>

      <div class="section-label" id="section-date-label">과목 및 기출문제 세트</div>
      <div class="subject-list" id="subject-list-container">
        <!-- 과목 카드 목록이 동적으로 렌더링됩니다 -->
      </div>
    </div>

    <!-- [화면 2] 퀴즐렛 스타일 단일 카드 문제풀이 화면 -->
    <div id="quiz-view">
      <!-- 구간형 진행바 -->
      <div class="progress-wrapper">
        <div class="progress-count-badge badge-correct" id="quiz-badge-correct">0</div>
        <div class="segmented-progress-bar" id="segmented-bar">
          <!-- 세그먼트 엘리먼트 동적 삽입 -->
        </div>
        <div class="progress-count-badge badge-total" id="quiz-badge-total">0</div>
      </div>

      <!-- 문제 카드 -->
      <div class="quiz-card" id="quiz-card-box">
        <div>
          <div class="quiz-card-header">단어 • 문제</div>
          <div class="quiz-question-title" id="quiz-question-text">문제가 여기에 표시됩니다.</div>
          <div class="status-msg-banner" id="status-msg-banner">걱정하지 마세요, 아직 배우고 있잖아요!</div>
        </div>

        <div>
          <div class="options-grid" id="quiz-options-container">
            <!-- 5지선다 버튼 동적 생성 -->
          </div>
          <div class="quiz-card-footer">
            <button class="dont-know-btn" id="dont-know-btn" onclick="handleDontKnow()">
              <i class="fa-regular fa-flag"></i> 모르시겠어요?
            </button>
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- 하단 정답 피드백 액션바 -->
  <div class="bottom-feedback-bar" id="bottom-feedback-bar">
    <div class="feedback-hint-text">정답을 클릭하거나 아무 키나 눌러 계속하세요</div>
    <button class="continue-btn" id="continue-btn" onclick="nextQuestion()">계속</button>
  </div>

  <!-- [화면 3] 회차별 풀이 이력 모달 -->
  <div class="modal-overlay" id="history-modal" onclick="closeModalOnOverlay(event)">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title">회차별 풀이 이력</div>
        <button class="modal-close-btn" onclick="toggleHistoryModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="history-list-container">
        <!-- 회차 이력 동적 렌더링 -->
      </div>
    </div>
  </div>

  <!-- =========================================================
       11개 기본 과목 + 11개 기출 과목 스크립트 연결
       ========================================================= -->
  <script src="./data/anatomy.js"></script>
  <script src="./data/anatomy_past.js"></script>
  <script src="./data/morphology.js"></script>
  <script src="./data/morphology_past.js"></script>
  <script src="./data/hygiene.js"></script>
  <script src="./data/hygiene_past.js"></script>
  <script src="./data/materials.js"></script>
  <script src="./data/materials_past.js"></script>
  <script src="./data/law.js"></script>
  <script src="./data/law_past.js"></script>

  <script src="./data/crown_bridge.js"></script>
  <script src="./data/crown_bridge_past.js"></script>
  <script src="./data/porcelain.js"></script>
  <script src="./data/porcelain_past.js"></script>
  <script src="./data/complete_denture.js"></script>
  <script src="./data/complete_denture_past.js"></script>
  <script src="./data/partial_denture.js"></script>
  <script src="./data/partial_denture_past.js"></script>
  <script src="./data/restorative.js"></script>
  <script src="./data/restorative_past.js"></script>
  <script src="./data/orthodontics.js"></script>
  <script src="./data/orthodontics_past.js"></script>

  <!-- =========================================================
       어플리케이션 코어 로직
       ========================================================= -->
  <script>
    // 과목 메타데이터 정의
    const subjectMeta = [
      // 1교시
      { key: 'anatomy', name: '구강해부학 (1교시 1~12)', period: 1 },
      { key: 'anatomy_past', name: '구강해부학 국시기출 (19~25년)', period: 1 },
      { key: 'morphology', name: '치아형태학 (1교시 13~28)', period: 1 },
      { key: 'morphology_past', name: '치아형태학 국시기출 (19~25년)', period: 1 },
      { key: 'hygiene', name: '구강보건학 (1교시 29~40)', period: 1 },
      { key: 'hygiene_past', name: '구강보건학 국시기출 (19~25년)', period: 1 },
      { key: 'materials', name: '치과재료학 (1교시 41~75)', period: 1 },
      { key: 'materials_past', name: '치과재료학 국시기출 (19~25년)', period: 1 },
      { key: 'law', name: '의료관계법규 (1교시 76~95)', period: 1 },
      { key: 'law_past', name: '의료관계법규 국시기출 (19~25년)', period: 1 },

      // 2교시
      { key: 'crown_bridge', name: '관교의치기공학 (2교시 1~19)', period: 2 },
      { key: 'crown_bridge_past', name: '관교의치기공학 국시기출 (19~25년)', period: 2 },
      { key: 'porcelain', name: '도재기공학 (2교시 20~34)', period: 2 },
      { key: 'porcelain_past', name: '도재기공학 국시기출 (19~25년)', period: 2 },
      { key: 'complete_denture', name: '총의치기공학 (2교시 35~58)', period: 2 },
      { key: 'complete_denture_past', name: '총의치기공학 국시기출 (19~25년)', period: 2 },
      { key: 'partial_denture', name: '국소의치기공학 (2교시 59~82)', period: 2 },
      { key: 'partial_denture_past', name: '국소의치기공학 국시기출 (19~25년)', period: 2 },
      { key: 'restorative', name: '충전기공학 (2교시 83~96)', period: 2 },
      { key: 'restorative_past', name: '충전기공학 국시기출 (19~25년)', period: 2 },
      { key: 'orthodontics', name: '교정기공학 (2교시 97~110)', period: 2 },
      { key: 'orthodontics_past', name: '교정기공학 국시기출 (19~25년)', period: 2 }
    ];

    // 앱 상태 관리
    let currentSubjectKey = null;
    let quizQuestions = [];
    let currentIndex = 0;
    let correctCount = 0;
    let currentSessionWrongItems = []; // 현재 세션 중 틀린 문항 추적
    let isAnswerChecked = false;

    // 로컬 스토리지 키
    const STORAGE_KEY_HISTORY = 'quizlet_exam_history_v1';

    // 1. 초기 로드
    window.addEventListener('DOMContentLoaded', () => {
      renderSubjectList();
      window.addEventListener('keydown', handleGlobalKeydown);
    });

    // 2. 과목 목록 렌더링
    function renderSubjectList() {
      const container = document.getElementById('subject-list-container');
      const periodVal = document.getElementById('period-filter').value;
      const searchVal = document.getElementById('subject-search').value.trim().toLowerCase();
      const db = window.quizDatabase || {};
      const history = getHistory();

      container.innerHTML = '';

      subjectMeta.forEach(meta => {
        // 필터 조건 체크
        if (periodVal !== 'all' && meta.period !== parseInt(periodVal)) return;
        if (searchVal && !meta.name.toLowerCase().includes(searchVal)) return;

        const subData = db[meta.key];
        const count = subData && subData.questions ? subData.questions.length : 0;

        // 해당 과목의 가장 최근 풀이 이력 가져오기
        const subjectHistories = history.filter(h => h.subjectKey === meta.key);
        const latestRecord = subjectHistories.length > 0 ? subjectHistories[0] : null;

        const card = document.createElement('div');
        card.className = 'subject-card';
        card.onclick = () => startQuiz(meta.key);

        let recentWrongBadgeHtml = '';
        if (latestRecord && latestRecord.wrongIds && latestRecord.wrongIds.length > 0) {
          recentWrongBadgeHtml = `
            <div class="recent-wrong-badge" title="최근 회차에서 틀린 문제 수">
              <i class="fa-solid fa-triangle-exclamation"></i>
              최근 오답 ${latestRecord.wrongIds.length}
            </div>
          `;
        }

        card.innerHTML = `
          <div class="subject-card-left">
            <div class="card-icon-box">
              <i class="fa-regular fa-clone"></i>
            </div>
            <div>
              <div class="subject-info-title">${meta.name}</div>
              <div class="subject-info-sub">
                <span>낱말카드 세트</span>
                <span>${count} 문항</span>
                <span>${meta.period}교시</span>
              </div>
            </div>
          </div>
          <div class="subject-card-right">
            ${recentWrongBadgeHtml}
            <button class="card-more-btn" onclick="event.stopPropagation(); openSubjectHistory('${meta.key}')" title="이력 보기">
              <i class="fa-solid fa-ellipsis"></i>
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterSubjects() {
      renderSubjectList();
    }

    // 3. 퀴즈 세션 시작
    function startQuiz(key, specificQuestions = null) {
      const db = window.quizDatabase || {};
      const sub = db[key];
      if (!sub || !sub.questions || sub.questions.length === 0) {
        alert('문항 데이터를 불러올 수 없습니다.');
        return;
      }

      currentSubjectKey = key;
      quizQuestions = specificQuestions ? specificQuestions : [...sub.questions];
      currentIndex = 0;
      correctCount = 0;
      currentSessionWrongItems = [];
      isAnswerChecked = false;

      // 뷰 전환
      document.getElementById('subject-view').style.display = 'none';
      document.getElementById('quiz-view').style.display = 'block';
      document.getElementById('bottom-feedback-bar').style.display = 'none';

      initProgressBar();
      renderCurrentQuestion();
    }

    // 홈 화면 복귀
    function goHome() {
      document.getElementById('quiz-view').style.display = 'none';
      document.getElementById('bottom-feedback-bar').style.display = 'none';
      document.getElementById('subject-view').style.display = 'block';
      renderSubjectList();
    }

    // 4. 진행바 초기화
    function initProgressBar() {
      const barContainer = document.getElementById('segmented-bar');
      barContainer.innerHTML = '';
      quizQuestions.forEach((_, idx) => {
        const seg = document.createElement('div');
        seg.className = 'progress-segment';
        seg.id = `seg-${idx}`;
        barContainer.appendChild(seg);
      });
      document.getElementById('quiz-badge-correct').innerText = '0';
      document.getElementById('quiz-badge-total').innerText = quizQuestions.length;
    }

    // 5. 단일 카드 문제 렌더링
    function renderCurrentQuestion() {
      isAnswerChecked = false;
      document.getElementById('bottom-feedback-bar').style.display = 'none';
      document.getElementById('status-msg-banner').style.display = 'none';

      const q = quizQuestions[currentIndex];
      document.getElementById('quiz-question-text').innerText = `${currentIndex + 1}. ${q.question}`;

      const optContainer = document.getElementById('quiz-options-container');
      optContainer.innerHTML = '';

      q.options.forEach((optText, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.onclick = () => selectAnswer(idx + 1);
        btn.innerHTML = `
          <span class="option-idx">${idx + 1}</span>
          <span>${optText}</span>
        `;
        optContainer.appendChild(btn);
      });
    }

    // 6. 답안 선택 및 판정 처리
    function selectAnswer(userPick) {
      if (isAnswerChecked) return;
      isAnswerChecked = true;

      const q = quizQuestions[currentIndex];
      const isCorrect = userPick === q.answer;
      const optButtons = document.querySelectorAll('.option-btn');
      const segment = document.getElementById(`seg-${currentIndex}`);

      // 모든 버튼 비활성화
      optButtons.forEach(btn => btn.classList.add('disabled'));

      if (isCorrect) {
        correctCount++;
        document.getElementById('quiz-badge-correct').innerText = correctCount;
        if (segment) segment.classList.add('passed');

        // 정답 버튼 강조
        optButtons[userPick - 1].classList.add('correct-choice');
        optButtons[userPick - 1].innerHTML = `
          <span class="option-idx"><i class="fa-solid fa-check"></i></span>
          <span>${q.options[userPick - 1]}</span>
        `;

        // 0.6초 후 다음 문제 자동 진행
        setTimeout(() => {
          nextQuestion();
        }, 650);

      } else {
        // 오답 처리
        currentSessionWrongItems.push(q);
        if (segment) segment.classList.add('failed');

        // 사용자가 고른 오답 표시
        if (userPick > 0 && userPick <= optButtons.length) {
          optButtons[userPick - 1].classList.add('wrong-choice');
          optButtons[userPick - 1].innerHTML = `
            <span class="option-idx"><i class="fa-solid fa-xmark"></i></span>
            <span>${q.options[userPick - 1]}</span>
          `;
        }

        // 실제 정답 점선 하이라이트
        optButtons[q.answer - 1].classList.add('correct-highlight');

        // 안내 배너 및 하단 액션바 등장
        document.getElementById('status-msg-banner').style.display = 'block';
        document.getElementById('bottom-feedback-bar').style.display = 'flex';
      }
    }

    // '모르시겠어요?' 클릭 시 오답으로 처리
    function handleDontKnow() {
      if (isAnswerChecked) return;
      selectAnswer(-1); // 없는 번호 전달
    }

    // 7. 다음 문항 이동
    function nextQuestion() {
      currentIndex++;
      if (currentIndex < quizQuestions.length) {
        renderCurrentQuestion();
      } else {
        finishQuizSession();
      }
    }

    // 8. 퀴즈 세션 종료 및 이력 저장
    function finishQuizSession() {
      document.getElementById('bottom-feedback-bar').style.display = 'none';

      // 풀이 이력 저장 (회차별)
      const wrongIds = currentSessionWrongItems.map(item => item.id);
      saveSessionHistory(currentSubjectKey, quizQuestions.length, correctCount, wrongIds);

      // 세션 완료 화면
      const cardBox = document.getElementById('quiz-card-box');
      cardBox.innerHTML = `
        <div class="complete-card">
          <div class="complete-icon"><i class="fa-solid fa-circle-check"></i></div>
          <h2 style="font-size: 1.5rem; margin-bottom: 12px;">학습을 완료했습니다!</h2>
          <p style="color: var(--text-sub); margin-bottom: 28px;">
            총 ${quizQuestions.length}문항 중 <strong style="color: var(--correct-green);">${correctCount}문항</strong> 정답
            ${wrongIds.length > 0 ? `<br><span style="color: var(--error-orange);">오답 ${wrongIds.length}문항</span>` : ''}
          </p>
          <div style="display: flex; gap: 12px; justify-content: center;">
            <button class="continue-btn" onclick="goHome()">세트 목록으로</button>
            ${wrongIds.length > 0 ? `
              <button class="history-retry-btn" style="padding: 12px 24px; font-size: 0.95rem;" onclick="retryWrongQuestions()">
                오답 ${wrongIds.length}문제 다시 풀기
              </button>
            ` : ''}
          </div>
        </div>
      `;
    }

    // 틀린 문제만 다시 풀기
    function retryWrongQuestions() {
      startQuiz(currentSubjectKey, currentSessionWrongItems);
    }

    // 키보드 인터랙션 (1~5 숫자키, Enter, Space)
    function handleGlobalKeydown(e) {
      if (document.getElementById('quiz-view').style.display !== 'block') return;

      if (!isAnswerChecked) {
        if (['1', '2', '3', '4', '5'].includes(e.key)) {
          const pick = parseInt(e.key);
          const q = quizQuestions[currentIndex];
          if (q && pick <= q.options.length) {
            selectAnswer(pick);
          }
        }
      } else {
        // 이미 답변 체크된 상태에서 하단 바가 열려있을 때 계속 진행
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          nextQuestion();
        }
      }
    }

    // =========================================================
    // 회차별 풀이 이력 (Local Storage) 관리
    // =========================================================
    function getHistory() {
      try {
        const data = localStorage.getItem(STORAGE_KEY_HISTORY);
        return data ? JSON.parse(data) : [];
      } catch (e) {
        return [];
      }
    }

    function saveSessionHistory(subjectKey, total, correct, wrongIds) {
      const history = getHistory();
      const meta = subjectMeta.find(m => m.key === subjectKey);
      const newEntry = {
        id: Date.now(),
        subjectKey: subjectKey,
        subjectName: meta ? meta.name : subjectKey,
        date: new Date().toLocaleString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
        total: total,
        correct: correct,
        wrongIds: wrongIds
      };
      history.unshift(newEntry);
      // 최근 30개 이력만 보관
      if (history.length > 30) history.pop();
      localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(history));
    }

    // 이력 모달 토글
    function toggleHistoryModal() {
      const modal = document.getElementById('history-modal');
      const isVisible = modal.style.display === 'flex';
      modal.style.display = isVisible ? 'none' : 'flex';
      if (!isVisible) {
        renderHistoryList();
      }
    }

    function openSubjectHistory(targetKey) {
      toggleHistoryModal();
      renderHistoryList(targetKey);
    }

    function closeModalOnOverlay(e) {
      if (e.target.id === 'history-modal') {
        toggleHistoryModal();
      }
    }

    // 이력 모달 내부 리스트 렌더링
    function renderHistoryList(filterKey = null) {
      const container = document.getElementById('history-list-container');
      const history = getHistory();
      const filtered = filterKey ? history.filter(h => h.subjectKey === filterKey) : history;

      if (filtered.length === 0) {
        container.innerHTML = '<div style="color: var(--text-sub); text-align: center; padding: 32px 0;">풀이 이력이 없습니다.</div>';
        return;
      }

      container.innerHTML = '';
      filtered.forEach(item => {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerHTML = `
          <div>
            <div class="history-item-date">${item.date}</div>
            <div style="font-weight: 600; margin-bottom: 2px;">${item.subjectName}</div>
            <div style="font-size: 0.82rem; color: var(--text-sub);">
              점수: ${item.correct} / ${item.total}
              ${item.wrongIds && item.wrongIds.length > 0 ? `<span style="color: var(--error-orange); margin-left: 6px;">(오답 ${item.wrongIds.length})</span>` : '<span style="color: var(--correct-green); margin-left: 6px;">(만점)</span>'}
            </div>
          </div>
          <div>
            ${item.wrongIds && item.wrongIds.length > 0 ? `
              <button class="history-retry-btn" onclick="retrySpecificHistory(${item.id})">
                오답 풀기
              </button>
            ` : ''}
          </div>
        `;
        container.appendChild(div);
      });
    }

    // 특정 회차의 오답만 모아서 풀기
    function retrySpecificHistory(historyId) {
      const history = getHistory();
      const record = history.find(h => h.id === historyId);
      if (!record || !record.wrongIds || record.wrongIds.length === 0) return;

      const db = window.quizDatabase || {};
      const sub = db[record.subjectKey];
      if (!sub) return;

      // 해당 회차의 틀린 id와 일치하는 문제 추출
      const wrongQuestions = sub.questions.filter(q => record.wrongIds.includes(q.id));
      if (wrongQuestions.length === 0) {
        alert('문제를 찾을 수 없습니다.');
        return;
      }

      toggleHistoryModal();
      startQuiz(record.subjectKey, wrongQuestions);
    }
  </script>
</body>
</html>
